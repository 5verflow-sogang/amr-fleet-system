<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>푸드코트 로봇 관제</title>
<!--
  관제 대시보드 + 직원 호출 (HTML 한 장, 외부 라이브러리 없음). 화면과 문구는 「관제 대시보드 개발 명세서」를 따른다.
  rosbridge_server(WebSocket)로 docs/api.md의 토픽만 쓴다.
    받기   /fleet/robot_states, /fleet/task_table, /fleet/task_status, /fleet/congestion, /amr_0N/safety/status, /clock
           /fleet/assignment_decisions (배정 판단. 메시지가 생기면 바로 쓴다), /amr_0N/plan (경로)
    보내기 /fleet/task_requests
  주소 옵션: ws, collect_priority, collect_type, aging_rate, clock, min_hall (README.md)
  시험: window.dashTest.feed(topic, msg)로 rosbridge 없이 메시지를 넣는다 (test/)
  어두운 바탕. 색은 평소 회색, 관제가 방금 판단한 것은 파랑, 직원이 누르는 것은 하늘색, 충전은 주황, 혼잡·문제만 빨강
  (ISA-101 고성능 HMI처럼 색을 아껴 쓴다). 지도는 실내 지도 앱(Mappedin)의 2D 보기처럼 회색 한 계열로 조용하게 그린다
-->
<style>
  /* 어두운 화면: 스크린·영상에서 밝기가 날아가도 글자가 보이게, 본문 글자는 바탕과 대비 5:1 이상.
     파랑(--acc) = 관제가 판단한 것, 하늘색(--sky) = 직원이 누르는 것(테이블, 호출 버튼) */
  :root {
    --bg: #0d1117; --panel: #161b22; --raise: #1c222b; --ink: #e8edf3; --ink2: #c3ccd6; --quiet: #a2adba; --faint: #8893a0;
    --edge: #262e39; --line: #3a4452; --tint: #1f2630; --floor: #1d242d; --cell: #2c3440; --fill: #aab5c2;
    --acc: #6ea8ff; --acc-soft: #1a2c4a; --acc-line: #3d62a0; --chg: #ffa94d; --chg-soft: #3a2914;
    --hot: #ff6b6b; --sky: #7dd3fc; --sky-ink: #082f49; --sky-soft: #0d2a3a; --sky-line: #2f6b8a; --sky-text: #bae6fd; --sky-dis: #8cc4dc; --sky-hover: #a5e3fd; --sky-on-line: #e0f4ff; --hot-soft: #3c1c1f; --ok: #3ddc84;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body { font: 14px/1.35 Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
         color: var(--ink); background: var(--bg); position: relative; word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; }
  svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  header { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--edge); }
  header h1 { margin: 0; font-size: 16.5px; letter-spacing: -.2px; display: flex; align-items: center; gap: 9px; }
  header .logo { width: 24px; height: 24px; border-radius: 7px; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
  header .logo svg { width: 15px; height: 15px; }
  header .right { display: flex; gap: 14px; align-items: center; color: var(--quiet); }
  header .clock { color: var(--ink); font-weight: 650; font-size: 15px; letter-spacing: .2px; }
  header .since { font-size: 12.5px; color: var(--faint); }
  .conn { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px 3px 9px; border-radius: 999px; background: #10291c; color: var(--ok); font-size: 13px; font-weight: 600; }
  .conn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(61, 220, 132, .5); animation: live 2s infinite; }
  .conn.bad { background: var(--hot-soft); color: var(--hot); } .conn.bad::before { background: var(--hot); animation: none; }
  @keyframes live { 70% { box-shadow: 0 0 0 6px rgba(61, 220, 132, 0); } 100% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0); } }
  body.offline .summary, body.offline .main { opacity: .5; }

  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px 16px 0; }
  .tile { height: 56px; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 6px 14px; box-shadow: var(--shadow); position: relative; }
  .tile .k { font-size: 12.5px; color: var(--quiet); display: flex; align-items: center; gap: 6px; font-weight: 500; }
  .tile .v { font-size: 26px; font-weight: 750; line-height: 1.1; margin-top: 1px; letter-spacing: -.5px; display: flex; align-items: baseline; }
  .tile .v small { font-size: 14.5px; font-weight: 600; color: var(--quiet); margin-left: 3px; letter-spacing: 0; }
  .tile .v .goal, .tile .v .sub { font-size: 12.5px; font-weight: 500; color: var(--quiet); margin-left: 10px; letter-spacing: 0; }
  .tile.hot .v, .tile.hot .v small { color: var(--hot); }
  .tile.click { cursor: pointer; } .tile.click:hover { border-color: var(--line); }
  .tile .spark { position: absolute; right: 14px; bottom: 5px; display: flex; align-items: flex-end; gap: 6px; } .tile .spark .cap { font-size: 12px; color: var(--faint); line-height: 1; }

  /* 지도를 왼쪽에 크게(1 m = 32 px), 로봇은 맨 아래 한 줄. 오른쪽은 관제 판단·작업 순서·호출 */
  .main { display: grid; grid-template-columns: 778px 1fr; grid-template-rows: 1fr 60px; gap: 8px 10px; padding: 10px 16px; height: calc(720px - 44px - 66px); }
  #p-map { grid-row: 1; grid-column: 1; padding: 4px; position: relative; }
  .mapchip { position: absolute; top: 20px; right: 24px; z-index: 2; font-size: 12.5px; font-weight: 600; color: var(--quiet); background: rgba(15, 20, 27, .85); border: 1px solid var(--line); padding: 3px 10px; border-radius: 999px; }
  .col { grid-row: 1; grid-column: 2; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 10px 12px; min-height: 0; box-shadow: var(--shadow); }
  .panel h2 { margin: 0 0 7px; font-size: 13.5px; font-weight: 650; display: flex; align-items: center; gap: 6px; color: var(--ink2); }
  .panel h2 small { margin-left: auto; font-size: 12.5px; color: var(--quiet); font-weight: 400; }

  #map { display: block; user-select: none; border-radius: 8px; }
  #map .table { cursor: pointer; } #map .table:hover rect, #map .table:hover ellipse { stroke: var(--sky); stroke-width: 2; }
  #map .bot { cursor: pointer; transition: transform .5s linear; }
  #map .bot .body { filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .7)); }
  #map .glow { filter: drop-shadow(0 0 6px rgba(110, 168, 255, .75)); }
  #map .flow { animation: flow .9s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -11; } }
  #map .bot .head { transition: transform .5s linear; }
  #map .blink { animation: blink .5s ease-in-out infinite alternate; }
  @keyframes blink { from { opacity: 1; } to { opacity: .15; } }
  #map .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }
  #map .draw { animation: draw .8s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  #p-robots { grid-row: 2; grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 14px; }
  #p-robots h2 { margin: 0; width: 82px; flex: none; flex-direction: column; align-items: flex-start; gap: 3px; }
  #p-robots h2 .t { display: flex; align-items: center; gap: 6px; }
  #p-robots h2 small { margin-left: 0; font-size: 12px; }
  .robots { flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .rc { height: 44px; border: 1px solid var(--edge); border-radius: 10px; padding: 4px 10px 4px 11px; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; align-content: center; cursor: pointer; background: var(--raise); transition: border-color .2s, box-shadow .2s; }
  .rc:hover { border-color: var(--line); }
  .rc.acc { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
  .rc.hot { border-color: #7a2f35; background: #241719; }
  .rc .n { grid-column: 1; font-weight: 700; font-size: 14.5px; display: flex; align-items: center; gap: 7px; min-width: 0; }
  .st { font-size: 12px; font-weight: 650; padding: 1px 7px; letter-spacing: -.2px; border-radius: 999px; background: #2a323d; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .st.idle { background: var(--tint); color: var(--quiet); } .st.acc { background: var(--acc-soft); color: var(--acc); }
  .st.chg { background: var(--chg-soft); color: var(--chg); } .st.hot { background: var(--hot-soft); color: var(--hot); }
  .st:empty { display: none; }
  .rc .d { grid-column: 1; font-size: 12.5px; color: var(--quiet); min-height: 17px; padding-left: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rc .bat { grid-column: 2; grid-row: 1 / 3; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 4px; font-size: 12.5px; color: var(--ink2); }
  .rc .bat .cells { width: 58px; flex: none; }
  /* 배터리 5칸: 한 칸 = 20%. 맨 아래(왼쪽) 칸만 남으면 충전할 때 */
  .cells { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; height: 8px; }
  .cells span { background: var(--cell); border-radius: 2px; overflow: hidden; position: relative; }
  .cells span i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--fill); }
  .cells.chg span i { background: var(--chg); } .cells.hot span i { background: var(--hot); }
  .bat .hot { color: var(--hot); font-weight: 700; }

  .decide { cursor: pointer; position: relative; overflow: hidden; }
  .decide.fresh::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--acc); }
  .decide .big { font-size: 25px; font-weight: 750; color: var(--acc); margin: 0 0 3px; letter-spacing: -.4px; }
  .decide .line { color: var(--ink); }
  .decide .why { margin-top: 2px; color: var(--ink2); display: flex; align-items: center; gap: 5px; }
  .decide .why svg { color: var(--acc); }
  .decide .empty { color: var(--faint); padding: 8px 0 2px; }
  .cmp { width: 100%; border-collapse: collapse; margin-top: 9px; font-size: 13.5px; }
  .cmp th { text-align: right; color: var(--quiet); font-weight: 500; font-size: 12px; padding: 3px 10px; border-bottom: 1px solid var(--edge); }
  .cmp th:first-child, .cmp td:first-child { text-align: left; }
  .cmp td { text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--edge); }
  .cmp tr.pick td { color: var(--acc); font-weight: 700; background: var(--acc-soft); }
  .cmp tr.pick td:first-child { border-radius: 6px 0 0 6px; } .cmp tr.pick td:last-child { border-radius: 0 6px 6px 0; }

  #p-queue { flex: 1; overflow: hidden; }
  .q { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .q tr { cursor: pointer; }
  .q td { height: 30px; padding: 0 6px; border-bottom: 1px solid var(--edge); white-space: nowrap; }
  .q tr:hover td { background: var(--tint); }
  .q .rk { width: 24px; color: var(--faint); font-weight: 600; text-align: center; } .q .kind { width: 64px; }
  /* 작업 이름표: 회색 하나, 충전만 주황. 파랑·빨강은 판단·문제에 남겨 둔다 */
  .tag { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 650; padding: 2px 8px 2px 6px; border-radius: 6px; background: #2a323d; color: var(--ink2); vertical-align: 1px; }
  .tag svg.i { width: 13px; height: 13px; stroke-width: 2; }
  .tag.chg { background: var(--chg-soft); color: var(--chg); }
  .tl { display: inline-flex; align-items: center; gap: 7px; }
  .bot { font-weight: 700; color: var(--acc); margin-left: 7px; }
  .retry { color: var(--hot); font-weight: 700; margin-left: 7px; }
  .q .w { width: 136px; } .wait { display: flex; align-items: center; gap: 9px; justify-content: flex-end; }
  .wait .b { width: 76px; height: 6px; border-radius: 3px; background: var(--cell); overflow: hidden; position: relative; }
  .wait .b i { display: block; height: 100%; border-radius: 3px; background: var(--fill); }
  .wait .t { width: 34px; text-align: right; }
  .q tr.late .wait .b i { background: var(--hot); } .q tr.late .wait .t { color: var(--hot); font-weight: 700; }
  .q tr.new td { background: var(--acc-soft); } .q tr.new .wait .b i { background: var(--acc); } .q tr.new .wait .t { color: var(--acc); font-weight: 700; }
  .q tr.more td { color: var(--quiet); cursor: default; background: none; }
  .empty { color: var(--faint); padding: 10px 2px; }

  #p-call { height: 114px; flex: none; }
  .call .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn.big { display: inline-flex; gap: 7px; align-items: center; justify-content: center; font-weight: 700; padding: 8px 12px; }
  .btn.big svg.i { width: 17px; height: 17px; }
  .call .under { margin-top: 7px; min-height: 32px; display: flex; align-items: center; }
  .call .stores { display: flex; gap: 6px; flex: 1; }
  .call .stores .btn { flex: 1; padding: 6px 4px; }
  /* 호출 버튼은 직원이 누르는 것이라 하늘색. 테이블을 고르기 전에도 늘 보이고, 고르면 꽉 찬 하늘색 */
  .call .btn.big { background: var(--sky-soft); border-color: var(--sky-line); color: var(--sky-text); }
  .call .btn.big:disabled { opacity: 1; color: var(--sky-dis); }
  .call .btn.big:not(:disabled) { background: var(--sky); border-color: var(--sky); color: var(--sky-ink); }
  .call .btn.big:hover:not(:disabled) { background: var(--sky-hover); border-color: var(--sky-hover); }
  .call .btn.big.on { background: var(--sky-text); border-color: var(--sky-on-line); color: var(--sky-ink); box-shadow: 0 0 0 3px rgba(125, 211, 252, .25); }
  .call .stores .btn { border-color: var(--sky-line); color: var(--sky-text); background: var(--sky-soft); }
  .call .stores .btn:hover:not(:disabled) { background: var(--sky); color: var(--sky-ink); border-color: var(--sky); }
  .btn { font: inherit; font-size: 13.5px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--raise); padding: 8px 12px; white-space: nowrap; cursor: pointer; color: var(--ink); transition: background .15s, border-color .15s; }
  .btn:hover:not(:disabled) { border-color: var(--acc-line); background: #1d2635; }
  .btn.pill { border-radius: 999px; padding: 7px 12px; } .btn:disabled { opacity: .45; cursor: default; }
  .toast { font-size: 13.5px; min-height: 18px; display: flex; align-items: center; gap: 6px; }
  .toast:not(:empty) { animation: rise .25s ease-out; }
  .toast:not(:empty)::before { content: "i"; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--acc); color: var(--bg); font-size: 11px; font-weight: 700; }
  .toast.hot { color: var(--hot); } .toast.hot:not(:empty)::before { content: "!"; background: var(--hot); }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }

  .pop { position: absolute; z-index: 8; width: 300px; background: #1e252f; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 36px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .35); padding: 12px 14px; animation: pop .16s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } }
  .pop h3 { margin: 0 0 9px; font-size: 15px; display: flex; align-items: center; gap: 7px; }
  .pop h3 .st { margin-left: 0; }
  .pop h3 .x { margin-left: auto; color: var(--faint); font-weight: 400; font-size: 16px; cursor: pointer; padding: 0 2px; }
  .pop h3 .x:hover { color: var(--ink); }
  .pop .kv { display: grid; grid-template-columns: 76px 1fr; row-gap: 7px; font-size: 13.5px; }
  .pop .kv .k { color: var(--quiet); }
  .pop .alert { background: var(--hot-soft); color: var(--hot); border-radius: 9px; padding: 8px 10px; margin-bottom: 10px; font-size: 13.5px; line-height: 1.55; }
  .pop .alert b { font-weight: 700; }
  .pop .steps { list-style: none; margin: 0; padding: 0; font-size: 13.5px; position: relative; }
  .pop .steps li { display: flex; justify-content: space-between; padding: 4px 0 4px 22px; position: relative; color: var(--faint); }
  .pop .steps li::before { content: ""; position: absolute; left: 3px; top: 9px; width: 9px; height: 9px; border-radius: 50%; border: 1.8px solid var(--line); background: #1e252f; z-index: 1; }
  .pop .steps li::after { content: ""; position: absolute; left: 7.4px; top: 17px; bottom: -8px; border-left: 1.5px solid var(--edge); }
  .pop .steps li:last-child::after { display: none; }
  .pop .steps li.done { color: var(--ink); } .pop .steps li.done::before { background: var(--quiet); border-color: var(--quiet); }
  .pop .steps li.done::after { border-color: var(--faint); }
  .pop .steps li.now { color: var(--acc); font-weight: 700; } .pop .steps li.now::before { background: var(--acc); border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
  .pop .kv .cells { height: 8px; width: 64px; flex: none; }
  .pop .batrow { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .pop:not(.wide) { width: 340px; }
  /* 배터리 창: 5대를 세로 5칸 막대로 나란히 (스토리보드 3-02·3-04) */
  .pop.wide { width: 552px; padding: 14px 18px 16px; }
  .vbars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; text-align: center; }
  .vbar { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .vcells { display: grid; grid-template-rows: repeat(5, 1fr); gap: 3px; width: 46px; height: 190px; }
  .vcells span { background: var(--cell); border-radius: 4px; position: relative; overflow: hidden; }
  .vcells span i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--fill); }
  .vcells.chg span i { background: var(--chg); } .vcells.hot span i { background: var(--hot); }
  .vbar .who { font-weight: 700; font-size: 14.5px; margin-top: 2px; }
  .vbar .pct { font-size: 20px; font-weight: 750; letter-spacing: -.3px; }
  .vbar .pct.hot { color: var(--hot); }

</style>
</head>

  <h1><span class="logo"><svg class="i"><use href="#i-robot"/></svg></span>푸드코트 로봇 관제</h1>
  <div class="right"><span class="since" id="since"></span><span class="clock num" id="clock"></span><span class="conn bad" id="conn">연결 끊김 · 재연결 중</span></div>

  <section class="panel" id="p-map"><small id="mhint" class="mapchip"></small><svg id="map" width="768" height="512" viewBox="0 0 672 448" role="img" aria-label="식당 지도"></svg></section>

  </div>
  <section class="panel" id="p-robots"><h2><span class="t"><svg class="i"><use href="#i-robot"/></svg>로봇</span><small id="rhint"></small></h2><div class="robots" id="robots"></div></section>
</div>
<div class="pop" id="pop" hidden></div>
<script>
'use strict';

// ---- 설정 (주소 옵션, README.md) ----
const query = new URLSearchParams(location.search);
const optNum = (key, fallback) => { const v = query.get(key); return v === null || v === '' || isNaN(Number(v)) ? fallback : Number(v); };
const parseHms = text => { const m = /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(text || ''); return m ? m[1] * 3600 + m[2] * 60 + Number(m[3] || 0) : null; };
const OPT = {
  // compose에서는 화면이 8080(안에서는 8081), rosbridge가 9090(안에서는 9091)이다
  ws: query.get('ws') || `ws://${location.hostname || 'localhost'}:${location.port === '8081' ? 9091 : 9090}`,
  collectPriority: optNum('collect_priority', 200),
  // 회수 작업 종류 TYPE_COLLECT(3, #302). 0이면 TYPE_DELIVERY로 보내고 task_id 접두사 collect_로 구분한다
  collectType: optNum('collect_type', 3),
  agingRate: optNum('aging_rate', 0),
  clock: parseHms(query.get('clock')),
  minHall: optNum('min_hall', null),
};
const DELIVER_PRIORITY = 100;
const ROBOT_IDS = ['amr_01', 'amr_02', 'amr_03', 'amr_04', 'amr_05'];
// 시간 기준 (s). 명세서 3장
const T = { waitLine: 60, stopCount: 1, stopHelp: 30, fresh: 10, keepAssigned: 5, lost: 5, judged: 10, ring: 3, toast: 4, low: 20, recent: 5 };
const TYPE = { DELIVERY: 0, CHARGE: 1, RETURN: 2, COLLECT: 3 };
const MODE = { IDLE: 0, BUSY: 1, CHARGING: 2, ERROR: 3, ESTOP: 4 };
const STATE = { PENDING: 0, IN_PROGRESS: 1, COMPLETED: 2, FAILED: 3 };

// ---- 식당 (amr_fleet_manager/config/stations_restaurant.yaml, map = world) ----
const S = {
  stall_1: [-4.5, 4.15, 1.5708], stall_2: [-1.5, 4.15, 1.5708], stall_3: [1.5, 4.15, 1.5708], stall_4: [4.5, 4.15, 1.5708],
  buffet_1: [-9.9, 4.15, 1.5708], buffet_2: [-8.1, 4.15, 1.5708],
  t01: [-8.8, 2.73, -1.5708], t02: [-5.75, 2.73, -1.5708], t03: [-2.7, 2.73, -1.5708], t04: [0.35, 2.73, -1.5708], t05: [3.4, 2.73, -1.5708],
  t06: [-8.8, -0.27, -1.5708], t07: [-5.75, -0.27, -1.5708], t08: [-2.7, -0.27, -1.5708], t09: [0.35, -0.27, -1.5708], t10: [3.4, -0.27, -1.5708],
  t11: [-8.8, -3.27, -1.5708], t12: [-5.75, -3.27, -1.5708], t13: [-2.7, -3.27, -1.5708], t14: [0.35, -3.27, -1.5708], t15: [3.4, -3.27, -1.5708],
  L01: [6.1, 3.983, -1.5708], L02: [8.806, 3.983, -1.5708], L03: [6.1, -1.655, 1.5708], L04: [8.806, -1.655, 1.5708],
  b01: [10.32, 3.55, 0], b02: [10.32, 1.5, 0], b03: [10.32, -0.55, 0], c01: [6.6, -2.91, -1.5708], c02: [8.6, -2.91, -1.5708],
  return_1: [-1.15, -6.6, -1.5708], return_2: [1.15, -6.6, -1.5708],
};
const STORES = [['buffet_1', '배식대'], ['stall_1', '한식'], ['stall_2', '분식'], ['stall_3', '양식'], ['stall_4', '카페']];
const NAME = id => {
  const store = STORES.find(s => s[0] === id);
  if (store) return store[1];
  if (/^buffet_/.test(id)) return '배식대';
  if (/^t\d\d$/.test(id)) return `${Number(id.slice(1))}번 테이블`;
  if (/^L\d\d$/.test(id)) return `6인석 L${Number(id.slice(1))}`;
  if (/^b\d\d$/.test(id)) return `부스 B${Number(id.slice(1))}`;
  if (/^c\d\d$/.test(id)) return `2인석 C${Number(id.slice(1))}`;
  if (/^return/.test(id)) return '퇴식구';
  if (/^charger/.test(id)) return '충전소';
  if (/^wait/.test(id)) return '대기 자리';
  return id || '';
};
// 테이블 모양 [cx, cy, 가로, 세로] (식당 월드 v2)
const TABLES = {};
[-8.8, -5.75, -2.7, 0.35, 3.4].forEach((x, c) => [1.7, -1.3, -4.3].forEach((y, r) => { TABLES['t' + String(r * 5 + c + 1).padStart(2, '0')] = [x, y, 0.75, 1.2]; }));
Object.assign(TABLES, { L01: [6.1, 2.6, 0.8, 1.8], L02: [8.806, 2.6, 0.8, 1.8], L03: [6.1, -0.272, 0.8, 1.8], L04: [8.806, -0.272, 0.8, 1.8],
  b01: [11.125, 3.55, 0.75, 1.2], b02: [11.125, 1.5, 0.75, 1.2], b03: [11.125, -0.55, 0.75, 1.2], c01: [6.6, -3.8, 0.61, 0.93], c02: [8.6, -3.8, 0.61, 0.93] });

// ---- 시간 ----
let simNow = null;                       // /clock (s). 모의 로봇처럼 /clock이 없으면 벽시계를 쓴다
const now = () => simNow ?? Date.now() / 1000;
const wall = () => Date.now() / 1000;
const secOf = t => (t ? t.sec + t.nanosec / 1e9 : 0);
const stamp = t => ({ sec: Math.floor(t), nanosec: Math.round((t % 1) * 1e9) });
const pad = n => String(n).padStart(2, '0');
const mmss = s => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const hms = s => { s = Math.floor(((s % 86400) + 86400) % 86400); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; };
// now()와 같은 기준의 시각 t를 화면 시각으로
const clockText = t => {
  if (simNow === null) { const d = new Date(t * 1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
  return hms((OPT.clock ?? 0) + t);
};

// ---- 상태 ----
const robots = {};       // id → { msg, seenWall, modeSince, stop, stops, heading, xy }
const safety = {};       // id → { level, reason, at }
let records = [];        // FleetTaskTable.records
const tasks = {};        // task_id → { firstSeen, assignee, assignedAt, steps, phase, failed, freshAt, orderJudged, raised }
let zones = [];
const plans = {};        // id → { pts, goalKey, taskId }
const decisionMsgs = {}; // task_id → AssignmentDecision
let decision = null;     // 관제 판단 1건
let selected = null;     // 고른 테이블
let connected = false;
let pop = null;          // 열린 자세히 창 { kind: 'robot' | 'task', id, from }
let toast = null;        // { text, hot, until }
const doneIds = new Set();
const doneKinds = {};    // task_id → '서빙' | '회수' | '충전' (완료 칸 아래 줄)
let serveOpen = false;   // 음식 서빙을 눌러 매장 버튼이 펼쳐짐
const pendingSends = []; // 서버 표에 아직 안 보이는 내 호출 (중복 방지)
const hallHistory = [];  // [t, 대수] 1초마다, 3분
let stopTotal = 0, lastHallSample = 0, lastIdle = new Set();
const pageOpen = wall();
let countFrom = null;    // 안전 정지·완료를 세기 시작한 시각 (페이지를 연 때)
const num = id => Number((String(id).match(/(\d+)$/) || [0, 0])[1]);
const botName = id => `${num(id)}호`;

// ---- 작업 ----
const isCollect = t => t.task_type === TYPE.COLLECT || /^(dash_)?collect_/.test(t.task_id);
// 복귀(TYPE_RETURN)는 충전을 마친 로봇을 서버가 대기 자리로 보내는 작업. 손님 일이 아니라 작업 순서·관제 판단·완료에 넣지 않고 로봇 칩으로만 보인다
const isReturn = t => t.task_type === TYPE.RETURN;
const kindOf = t => (t.task_type === TYPE.CHARGE ? '충전' : isReturn(t) ? '복귀' : isCollect(t) ? '회수' : '서빙');
const KIND_ICON = { 서빙: 'serve', 회수: 'dish', 충전: 'bolt', 복귀: 'robot' };
// 작업 이름표 + 경로. 이름표 모양은 어디서나 같다 (작업 순서, 관제 판단, 자세히 창)
const tagOf = t => { const k = kindOf(t); return `<span class="tag ${k === '충전' ? 'chg' : ''}">${icon(KIND_ICON[k])}${k}</span>`; };
const taskHtml = t => `<span class="tl">${tagOf(t)}<span>${esc(routeOf(t))}</span></span>`;
const routeOf = t => (t.task_type === TYPE.CHARGE ? '충전소' : isCollect(t) ? `${NAME(t.pickup_station_id)} → 퇴식구`
  : t.pickup_station_id ? `${NAME(t.pickup_station_id)} → ${NAME(t.dropoff_station_id)}` : NAME(t.dropoff_station_id));
const recordOf = id => records.find(r => r.task.task_id === id);
const createdOf = r => secOf(r.task.created_time) || tasks[r.task.task_id]?.firstSeen || now();
// 로봇의 완료 보고(task_status)가 작업표보다 먼저 오므로 둘 중 하나라도 끝났으면 끝난 작업이다
const finished = r => r.state === STATE.COMPLETED || r.state === STATE.FAILED || doneIds.has(r.task.task_id);
const effOf = (r, t) => r.task.priority + OPT.agingRate * Math.max(0, t - createdOf(r));
// 문구 템플릿 1: 작업 단계와 로봇 상태는 2글자 명사 하나. 작업 창 단계와 로봇 칩이 같은 말을 쓴다
const STEPS = ['요청', '배정', '이동', '픽업', '운반', '전달', '완료'];
const CHARGE_STEPS = ['요청', '배정', '이동', '충전', '완료'];
// TaskStatus.phase → 단계 이름 (로봇 칩과 같은 말)
const stepOfPhase = (phase, info, charge) => {
  if (!phase) return null;
  if (charge) return /charg/.test(phase) ? '충전' : '이동';
  if (phase === 'move_to_pickup') return '이동';
  if (phase === 'loading') return '픽업';
  if (phase === 'move_to_dropoff') return '운반';
  if (phase === 'unloading') return '전달';
  if (phase === 'docking') return info.steps['운반'] ? '전달' : '픽업';
  return null;
};

// 기다리는 작업(처리 순서대로)과 방금 배정된 작업 (명세 3-5)
function queueOf(t = now()) {
  const waiting = records.filter(r => !r.assignee_id && !finished(r) && !isReturn(r.task))
    .sort((a, b) => effOf(b, t) - effOf(a, t) || createdOf(a) - createdOf(b) || (a.task.task_id < b.task.task_id ? -1 : 1));
  const assigned = records.filter(r => r.assignee_id && !finished(r) && !isReturn(r.task) && tasks[r.task.task_id]?.assignedAt != null
    && t - tasks[r.task.task_id].assignedAt <= T.keepAssigned);
  return { waiting, assigned };
}

// ---- 메시지 받기 ----
function onRobotState(m) {
  const r = robots[m.robot_id] ??= { stops: 0, stop: null, modeSince: now(), heading: null };
  if (r.msg?.mode !== m.mode) r.modeSince = now();
  const x = m.pose.position.x, y = m.pose.position.y, q = m.pose.orientation;
  // 가는 방향: 움직였으면 움직인 쪽, 아니면 자세의 yaw
  if (r.xy && Math.hypot(x - r.xy[0], y - r.xy[1]) > 0.03) r.heading = Math.atan2(y - r.xy[1], x - r.xy[0]);
  else if (r.heading === null && q) r.heading = Math.atan2(2 * (q.w * q.z + q.x * q.y), 1 - 2 * (q.y * q.y + q.z * q.z));
  r.xy = [x, y]; r.msg = m; r.seenWall = wall();
}

// /clock이 처음 오면 시간 기준이 벽시계에서 시뮬레이션 시간으로 바뀐다. 벽시계로 찍어 둔 시각을 버린다
// (세는 숫자는 그대로 두고, 세기 시작한 시각만 시뮬레이션 시간으로)
function onFirstClock() {
  countFrom = simNow; hallHistory.length = 0; lastHallSample = 0; decision = null;
  for (const r of Object.values(robots)) { r.modeSince = simNow; r.stop = null; }
  for (const info of Object.values(tasks)) { info.steps = {}; info.firstSeen = simNow; info.freshAt = -Infinity; info.assignedAt = null; }
}

function onTaskTable(m) {
  records = m.records || [];
  for (const r of records) {
    const id = r.task.task_id, info = tasks[id] ??= { firstSeen: now(), steps: {} };
    // 작업표에서 처음 본 작업이 오래전에 만들어졌으면(페이지를 열기 전부터 있던 작업) "방금"으로 보지 않는다.
    // 로봇의 단계 보고(task_status)가 작업표보다 먼저 올 수 있어 작업표 기준으로 가린다
    const isNew = !info.tableSeen;
    info.tableSeen = true;
    const recent = now() - (secOf(r.task.created_time) || info.firstSeen) <= T.recent;
    if (isNew) info.freshAt = recent ? now() : -Infinity;
    info.steps['요청'] ??= secOf(r.task.created_time) || info.firstSeen;
    if (doneIds.has(id)) doneKinds[id] ??= kindOf(r.task);   // 완료 보고가 작업표보다 먼저 온 작업
    if (r.assignee_id && !info.assignee) {
      info.assignee = r.assignee_id;
      if (isNew && !recent) continue;
      info.assignedAt = now(); info.steps['배정'] ??= now(); onAssigned(r);
    }
    if (!r.assignee_id && info.assignee) info.assignee = null;   // 실패해서 다시 큐로 돌아옴
  }
  for (let i = pendingSends.length - 1; i >= 0; i--) if (tasks[pendingSends[i].id]) pendingSends.splice(i, 1);
}

function onTaskStatus(m) {
  const info = tasks[m.task_id] ??= { firstSeen: now(), steps: {}, freshAt: -Infinity };
  const r = recordOf(m.task_id), charge = r?.task.task_type === TYPE.CHARGE;
  if (m.state === STATE.COMPLETED) {
    info.steps['완료'] ??= now(); doneIds.add(m.task_id);
    if (r) doneKinds[m.task_id] ??= kindOf(r.task);
    return;
  }
  if (m.state === STATE.FAILED) {
    info.failed = true; info.phase = '';
    for (const k of Object.keys(info.steps)) if (k !== '요청') delete info.steps[k];
    return;
  }
  info.phase = m.phase;
  // 로봇의 단계 보고가 작업표보다 먼저 오면 그때를 배정 시각으로 본다
  if (m.state === STATE.PENDING || m.state === STATE.IN_PROGRESS) info.steps['배정'] ??= now();
  const step = stepOfPhase(m.phase, info, charge);
  if (step) info.steps[step] ??= now();
}

function onSafety(id, m) { safety[id] = { level: m.level, reason: m.reason, at: wall() }; }

function onPlan(id, m) {
  const pts = (m.poses || []).map(p => [p.pose.position.x, p.pose.position.y]);
  if (!pts.length) return;
  const last = pts[pts.length - 1], goalKey = `${last[0].toFixed(1)},${last[1].toFixed(1)}`;
  plans[id] = { pts, goalKey, taskId: robots[id]?.msg?.current_task_id || '' };
}

function onDecision(m) {
  decisionMsgs[m.task_id] = m;
  // 배정이 표보다 늦게 오면 지금 판단에 비교 표를 채운다
  if (decision?.taskId === m.task_id && decision.kind === 'assign') decision = assignDecision(recordOf(m.task_id), m.robot_id, decision.at);
}

function handle(topic, msg) {
  let m;
  if (topic === '/fleet/robot_states') onRobotState(msg);
  else if (topic === '/fleet/task_table') onTaskTable(msg);
  else if (topic === '/fleet/task_status') onTaskStatus(msg);
  else if (topic === '/fleet/congestion') zones = msg.zones || [];
  else if (topic === '/fleet/assignment_decisions') onDecision(msg);
  else if (topic === '/clock') { const first = simNow === null; simNow = secOf(msg.clock); if (first) onFirstClock(); }
  else if ((m = /^\/(amr_\d+)\/safety\/status$/.exec(topic))) onSafety(m[1], msg);
  else if ((m = /^\/(amr_\d+)\/plan$/.exec(topic))) onPlan(m[1], msg);
}

// ---- 로봇 상태 (명세 3-6) ----
function currentTask(m) { return m?.current_task_id ? recordOf(m.current_task_id)?.task : null; }
function judgedRobot() { return decision && decision.robot && now() - decision.at <= T.judged ? decision.robot : null; }

function robotView(id) {
  const r = robots[id], v = { id, n: botName(id), chip: '', tone: 'idle', place: '', problem: null, since: 0 };
  if (!r || wall() - r.seenWall > T.lost) {
    if (!r && wall() - pageOpen < T.lost) return v;
    return { ...v, chip: '연결 끊김', tone: 'hot', problem: '연결 끊김', since: r ? now() - (wall() - r.seenWall) : now() - (wall() - pageOpen) };
  }
  const m = r.msg, task = currentTask(m);
  if (m.mode === MODE.ESTOP) return { ...v, chip: '비상 정지', tone: 'hot', place: '비상 버튼', problem: '비상 버튼', since: r.modeSince };
  if (m.mode === MODE.ERROR) return { ...v, chip: '오류', tone: 'hot', problem: '오류', since: r.modeSince };
  if (r.stop && r.stop.counted) {
    // SafetyStatus.reason: 1 근접·2 충돌 시간 → 장애물 감지, 3 E-Stop 요청 → 비상 버튼, 4 → 센서 이상
    const why = r.stop.reason === 4 ? '센서 이상' : r.stop.reason === 3 ? '비상 버튼' : '장애물 감지';
    return { ...v, chip: '안전 정지', tone: 'hot', place: why, problem: why, since: r.stop.since, stopped: true };
  }
  let out;
  // 충전·충전하러 이동은 홀에서 빠진 로봇 (offHall)
  if (m.mode === MODE.CHARGING) out = { ...v, chip: '충전', tone: 'chg', offHall: true };
  else if (task && task.task_type === TYPE.CHARGE) out = { ...v, chip: '이동', tone: 'chg', place: NAME(task.dropoff_station_id), offHall: true };
  else if (task && isReturn(task)) out = { ...v, chip: '복귀', tone: 'busy', place: NAME(task.dropoff_station_id) };
  else if (task) {
    const info = tasks[task.task_id] || { steps: {} };
    const step = stepOfPhase(info.phase, info, false) || (task.pickup_station_id ? '이동' : '운반');
    const before = step === '이동' || step === '픽업';
    out = { ...v, chip: step, tone: 'busy', place: NAME(before ? task.pickup_station_id : task.dropoff_station_id) };
  } else out = { ...v, chip: '대기', tone: 'idle' };
  if (judgedRobot() === id) out.tone = 'acc';
  return out;
}

const OFF_HALL = ['오류', '비상 정지', '연결 끊김'];
const offHall = v => v.offHall || OFF_HALL.includes(v.chip);
const hallCount = (except = null) => ROBOT_IDS.filter(id => id !== except && robots[id] && !offHall(robotView(id))).length;
// 사람이 가 봐야 하는 로봇: 오류, 비상 정지, 연결 끊김, 30초 넘은 안전 정지 (BrainOS "Robot Needs Assistance")
const needsHelp = v => v.tone === 'hot' && (!v.stopped || now() - v.since >= T.stopHelp);

// 안전 정지: safety/status level 2 이상이 1초 넘게 이어지면 1회 (명세 3-2)
function updateStops() {
  for (const id of ROBOT_IDS) {
    const r = robots[id], s = safety[id];
    if (!r) continue;
    if (s && s.level >= 2 && wall() - s.at < 2) {
      r.stop ??= { since: now(), counted: false, reason: s.reason };
      if (!r.stop.counted && now() - r.stop.since >= T.stopCount) { r.stop.counted = true; r.stops += 1; stopTotal += 1; }
    } else r.stop = null;
  }
}

// ---- 관제 판단 (명세 3-4) ----
// 문구 템플릿 2: 결정("N호 배정" / "{작업} N순위") · 작업(이름표 + 경로) · 근거(아래 이름 + 필요하면 " · 수치")
const WHY = { nearest: '최단 거리', congestion: '혼잡 회피', only: '대기 로봇 1대', collect: '회수 우선', order: '요청 순서', aging: '장기 대기', charge: '교대 충전' };
function assignDecision(r, robot, at) {
  const task = r.task, msg = decisionMsgs[task.task_id];
  const d = { kind: 'assign', at, taskId: task.task_id, robot, big: `${botName(robot)} 배정`, line: taskHtml(task), why: '', cmp: null, congestion: false, candidates: [] };
  if (msg && msg.candidates?.length) {
    const c = [...msg.candidates].sort((a, b) => a.cost - b.cost);
    const nearest = [...c].sort((a, b) => a.distance - b.distance)[0];
    d.candidates = c.map(x => x.robot_id);
    d.congestion = msg.cost_fn === 'congestion';
    if (c.length === 1) d.why = WHY.only;
    else if (nearest.robot_id === robot) d.why = WHY.nearest;
    else if (d.congestion) d.why = WHY.congestion;
    d.cmp = c.slice(0, 3).map(x => ({ n: botName(x.robot_id), dist: x.distance, crowd: x.congested_length, pick: x.robot_id === robot }));
  } else if (lastIdle.size === 1 && lastIdle.has(robot)) d.why = WHY.only;
  return d;
}

// 충전 배정: 근거 수치는 이 로봇이 빠진 뒤 홀에 남는 대수
function chargeDecision(r, robot, at) {
  return { kind: 'charge', at, taskId: r.task.task_id, robot, big: `${botName(robot)} 배정`, line: taskHtml(r.task),
    why: `${WHY.charge} · 홀 투입 ${hallCount(robot)}대`, cmp: null, candidates: [] };
}

// 같은 순간에 여러 건이면 가장 늦게 들어온 작업의 판단을 보인다
function setDecision(d) {
  if (decision && Math.abs(decision.at - d.at) < 0.3) {
    const a = recordOf(decision.taskId), b = recordOf(d.taskId);
    if (a && b && createdOf(a) > createdOf(b)) return;
  }
  decision = d;
}

function onAssigned(r) {
  const robot = r.assignee_id;
  if (isReturn(r.task)) return;
  setDecision(r.task.task_type === TYPE.CHARGE ? chargeDecision(r, robot, now()) : assignDecision(r, robot, now()));
}

// 회수가 들어와 선 자리. aging은 기다리던 작업끼리의 순서를 바꾸지 않고(모두 같은 속도로 오른다),
// 새로 온 회수가 오래 기다린 서빙 뒤에 서는 순간에만 드러난다 → 서빙 N순위 · 장기 대기
function updateOrderDecisions(waiting) {
  const t = now(), order = (big, r, why) => ({ kind: 'order', at: t, taskId: r.task.task_id, robot: null, big, line: taskHtml(r.task), why, cmp: null, candidates: [] });
  waiting.forEach((r, i) => {
    const info = tasks[r.task.task_id];
    if (!info) return;
    if (isCollect(r.task) && !info.orderJudged) {
      info.orderJudged = true;
      const deliveries = waiting.filter(x => !isCollect(x.task));
      if (deliveries.length && t - info.firstSeen <= T.recent) {
        const behind = deliveries.filter(x => waiting.indexOf(x) > i).length, ahead = deliveries.length - behind;
        if (behind && !ahead) setDecision(order(`회수 ${i + 1}순위`, r, WHY.collect));
        else if (OPT.collectPriority <= DELIVER_PRIORITY) setDecision(order(`회수 ${i + 1}순위`, r, WHY.order));
      }
    }
    if (!isCollect(r.task) && !info.raised && OPT.agingRate > 0 && r.task.priority < OPT.collectPriority
        && waiting.slice(i + 1).some(x => isCollect(x.task))) {
      info.raised = true; info.freshAt = t;
      setDecision(order(`서빙 ${i + 1}순위`, r, `${WHY.aging} · ${mmss(t - createdOf(r))}`));
    }
  });
}

// 혼잡 이름표 자리: 구역 안 후보 자리(위·가운데·아래 × 왼·가운데·오른) 중 테이블·번호·이름·로봇·다른 이름표를 가장 덜 가리는 곳
function chipSpot(area, w, h, taken) {
  const [x0, x1, y0, y1] = area, L = X(x0) + 5, R = X(x1) - 5, T = Y(y1) + 5, B = Y(y0) - 5;
  const xs = R - L >= w ? [L, (L + R - w) / 2, R - w] : [Math.max(4, Math.min(672 - w - 4, (L + R - w) / 2))];
  const ys = []; for (let y = T; y <= B - h + .01; y += 6) ys.push(y); if (!ys.length) ys.push(Math.max(4, (T + B - h) / 2));
  const boxes = [...Object.values(TABLES).map(([cx, cy, tw, th]) => [X(cx - tw / 2) - 3, Y(cy + th / 2) - 3, X(cx + tw / 2) + 3, Y(cy - th / 2) + 3]),
    ...[...nameLayer.querySelectorAll('text')].map(t => { const b = t.getBBox(); return [b.x - 2, b.y - 2, b.x + b.width + 2, b.y + b.height + 2]; }),
    ...ROBOT_IDS.filter(id => robots[id]?.xy).map(id => { const [x, y] = robots[id].xy; return [X(x) - 16, Y(y) - 16, X(x) + 16, Y(y) + 16]; }), ...taken];
  let best = null;
  for (const y of ys) for (const x of xs) {
    const pen = boxes.reduce((s, [a, b, c, d]) => s + Math.max(0, Math.min(c, x + w) - Math.max(a, x)) * Math.max(0, Math.min(d, y + h) - Math.max(b, y)), 0);
    if (!best || pen < best.pen - .5) best = { x, y, pen };
  }
  return best;
}

// 혼잡 구역: 0.3 미만은 그리지 않고, 0.3~0.5는 옅게, 0.5 이상은 진하게 + 빨간 이름표 "혼잡 N명" (명세 3-3)

    if (!strong) continue;
    const text = `혼잡 ${z.people_count}명`, w = 18 + text.length * 11.5, h = 21, s = chipSpot(z.area, w, h, taken);
    taken.push([s.x - 3, s.y - 3, s.x + w + 3, s.y + h + 3]); hole(chipHoles, { x: s.x, y: s.y, width: w, height: h }, 2);

// 경로: /amr_0N/plan이 있으면 실선(그려 나감), 없으면 목적지까지 점선. 판단한 로봇은 굵은 파랑이고 점선이 흐른다. 나머지는 흐리게
function drawPaths() {
  for (const id of ROBOT_IDS) {
    const r = robots[id], v = robotView(id), task = currentTask(r?.msg), stroke = PATH[v.tone];
    let want = null;
    if (r && task) {
      const plan = plans[id];
      if (plan && plan.taskId === task.task_id) want = { key: `p${plan.goalKey}`, pts: plan.pts, dashed: false };
      else {
        const info = tasks[task.task_id] || { steps: {} };
        const before = task.pickup_station_id && !info.steps['운반'];
        const goal = before ? task.pickup_pose.position : task.dropoff_pose.position;
        want = { key: `g${goal.x.toFixed(1)},${goal.y.toFixed(1)}`, pts: [r.xy, [goal.x, goal.y]], dashed: true };
      }
    }
    let cur = pathEls[id];
    if (!want) { if (cur) { cur.g.remove(); delete pathEls[id]; } continue; }
    if (!cur || cur.key !== want.key) {
      if (cur) cur.g.remove();
      const g = el('g', {}, pathLayer);
      const line = el('polyline', { fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
      const dot = el('circle', {}, g);
      cur = pathEls[id] = { key: want.key, g, line, dot, fresh: true };
    }
    const strong = v.tone === 'acc' || v.tone === 'hot';
    cur.line.setAttribute('points', want.pts.map(([x, y]) => `${X(x)},${Y(y)}`).join(' '));
    cur.line.setAttribute('stroke', stroke); cur.line.setAttribute('stroke-width', strong ? 4.5 : 2.2); cur.line.setAttribute('stroke-opacity', strong ? .95 : .5);
    const [gx, gy] = want.pts[want.pts.length - 1];
    cur.dot.setAttribute('cx', X(gx)); cur.dot.setAttribute('cy', Y(gy)); cur.dot.setAttribute('r', strong ? 5.5 : 3.5); cur.dot.setAttribute('fill', stroke);
    cur.dot.setAttribute('fill-opacity', strong ? 1 : .6);
    if (want.dashed) {

      cur.line.classList.toggle('flow', v.tone === 'acc');
    } else if (cur.fresh) {
      const len = cur.line.getTotalLength();
      cur.line.setAttribute('stroke-dasharray', len); cur.line.setAttribute('stroke-dashoffset', len); cur.line.classList.add('draw');
    }
    cur.fresh = false;
  }
}

// 로봇: 동그란 번호 표시(그림자) + 가는 방향 삼각형. 같은 표시를 계속 써서 위치가 미끄러지듯 바뀐다
function drawRobots() {
  const ringOn = decision && now() - decision.at <= T.ring ? new Set(decision.candidates) : new Set();
  for (const id of ROBOT_IDS) {
    const r = robots[id];

    if (!b) {
      const g = el('g', { class: 'bot', id: `bot-${id}` }, botLayer);
      const rings = el('g', {}, g);
      const head = el('path', { class: 'head', d: 'M20 0 L13 -5 L13 5 Z' }, g);
      const body = el('circle', { class: 'body', r: 12, 'stroke-width': 2.4, filter: 'url(#pin)' }, g);
      const text = el('text', { y: 4.5, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 800 }, g);
      text.textContent = num(id);
      g.addEventListener('click', e => { e.stopPropagation(); openPop('robot', id, 'bot'); });
      b = botEls[id] = { g, rings, head, body, text };
    }
    b.g.style.transform = `translate(${X(r.xy[0])}px, ${Y(r.xy[1])}px)`;
    b.body.setAttribute('fill', fill); b.body.setAttribute('stroke', ring); b.text.setAttribute('fill', ink);
    b.head.setAttribute('fill', v.tone === 'idle' || v.tone === 'busy' ? '#aab5c2' : fill);
    b.head.style.display = r.heading === null || v.chip === '대기' ? 'none' : '';
    b.head.style.transform = `rotate(${-(r.heading ?? 0) * 180 / Math.PI}deg)`;
    const want = `${ringOn.has(id) && judgedRobot() !== id ? 'c' : ''}${judgedRobot() === id ? 'j' : ''}${v.tone === 'hot' ? 'h' : ''}${pop?.kind === 'robot' && pop.id === id ? 's' : ''}`;
    if (b.ringKey !== want) {
      b.ringKey = want; b.rings.replaceChildren();
      if (want.includes('c')) el('circle', { r: 18.5, fill: 'none', stroke: '#aab5c2', 'stroke-width': 1.5, 'stroke-dasharray': '3 3', class: 'blink' }, b.rings);
      if (want.includes('j')) { el('circle', { r: 19, fill: '#6ea8ff', opacity: .15 }, b.rings); el('circle', { r: 17, fill: 'none', stroke: '#6ea8ff', 'stroke-width': 2, class: 'pulse' }, b.rings); }
      if (want.includes('h')) el('circle', { r: 17, fill: 'none', stroke: '#ff6b6b', 'stroke-width': 2, class: 'pulse' }, b.rings);
      if (want.includes('s')) el('circle', { r: 19.5, fill: 'none', stroke: '#e8edf3', 'stroke-width': 2 }, b.rings);
    }
  }
}

// ---- 그리기: 영역 ----
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const icon = name => `<svg class="i"><use href="#i-${name}"/></svg>`;
// 내용이 바뀔 때만 다시 쓴다 (누르는 중인 요소가 바뀌지 않게, 깜빡이지 않게)
const setHtml = (node, html) => { if (node._html !== html) { node._html = html; node.innerHTML = html; } };

function drawHeader() {
  $('clock').textContent = clockText(now());
  $('since').textContent = `집계 ${clockText(countFrom ?? now()).slice(0, 5)} ~ 지금`;   // 안전 정지·완료를 세기 시작한 시각
  const c = $('conn');
  c.textContent = connected ? '연결됨' : '연결 끊김 · 재연결 중';
  c.classList.toggle('bad', !connected);
  document.body.classList.toggle('offline', !connected);
}

// 숫자 칸 4개. 왼쪽 위 이름, 가운데 숫자, 문제일 때만 숫자가 빨갛다. 세는 범위는 상단 바 "집계 12:07 ~ 지금" 한 곳에
function drawSummary(waiting) {
  const hall = hallCount(), t = now(), min = OPT.minHall;
  const longest = waiting.reduce((m, r) => Math.max(m, t - createdOf(r)), 0);
  // 그래프: 10초 넘게 쌓인 뒤에 그린다 (점 몇 개로는 세로선처럼 보인다). 최소 대수 아래는 옅은 띠, 그 안에 들어간 선만 빨강
  const pts = !hallHistory.length || t - hallHistory[0][0] < 10 ? [] : hallHistory.map(([ht, n]) => `${Math.max(0, 100 - (t - ht) / 180 * 100).toFixed(1)},${30 - n * 5}`);
  const yMin = min != null ? 30 - min * 5 : null;
  const band = yMin != null ? `<rect x="0" y="${yMin}" width="100" height="${32 - yMin}" fill="#232b35"/><clipPath id="under"><rect x="0" y="${yMin + .6}" width="100" height="${32 - yMin}"/></clipPath>` : '';
  const line = c => `<polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"${c === '#ff6b6b' ? ' clip-path="url(#under)"' : ''}/>`;
  const spark = `<div class="spark"><span class="cap">3분</span><svg width="112" height="26" viewBox="0 0 100 32" preserveAspectRatio="none">${band}${line('#c3ccd6')}${yMin != null ? line('#ff6b6b') : ''}</svg></div>`;
  // 완료는 서빙·회수만 센다 (충전 작업은 손님 일이 아니다)
  const byKind = k => Object.values(doneKinds).filter(x => x === k).length, serve = byKind('서빙'), collect = byKind('회수');
  const tile = (ic, k, v, u, o = {}) => `<div class="tile ${o.hot ? 'hot' : ''} ${o.click ? 'click' : ''}" ${o.click ? `data-tile="${o.click}"` : ''}>
    <div class="k">${icon(ic)}${k}</div><div class="v num">${v}<small>${u}</small>${o.after ?? ''}</div>${o.extra ?? ''}</div>`;
  setHtml($('summary'), tile('robot', '홀 투입', hall, `/ ${ROBOT_IDS.length}대`,
      { hot: min != null && hall < min, click: 'hall', after: min != null ? `<span class="goal">최소 ${min}대</span>` : '', extra: spark })
    + tile('clock', '최장 대기', mmss(longest), '', { hot: longest >= T.waitLine })
    + tile('shield', '안전 정지', stopTotal, '회')
    + tile('check', '완료', serve + collect, '건', { after: serve + collect ? `<span class="sub">서빙 ${serve} · 회수 ${collect}</span>` : '' }));
}

// 배터리 5칸 (한 칸 = 20%): 칸마다 찬 만큼. 충전 중 주황, 20% 아래 빨강
const cellsOf = (b, tone, vertical = false) => [0, 1, 2, 3, 4].map(i => {
  const f = Math.max(0, Math.min(1, (b - i * 20) / 20)) * 100;
  return `<span><i style="${vertical ? 'height' : 'width'}:${f.toFixed(1)}%"></i></span>`;
});
const batTone = (b, chip) => (chip === '충전' ? 'chg' : b < T.low ? 'hot' : '');

// 로봇 (명세 3-6)
function drawRobotCards() {
  setHtml($('robots'), ROBOT_IDS.map(id => {
    const v = robotView(id), b = robots[id]?.msg?.battery_percent;
    const tone = b == null ? '' : batTone(b, v.chip);
    const bat = b == null ? '' : `<div class="bat"><span class="num ${tone === 'hot' ? 'hot' : ''}">${Math.round(b)}%</span>
      <span class="cells ${tone}">${cellsOf(b, tone).join('')}</span></div>`;
    return `<div class="rc ${v.tone === 'acc' || v.tone === 'hot' ? v.tone : ''}" id="rc-${id}" data-robot="${id}">
      <div class="n">${v.n}<span class="st ${v.tone}">${v.chip}</span></div>${bat}
      <div class="d">${esc(v.place)}</div></div>`;
  }).join(''));
}

// 관제 판단 (명세 3-4)
function drawDecision() {
  const d = decision, p = $('p-decide');
  p.classList.toggle('fresh', !!d && now() - d.at <= T.judged);
  // 위에 시계가 있으므로 판단 시각은 지난 시간으로 (방금 / 12초 전 / 3분 전)
  const ago = d ? now() - d.at : 0;
  const agoText = ago < 10 ? '방금' : ago < 60 ? `${Math.floor(ago)}초 전` : `${Math.floor(ago / 60)}분 전`;
  const title = `<h2>${icon('spark')}관제 판단${d ? ` <small class="num">${agoText}</small>` : ''}</h2>`;
  if (!d) { setHtml(p, `${title}<div class="empty">아직 판단 없음</div>`); return; }
  const cmp = d.cmp ? `<table class="cmp"><tr><th>로봇</th><th>거리</th>${d.congestion ? '<th>혼잡 구간</th>' : ''}</tr>${d.cmp.map(c =>
    `<tr class="${c.pick ? 'pick' : ''}"><td>${c.n}</td><td class="num">${c.dist.toFixed(1)} m</td>${d.congestion ? `<td class="num">${c.crowd.toFixed(1)} m</td>` : ''}</tr>`).join('')}</table>` : '';
  setHtml(p, `${title}<div class="big">${esc(d.big)}</div><div class="line">${d.line}</div>
    ${d.why ? `<div class="why">${icon('why')}${esc(d.why)}</div>` : ''}${cmp}`);
}

// 작업 순서 (명세 3-5). 행은 task_id로 다시 써서 순서가 바뀌면 미끄러지게 한다
const rowEls = {}, ROW_H = 31;   // .q td 높이 30 + 선 1
function drawQueue(q) {
  const t = now(), body = $('qbody');
  // 제목 오른쪽은 늘 "대기 N건"(배정을 기다리는 작업 수, 0건 포함). 비었을 때 본문은 비운다 (같은 말 두 번 쓰지 않게)
  $('qhint').textContent = `대기 ${q.waiting.length}건`;
  const items = [...q.assigned.map(r => ({ r, assigned: true })), ...q.waiting.map((r, i) => ({ r, rank: i + 1 }))];
  if (!items.length) { body._html = null; body.innerHTML = ''; for (const k in rowEls) delete rowEls[k]; return; }
  let table = body.querySelector('table.q');
  if (!table) { body.innerHTML = '<table class="q"><tbody></tbody></table>'; table = body.querySelector('table.q'); }
  const fit = Math.max(1, Math.floor(($('p-queue').getBoundingClientRect().bottom - body.getBoundingClientRect().top - 11) / ROW_H));
  const tbody = table.tBodies[0], shown = items.slice(0, items.length > fit ? fit - 1 : fit), before = {};
  let prev = null;
  for (const [k, tr] of Object.entries(rowEls)) before[k] = tr.getBoundingClientRect().top;
  const keep = new Set();
  for (const it of shown) {
    const id = it.r.task.task_id, info = tasks[id] || {}, keyId = `row-${id}`;
    keep.add(keyId);
    const tr = rowEls[keyId] ??= Object.assign(document.createElement('tr'), { id: keyId });
    tr.dataset.task = id;
    const wait = it.assigned ? info.assignedAt - createdOf(it.r) : t - createdOf(it.r);
    const fresh = t - (info.freshAt ?? -Infinity) <= T.fresh, late = !fresh && !it.assigned && wait >= T.waitLine;
    tr.className = `${fresh ? 'new' : ''} ${late ? 'late' : ''}`;
    // 막대는 1분에 꽉 찬다 (기준선 없이 "꽉 참 = 1분")
    setHtml(tr, `<td class="rk num">${it.assigned ? '' : it.rank}</td><td class="kind">${tagOf(it.r.task)}</td>
      <td>${esc(routeOf(it.r.task))}${it.assigned ? `<span class="bot">${botName(it.r.assignee_id)} 배정</span>` : ''}${!it.assigned && info.failed ? '<span class="retry">재배정 대기</span>' : ''}</td>
      <td class="w"><div class="wait"><span class="b">${wait >= 1 ? `<i style="width:${Math.min(100, wait / T.waitLine * 100)}%"></i>` : ''}</span><span class="num t">${mmss(wait)}</span></div></td>`);
    const want = prev ? prev.nextSibling : tbody.firstChild;   // 순서가 바뀐 줄만 옮긴다
    if (tr !== want) tbody.insertBefore(tr, want);
    prev = tr;
  }
  for (const k of Object.keys(rowEls)) if (!keep.has(k)) { rowEls[k].remove(); delete rowEls[k]; }
  tbody.querySelector('tr.more')?.remove();
  if (items.length > shown.length) {
    const more = document.createElement('tr'); more.className = 'more';
    more.innerHTML = `<td></td><td colspan="3">외 ${items.length - shown.length}건</td>`; tbody.appendChild(more);
  }
  for (const k of keep) {
    const tr = rowEls[k], dy = before[k] != null ? before[k] - tr.getBoundingClientRect().top : 0;
    if (!dy) continue;
    tr.style.transition = 'none'; tr.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(() => { tr.style.transition = 'transform .4s ease'; tr.style.transform = ''; });
  }
}

// 호출 (명세 3-7)
const activeCall = (kind, from, to) => records.some(r => !finished(r) && (kind === 'collect'
  ? isCollect(r.task) && r.task.pickup_station_id === from : !isCollect(r.task) && r.task.pickup_station_id === from && r.task.dropoff_station_id === to))
  || pendingSends.some(p => p.kind === kind && p.from === from && p.to === to && wall() - p.at < 10);
const nearestReturn = id => (Math.abs(S[id][0] - S.return_1[0]) <= Math.abs(S[id][0] - S.return_2[0]) ? 'return_1' : 'return_2');

// 회수·서빙 같은 크기 버튼. 음식 서빙을 누르면 아래 줄에 매장 버튼이 펼쳐지고, 보낸 뒤에는 그 줄에 알림이 뜬다
function drawCall() {
  const name = selected ? NAME(selected) : null, busy = selected && activeCall('collect', selected, null);
  const showToast = toast && wall() < toast.until, open = serveOpen && !!selected;
  const key = JSON.stringify([name, busy, open, STORES.map(([sid]) => selected && !activeCall('delivery', sid, selected)), showToast ? toast.text : '', showToast && toast.hot]);
  if ($('p-call').dataset.key === key) return;            // 바뀐 게 없으면 다시 그리지 않는다 (알림이 깜빡이지 않게)
  $('p-call').dataset.key = key;
  const under = open
    ? `<div class="stores">${STORES.map(([sid, n]) => `<button class="btn pill" data-store="${sid}" ${!activeCall('delivery', sid, selected) ? '' : 'disabled'}>${n}</button>`).join('')}</div>`
    : `<div class="toast ${showToast && toast.hot ? 'hot' : ''}">${showToast ? esc(toast.text) : ''}</div>`;
  $('p-call').innerHTML = `<h2>${icon('bell')}호출 <small style="${name ? 'color:var(--sky);font-weight:700' : ''}">${name ?? '지도에서 테이블을 고르세요'}</small></h2>
    <div class="two"><button class="btn big" id="collect" ${selected && !busy ? '' : 'disabled'}>${icon('dish')}${busy ? '회수 요청 완료' : '빈 그릇 회수'}</button>
    <button class="btn big ${open ? 'on' : ''}" id="serve" ${selected ? '' : 'disabled'}>${icon('serve')}음식 서빙</button></div>
    <div class="under">${under}</div>`;
}

// ---- 자세히 창 (명세 3-8) ----
function openPop(kind, id, from) { pop = { kind, id, from }; render(); }
function closePop() { if (pop) { pop = null; $('pop').hidden = true; } }

// 빨간 상자: "이유 · 지난 시간"(m:ss), 도움이 필요해지면(안전 정지는 30초 뒤) 아래 줄에 할 일
const HELP = { '장애물 감지': '로봇 앞 통로를 확보하세요', '센서 이상': '로봇 센서를 점검하세요', '비상 버튼': '현장에서 해제하세요',
  '오류': '현장에서 로봇을 점검하세요', '연결 끊김': '로봇 전원과 네트워크를 점검하세요' };
function problemBox(v) {
  if (v.tone !== 'hot' || !v.problem) return '';
  const help = needsHelp(v) ? HELP[v.problem] : '';
  return `<div class="alert"><b>${esc(v.problem)} · ${mmss(now() - v.since)}</b>${help ? `<br>${help}` : ''}</div>`;
}

// 로봇 창: 작업 줄은 맡은 작업이 있을 때만 (대기·충전은 제목 칩이 이미 말한다)
function robotPop(id) {
  const v = robotView(id), r = robots[id], task = currentTask(r?.msg), b = r?.msg?.battery_percent;
  const tone = b == null ? '' : batTone(b, v.chip);
  const bat = b == null ? '' : `<span class="k">배터리</span><span class="batrow"><span class="cells ${tone}">${cellsOf(b, tone).join('')}</span>
    <span class="num ${tone === 'hot' ? 'hot' : ''}">${Math.round(b)}%</span></span>`;
  return `<h3>${v.n} <span class="st ${v.tone}">${v.chip}</span><span class="x" data-close>✕</span></h3>${problemBox(v)}
    <div class="kv">${task && task.task_type !== TYPE.CHARGE && !isReturn(task) ? `<span class="k">작업</span><span>${taskHtml(task)}</span>` : ''}${bat}</div>`;
}

// 배터리 창: 5대를 세로 5칸 막대로 (스토리보드 3-02·3-04). 홀 투입 칸을 누르면 뜬다
// 막대·이름·%만 쓴다. 충전 중은 주황, 20% 아래는 빨강이고, 무엇을 하는지는 맨 아래 로봇 줄에 있다
function batteryPop() {
  const cols = ROBOT_IDS.map(id => {
    const r = robots[id], v = robotView(id), b = r?.msg?.battery_percent;
    if (b == null) return `<div class="vbar"><div class="vcells">${'<span></span>'.repeat(5)}</div><div class="who">${botName(id)}</div><div class="pct">-</div></div>`;
    const tone = batTone(b, v.chip);
    return `<div class="vbar"><div class="vcells ${tone}">${cellsOf(b, tone, true).reverse().join('')}</div>
      <div class="who">${botName(id)}</div><div class="pct num ${tone === 'hot' ? 'hot' : ''}">${Math.round(b)}%</div></div>`;
  }).join('');
  return `<h3>배터리<span class="x" data-close>✕</span></h3><div class="vbars">${cols}</div>`;
}

// 작업 창: 지난 단계는 시작 시각, 지금 단계는 "지금", 남은 단계는 흐리게
function taskPop(id) {
  const r = recordOf(id), info = tasks[id];
  if (!r || !info) return null;
  const names = r.task.task_type === TYPE.CHARGE ? CHARGE_STEPS : STEPS, done = doneIds.has(id) || r.state === STATE.COMPLETED;
  let cur = 0;
  names.forEach((n, i) => { if (info.steps[n] != null) cur = i; });
  if (!done && cur === 0) cur = 1;                          // 요청만 있으면 지금은 배정을 기다리는 중
  const items = names.map((n, i) => {
    const label = n === '배정' && r.assignee_id ? `${botName(r.assignee_id)} 배정` : n;
    if (done || i < cur) return `<li class="done"><span>${label}</span><span class="num">${info.steps[n] != null ? clockText(info.steps[n]) : ''}</span></li>`;
    if (i === cur) return `<li class="now"><span>${label}</span><span>${n === '배정' && !r.assignee_id ? '대기' : '지금'}</span></li>`;
    return `<li><span>${label}</span><span></span></li>`;
  }).join('');
  const robotBox = r.assignee_id && !finished(r) ? problemBox(robotView(r.assignee_id)) : '';
  return `<h3>${taskHtml(r.task)}<span class="x" data-close>✕</span></h3>${robotBox}<ol class="steps">${items}</ol>`;
}

function drawPop() {
  const box = $('pop');
  if (!pop) { box.hidden = true; return; }
  const html = pop.kind === 'robot' ? robotPop(pop.id) : pop.kind === 'battery' ? batteryPop() : taskPop(pop.id);
  if (!html) { closePop(); return; }
  box.classList.toggle('wide', pop.kind === 'battery');
  if (box.dataset.html !== html) { box.innerHTML = html; box.dataset.html = html; }
  const wasHidden = box.hidden; box.hidden = false;
  if (wasHidden) { box.style.animation = 'none'; void box.offsetWidth; box.style.animation = ''; }
  const anchor = pop.from === 'bot' ? $(`bot-${pop.id}`) : pop.from === 'card' ? $(`rc-${pop.id}`)
    : pop.from === 'tile' ? $('p-map') : pop.from === 'row' ? $(`row-${pop.id}`) || $('p-queue') : $('p-decide');
  if (!anchor) return;
  const a = anchor.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight;
  let left, top;
  if (pop.from === 'tile') { left = a.left + (a.width - w) / 2; top = a.top + 34; }
  else if (pop.from === 'card') { left = a.left; top = a.top - h - 10; }
  else if (pop.from === 'bot') { left = a.right + 12; top = a.top - 20; if (left + w > 1270) left = a.left - w - 12; }
  else { left = a.left - w - 10; top = a.top; }
  box.style.left = `${Math.max(10, Math.min(1270 - w, left))}px`;
  box.style.top = `${Math.max(10, Math.min(710 - h, top))}px`;
}

// ---- 이벤트 ----
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-close]')) { closePop(); render(); return; }
  if (t.closest('#pop')) return;
  const card = t.closest('[data-robot]'), row = t.closest('tr[data-task]'), dec = t.closest('#p-decide');
  if (card) { openPop('robot', card.dataset.robot, 'card'); return; }
  if (row) { openPop('task', row.dataset.task, 'row'); return; }
  if (dec && decision) { openPop('task', decision.taskId, 'decide'); return; }
  if (t.closest('[data-tile="hall"]')) { openPop('battery', null, 'tile'); return; }
  if (t.closest('#collect')) { serveOpen = false; send('collect'); return; }
  if (t.closest('#serve')) { serveOpen = !serveOpen; render(); return; }
  const store = t.closest('[data-store]');
  if (store) { serveOpen = false; send('delivery', store.dataset.store); return; }
  closePop(); render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePop(); render(); } });

// ---- rosbridge ----
let sock = null;
const SUBS = [
  ['/fleet/robot_states', 'amr_msgs/msg/RobotState', 0, 10],
  ['/fleet/task_table', 'amr_msgs/msg/FleetTaskTable', 500, 1],
  ['/fleet/task_status', 'amr_msgs/msg/TaskStatus', 0, 50],
  ['/fleet/congestion', 'amr_msgs/msg/ZoneCongestionArray', 500, 1],
  ['/fleet/assignment_decisions', 'amr_msgs/msg/AssignmentDecision', 0, 10],
  ['/clock', 'rosgraph_msgs/msg/Clock', 500, 1],
  ...ROBOT_IDS.flatMap(id => [[`/${id}/safety/status`, 'amr_msgs/msg/SafetyStatus', 200, 1], [`/${id}/plan`, 'nav_msgs/msg/Path', 1000, 1]]),
];
function connect() {
  if (OPT.ws === 'off') return;
  try { sock = new WebSocket(OPT.ws); } catch (err) { setTimeout(connect, 3000); return; }
  sock.onopen = () => {
    connected = true;
    for (const [topic, type, throttle, queue] of SUBS) sock.send(JSON.stringify({ op: 'subscribe', topic, type, throttle_rate: throttle, queue_length: queue }));
    sock.send(JSON.stringify({ op: 'advertise', topic: '/fleet/task_requests', type: 'amr_msgs/msg/Task' }));
    render();
  };
  sock.onclose = () => { connected = false; sock = null; render(); setTimeout(connect, 3000); };
  sock.onerror = () => sock?.close();
  sock.onmessage = e => { const m = JSON.parse(e.data); if (m.op === 'publish') handle(m.topic, m.msg); };
}

const uuid = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
const poseOf = ([x, y, yaw]) => ({ position: { x, y, z: 0 }, orientation: { x: 0, y: 0, z: Math.sin(yaw / 2), w: Math.cos(yaw / 2) } });
function showToast(text, hot = false) { toast = { text, hot, until: hot ? Infinity : wall() + T.toast }; }

// 호출 보내기 (명세 6-3)
function send(kind, store) {
  if (!selected) return;
  if (!connected) { showToast('요청 실패 · 연결되면 다시 누르세요', true); render(); return; }
  const [from, to] = kind === 'collect' ? [selected, nearestReturn(selected)] : [store, selected];
  if (activeCall(kind, from, kind === 'collect' ? null : to)) return;
  const task = {
    task_id: `${kind}_${uuid()}`, task_type: kind === 'collect' ? OPT.collectType : TYPE.DELIVERY, item_type: kind === 'collect' ? 0 : 1,
    pickup_station_id: from, pickup_pose: poseOf(S[from]), dropoff_station_id: to, dropoff_pose: poseOf(S[to]),
    priority: kind === 'collect' ? OPT.collectPriority : DELIVER_PRIORITY, deadline: { sec: 0, nanosec: 0 }, created_time: stamp(now()),
  };
  dashTest.sent.push({ topic: '/fleet/task_requests', msg: task });
  if (sock?.readyState === WebSocket.OPEN) sock.send(JSON.stringify({ op: 'publish', topic: '/fleet/task_requests', msg: task }));
  pendingSends.push({ id: task.task_id, kind, from, to: kind === 'collect' ? null : to, at: wall() });
  showToast(kind === 'collect' ? `회수 요청 완료 · ${NAME(from)}` : `서빙 요청 완료 · ${NAME(from)} → ${NAME(to)}`);
  render();
}

// ---- 주기 ----
function tick() {
  if (connected && toast?.hot) toast = null;
  updateStops();
  const q = queueOf();
  updateOrderDecisions(q.waiting);
  // 5대가 모두 한 번씩 보인 뒤부터 센다 (처음 몇 초의 0대가 그래프에 세로선으로 남지 않게)
  if (now() - lastHallSample >= 1 && ROBOT_IDS.every(id => robots[id])) { lastHallSample = now(); hallHistory.push([now(), hallCount()]); }
  while (hallHistory.length && now() - hallHistory[0][0] > 180) hallHistory.shift();
  lastIdle = new Set(ROBOT_IDS.filter(id => robots[id]?.msg?.mode === MODE.IDLE && !robots[id].msg.current_task_id));
  render(q);
}
// 영역 제목 오른쪽: 지도 = 혼잡 발생·없음 (어디인지는 지도에), 로봇 = 사람이 가 봐야 하는 로봇 수 (평소엔 비움)
function drawHints() {
  const crowded = zones.some(z => z.value >= 0.5);
  $('mhint').textContent = crowded ? '혼잡 발생' : '혼잡 없음';
  $('mhint').style.cssText = crowded ? 'color:var(--hot);font-weight:700' : '';
  const help = ROBOT_IDS.filter(id => robots[id] && needsHelp(robotView(id))).length;
  $('rhint').textContent = help ? `도움 필요 ${help}대` : '';
  $('rhint').style.cssText = help ? 'color:var(--hot);font-weight:700' : '';
}
function render(q = queueOf()) {
  countFrom ??= now();
  drawHeader(); drawSummary(q.waiting); drawHints(); drawTables(); drawZones(); drawPaths(); drawRobots();
  drawRobotCards(); drawDecision(); drawQueue(q); drawCall(); drawPop();
}

// 시험용 주입 경로: rosbridge 없이 메시지를 넣고 보낸 작업을 본다 (test/)
const dashTest = window.dashTest = {
  feed(topic, msg) { handle(topic, msg); },
  tick, sent: [],
  setConnected(v) { connected = v; render(); },
  setCountFrom(t) { countFrom = t; render(); },   // 세기 시작한 시각을 장면 시각에 맞춘다 (캡처)
  state: () => ({ decision, stopTotal, done: doneIds.size, hall: hallCount(), selected, queue: queueOf().waiting.map(r => r.task.task_id) }),
};

render();
setInterval(tick, 250);
connect();
</script>
