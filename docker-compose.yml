# 시스템 서비스(sim, robots, fleet, perception)는 기본으로 뜨고, 개발 도구는 profile로 켠다.
#   docker compose up                            # 시스템 전체
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up   # perception에 GPU 사용
#   docker compose run --rm dev                  # 개발 셸
#   docker compose --profile gui up -d           # 브라우저 GUI: http://localhost:6080/vnc.html
#   docker compose --profile fake up -d fake-robots   # 가짜 로봇 5대 (Gazebo 없이 Fleet만)
# TODO: 각 서비스의 command를 해당 패키지 launch로 교체

x-ros: &ros
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: base
  image: amr-fleet-system:latest
  network_mode: host
  ipc: host
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    - DISPLAY=${DISPLAY:-}
  volumes:
    - ./src:/ros2_ws/src
    - /tmp/.X11-unix:/tmp/.X11-unix:rw

services:
  dev:
    <<: *ros
    profiles: [dev]
    stdin_open: true
    tty: true

  sim:
    <<: *ros
    command: ["bash", "-c", "echo 'TODO: ros2 launch amr_gazebo ...' && sleep infinity"]

  robots:
    <<: *ros
    command: ["bash", "-c", "echo 'TODO: ros2 launch amr_bringup robots.launch.py num_robots:=5' && sleep infinity"]

  # Fleet 서버 + 장애 주입기. 이미지를 만든 뒤 호스트에서 바뀐 코드(./src 마운트)를 반영하려고 시작할 때 Fleet 패키지만 다시 빌드한다.
  # 의존성(package.xml)이 바뀌었으면 먼저 docker compose build로 이미지를 다시 만든다 (예: ModuleNotFoundError: scipy).
  # 둘 중 하나가 죽으면 컨테이너가 끝난다. 조건은 환경 변수로 바꾼다:
  #   FAULT_DELAY_MS=200 FAULT_LOSS_PCT=5 FLEET_ALGORITHM=hungarian docker compose up -d fleet
  fleet:
    <<: *ros
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FLEET_ALGORITHM=${FLEET_ALGORITHM:-nearest}
      # 원 명세서 9장 "로봇 간 통신 지연(최대 100ms)을 시뮬레이션에 반영"
      - FAULT_DELAY_MS=${FAULT_DELAY_MS:-100.0}
      - FAULT_LOSS_PCT=${FAULT_LOSS_PCT:-0.0}
      - FAULT_SEED=${FAULT_SEED:-0}
    command:
      - bash
      - -c
      - |
        set -e
        cd /ros2_ws
        colcon build --packages-up-to amr_fleet_manager amr_fault_injector --event-handlers console_cohesion-
        source install/setup.bash
        ros2 launch amr_fleet_manager fleet_manager.launch.py algorithm:=$${FLEET_ALGORITHM} &
        ros2 launch amr_fault_injector fault_injector.launch.py \
          delay_ms:=$${FAULT_DELAY_MS} loss_pct:=$${FAULT_LOSS_PCT} seed:=$${FAULT_SEED} &
        wait -n
        exit 1

  # 가짜 로봇 5대 (amr_01~05). Gazebo·Nav2 없이 Fleet 흐름만 볼 때 켠다. 실제 robots 서비스와 이름이 겹치므로 같이 띄우지 않는다.
  #   docker compose up -d fleet && docker compose --profile fake up -d fake-robots
  fake-robots:
    <<: *ros
    profiles: [fake]
    command:
      - bash
      - -c
      - |
        set -e
        cd /ros2_ws
        colcon build --packages-up-to amr_fleet_manager --event-handlers console_cohesion-
        source install/setup.bash
        exec ros2 launch amr_fleet_manager fake_robots.launch.py count:=5 relayed:=true

  perception:
    <<: *ros
    command: ["bash", "-c", "echo 'TODO: ros2 launch amr_detection ...' && sleep infinity"]
    # GPU 설정은 docker-compose.gpu.yml에 있다. GPU 없는 PC에서도 뜨도록 여기서는 뺐다.

  # 브라우저 GUI (RViz2 등). macOS·Windows 포함 어디서나 http://localhost:6080/vnc.html 로 접속한다.
  # 다른 서비스와 같은 host 네트워크에 있어야 ROS 토픽이 보이므로, 화면은 gui-proxy가 호스트로 중계한다.
  gui:
    <<: *ros
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: gui
    image: amr-fleet-system:gui
    profiles: [gui]
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - VNC_PASSWORD=${VNC_PASSWORD:-ros}
      - GUI_RESOLUTION=${GUI_RESOLUTION:-1600x900}
    # 자체 가상 화면(Xvfb)을 쓰므로 호스트 X 소켓은 연결하지 않는다.
    volumes:
      - ./src:/ros2_ws/src
    command:
      - bash
      - -c
      - |
        # 재시작 시 이전 실행의 lock이 남아 있으면 Xvfb가 시작을 거부한다.
        rm -f /tmp/.X99-lock /tmp/.X11-unix/X99
        Xvfb :99 -screen 0 $${GUI_RESOLUTION}x24 &
        sleep 2
        fluxbox &
        xterm &
        x11vnc -display :99 -forever -shared -localhost -rfbport 5999 -passwd "$${VNC_PASSWORD}" -quiet &
        exec websockify --web /usr/share/novnc 6081 localhost:5999

  # Docker Desktop(macOS·Windows)에서는 host 네트워크 포트가 호스트에 열리지 않아 이 컨테이너가 중계한다.
  gui-proxy:
    image: alpine/socat:1.8.0.1
    profiles: [gui]
    depends_on: [gui]
    ports:
      - "127.0.0.1:6080:6080"
    entrypoint: ["sh", "-c"]
    command:
      - exec socat TCP-LISTEN:6080,fork,reuseaddr TCP:$$(ip route | awk '/default/ {print $$3}'):6081

  # TODO(관측 스택): prometheus, grafana 서비스 추가 (설정은 docker/ 아래)
  # TODO(대시보드): dashboard 서비스 추가 (dashboard/ 참고)
