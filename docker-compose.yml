# 역할별 서비스를 profile로 나눈다. 필요한 것만 골라 띄운다.
#   docker compose --profile dev up        # 개발 셸
#   docker compose --profile sim --profile fleet up
#   docker compose --profile gui up -d           # 브라우저 GUI: http://localhost:6080/vnc.html
# TODO: 각 서비스의 command를 해당 패키지 launch로 교체

x-ros: &ros
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: base
  image: amr-fleet-system:latest
  network_mode: host
  ipc: host
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    - DISPLAY=${DISPLAY:-}
  volumes:
    - ./src:/ros2_ws/src
    - /tmp/.X11-unix:/tmp/.X11-unix:rw

services:
  dev:
    <<: *ros
    profiles: [dev]
    stdin_open: true
    tty: true

  sim:
    <<: *ros
    profiles: [sim]
    command: ["bash", "-c", "echo 'TODO: ros2 launch amr_gazebo ...' && sleep infinity"]

  robots:
    <<: *ros
    profiles: [robots]
    command: ["bash", "-c", "echo 'TODO: ros2 launch amr_bringup robots.launch.py num_robots:=5' && sleep infinity"]

  fleet:
    <<: *ros
    profiles: [fleet]
    command: ["bash", "-c", "echo 'TODO: ros2 launch amr_fleet_manager ...' && sleep infinity"]

  perception:
    <<: *ros
    profiles: [perception]
    command: ["bash", "-c", "echo 'TODO: ros2 launch amr_detection ...' && sleep infinity"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 브라우저 GUI (RViz2 등). macOS·Windows 포함 어디서나 http://localhost:6080/vnc.html 로 접속한다.
  # 다른 서비스와 같은 host 네트워크에 있어야 ROS 토픽이 보이므로, 화면은 gui-proxy가 호스트로 중계한다.
  gui:
    <<: *ros
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: gui
    image: amr-fleet-system:gui
    profiles: [gui]
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - VNC_PASSWORD=${VNC_PASSWORD:-ros}
      - GUI_RESOLUTION=${GUI_RESOLUTION:-1600x900}
    command:
      - bash
      - -c
      - |
        Xvfb :99 -screen 0 $${GUI_RESOLUTION}x24 &
        sleep 2
        fluxbox &
        xterm &
        x11vnc -display :99 -forever -shared -localhost -rfbport 5999 -passwd "$${VNC_PASSWORD}" -quiet &
        exec websockify --web /usr/share/novnc 6081 localhost:5999

  # Docker Desktop(macOS·Windows)에서는 host 네트워크 포트가 호스트에 열리지 않아 이 컨테이너가 중계한다.
  gui-proxy:
    image: alpine/socat:1.8.0.1
    profiles: [gui]
    depends_on: [gui]
    ports:
      - "127.0.0.1:6080:6080"
    entrypoint: ["sh", "-c"]
    command:
      - exec socat TCP-LISTEN:6080,fork,reuseaddr TCP:$$(ip route | awk '/default/ {print $$3}'):6081

  # TODO(관측 스택): prometheus, grafana 서비스 추가 (설정은 docker/ 아래)
  # TODO(대시보드): dashboard 서비스 추가 (dashboard/ 참고)
