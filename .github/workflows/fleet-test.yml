      # 2. 장애 조건별 시나리오 N회 반복, ros2_tracing 수집
      # 3. colcon test --coverage, 커버리지 리포트
      # 4. P95/P99 지연·신뢰구간·커버리지를 PR 코멘트로 게시
      # 5. baseline 대비 유의미한 저하 또는 커버리지 70% 미달 시 실패
