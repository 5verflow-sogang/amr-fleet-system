# 회귀 테스트 하네스 (명세서 5-2절)
# GCP Spot 일회용 러너(tools/infra/gcp)를 만들어 하네스(tools/harness) 시나리오를 N회 돌리고,
# 결과와 요약을 버킷에 올린 뒤 러너를 지운다.
#
# 러너만 빨리 확인하려면 repeats=1, params에 duration_s=120 (약 8분).
# fleet_fake 기본값(620초)으로 N회면 1회 약 12분이다. 제한 시간(240분) 안에 들게 repeats는 15 이하로 둔다.
#
# 시나리오마다 다른 값(컨트롤러, 지도, 시간 등)은 params에 '이름=값'을 공백으로 나눠 넣는다.
# 장애 입력(delay_ms·loss_pct·kill_robot)은 시나리오 params에 그 이름이 있을 때만 넘긴다.
# workflow_dispatch 입력은 10개까지라 시나리오별 값은 따로 입력을 만들지 않고 params로 받는다.
#
# 슬롯 (params의 slot=<이름>, 기본 a): 슬롯마다 러너가 동시에 1대씩 뜬다. 전체 리전 vCPU 한도가 32라
#   a      n2d-standard-16 (템플릿 그대로). Gazebo 시나리오
#   b1~b4  c2d-standard-8. 가짜 로봇 시나리오(fleet_fake)를 나눠 돌릴 때 (연구 1)
# a와 b 네 개를 한꺼번에 띄우면 48 vCPU라 마지막 VM은 한도에 걸려 만들어지지 않는다.
# 지연을 재는 실험은 기계가 다르면 값이 달라지므로 한 실험의 조건은 같은 종류 슬롯(b끼리)에서 돌린다.
# GitHub는 같은 concurrency 그룹에서 대기 실행을 1개만 남기고 앞의 대기 실행을 취소한다.
# 여러 조건을 줄 세울 때는 tools/harness/gcp_batch.py가 슬롯이 빌 때마다 하나씩 넣는다.
#
# 필요한 설정 (tools/infra/gcp/README.md)
# - 저장소 변수 GCP_WIF_PROVIDER, GCP_GHA_SA: terraform output
# - 시크릿 RUNNER_ADMIN_TOKEN: 이 저장소 Administration 쓰기 권한 토큰 (러너 등록용)
#
# 포크 PR의 pull_request 이벤트는 GCP 로그인 토큰을 받지 못하므로 수동 실행만 둔다.
# PR 코드를 돌리려면 ref에 refs/pull/<번호>/head를 넣는다.
name: Fleet Regression Test
# Actions 목록에서 어떤 조건·러너로 돌았는지 바로 보이게 (슬롯은 concurrency와 같은 식으로 params에서 읽는다)
run-name: >-
  Fleet ${{ github.event.inputs.scenario }} · ${{ github.event.inputs.label || 'default' }} · 슬롯 ${{
    contains(format(' {0} ', github.event.inputs.params), ' slot=b1 ') && 'b1 (c2d-8)' ||
    contains(format(' {0} ', github.event.inputs.params), ' slot=b2 ') && 'b2 (c2d-8)' ||
    contains(format(' {0} ', github.event.inputs.params), ' slot=b3 ') && 'b3 (c2d-8)' ||
    contains(format(' {0} ', github.event.inputs.params), ' slot=b4 ') && 'b4 (c2d-8)' || 'a (n2d-16)' }} · ${{
    github.triggering_actor }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 돌릴 코드 (브랜치·SHA 또는 refs/pull/<번호>/head)
        default: dev
      scenario:
        description: 하네스 시나리오 (tools/harness/scenarios/<이름>.yaml)
        default: fleet_fake
      repeats:
        description: 반복 횟수 (1~15)
        default: "3"
      delay_ms:
        description: 장애 주입 지연 (ms, 0~500)
        default: "0"
      loss_pct:
        description: 장애 주입 손실 (%, 0~10)
        default: "0"
      label:
        description: 조건 이름 (요약·index.csv에서 묶는 이름). 비우면 d<지연>_l<손실>[_kill_<로봇>], 장애 없는 시나리오는 default. params를 쓰면 직접 정한다
        default: ""
      kill_robot:
        description: "로봇 장애 - 죽일 로봇 (예: amr_03). none이면 끄기"
        default: none
      kill_robot_at_s:
        description: 로봇 장애 - 가짜 로봇 launch 시작 후 죽일 시각 (s). -1이면 끄기
        default: "-1"
      params:
        description: "시나리오 값 '이름=값' 공백 구분 (예: controller=teb scenario=obstacle, duration_s=120). packages=a,b는 빌드할 패키지, slot=b1은 러너 슬롯"
        default: ""
      fresh:
        description: 반복마다 새 컨테이너 (Nav2 시나리오를 여러 번 돌릴 때)
        type: boolean
        default: false
  # TODO: 하네스 연결 후 활성화 (매일 03:00 KST)
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  id-token: write

# 슬롯마다 러너는 동시에 1대 (머리 주석 "슬롯"). 입력이 10개로 꽉 차 슬롯은 params에서 읽는다.
# 앞뒤에 공백을 붙여 찾아서 slot=b1이 slot=b10 같은 이름에 걸리지 않게 한다
concurrency:
  group: >-
    fleet-test-${{
      contains(format(' {0} ', github.event.inputs.params), ' slot=b1 ') && 'b1' ||
      contains(format(' {0} ', github.event.inputs.params), ' slot=b2 ') && 'b2' ||
      contains(format(' {0} ', github.event.inputs.params), ' slot=b3 ') && 'b3' ||
      contains(format(' {0} ', github.event.inputs.params), ' slot=b4 ') && 'b4' || 'a' }}
  cancel-in-progress: false

env:
  PROJECT_ID: amr-fleet
  ZONE: asia-northeast3-a
  TEMPLATE: fleet-runner
  RESULTS_BUCKET: amr-fleet-results
  DOCKER_REPO: asia-northeast3-docker.pkg.dev/amr-fleet/amr

jobs:
  start-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      name: ${{ steps.name.outputs.name }}
      machine: ${{ steps.slot.outputs.machine }}
      slot: ${{ steps.slot.outputs.slot }}
    steps:
      - id: name
        run: echo "name=fleet-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      # 슬롯 → VM 종류. a는 템플릿 값(n2d-standard-16)을 그대로 쓰고, b는 만들 때 덮어쓴다
      - id: slot
        env:
          PARAMS: ${{ github.event.inputs.params }}
        run: |
          slot=a
          read -ra items <<< "$PARAMS"
          for item in "${items[@]}"; do
            case "$item" in slot=*) slot="${item#slot=}" ;; esac
          done
          case "$slot" in
            a) machine=n2d-standard-16 ;;
            b1|b2|b3|b4) machine=c2d-standard-8 ;;
            *) echo "::error::slot은 a, b1~b4: $slot"; exit 1 ;;
          esac
          echo "slot $slot → $machine"
          echo "machine=$machine" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_GHA_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # 일회용(JIT) 러너 설정. 작업 하나만 받고 스스로 등록을 지운다
      - name: Create runner VM
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          NAME: ${{ steps.name.outputs.name }}
          MACHINE: ${{ steps.slot.outputs.machine }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runners/generate-jitconfig" \
            -f name="$NAME" -F runner_group_id=1 \
            -f 'labels[]=self-hosted' -f 'labels[]=linux' -f "labels[]=$NAME" \
            -q .encoded_jit_config > jit-config.txt
          # 생성 시 넘긴 메타데이터는 템플릿 메타데이터와 합쳐지지 않고 통째로 바꾼다.
          # 템플릿의 startup-script를 같이 넘기지 않으면 러너가 설치되지 않아 작업이 대기열에 머문다
          gcloud compute instance-templates describe "$TEMPLATE" --project "$PROJECT_ID" --format=json \
            | jq -er '.properties.metadata.items[] | select(.key == "startup-script") | .value' > startup.sh
          # 템플릿의 Spot·최대 실행 시간·디스크는 그대로 두고 VM 종류만 슬롯에 맞춘다
          gcloud compute instances create "$NAME" \
            --project "$PROJECT_ID" --zone "$ZONE" \
            --source-instance-template "$TEMPLATE" --machine-type "$MACHINE" \
            --metadata-from-file jit-config=jit-config.txt,startup-script=startup.sh
          rm jit-config.txt startup.sh

  fleet-test:
    needs: start-runner
    runs-on: [self-hosted, linux, "${{ needs.start-runner.outputs.name }}"]
    timeout-minutes: 240
    env:
      RUN_DIR: ${{ github.workspace }}/results/${{ needs.start-runner.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref }}

      # 러너 VM은 매번 새로 뜨므로 Artifact Registry의 빌드 캐시를 쓴다
      - name: Build image
        run: |
          docker buildx create --use --driver docker-container
          docker buildx build -f docker/Dockerfile --target base \
            --cache-from "type=registry,ref=${DOCKER_REPO}/base:buildcache" \
            --cache-to "type=registry,ref=${DOCKER_REPO}/base:buildcache,mode=max" \
            -t amr-fleet-system:latest --load .

      - name: Run harness
        env:
          SCENARIO: ${{ github.event.inputs.scenario }}
          REPEATS: ${{ github.event.inputs.repeats }}
          DELAY_MS: ${{ github.event.inputs.delay_ms }}
          LOSS_PCT: ${{ github.event.inputs.loss_pct }}
          LABEL: ${{ github.event.inputs.label }}
          KILL_ROBOT: ${{ github.event.inputs.kill_robot }}
          KILL_ROBOT_AT_S: ${{ github.event.inputs.kill_robot_at_s }}
          PARAMS: ${{ github.event.inputs.params }}
          HARNESS_FRESH: ${{ inputs.fresh && '1' || '0' }}
          HARNESS_IMAGE: amr-fleet-system:latest
          # meta.json host와 Discord 요약에 남긴다 (컨테이너 안에서는 VM 종류를 알 수 없다)
          HARNESS_RUNNER_MACHINE: ${{ needs.start-runner.outputs.machine }}
          HARNESS_RUNNER_SLOT: ${{ needs.start-runner.outputs.slot }}
          HARNESS_TRIGGERED_BY: ${{ github.triggering_actor }}
          # 있으면 하네스가 끝날 때 요약을 실험 결과 채널로 보낸다 (tools/harness README "Discord 알림")
          HARNESS_DISCORD_WEBHOOK: ${{ secrets.HARNESS_DISCORD_WEBHOOK }}
        run: |
          # 입력값은 셸에 끼워 넣지 않고 환경 변수로 받아 형식을 확인한다
          fail() { echo "::error::$1"; exit 1; }
          [[ "$REPEATS" =~ ^[0-9]+$ ]] || fail "repeats는 1~15"
          (( REPEATS >= 1 && REPEATS <= 15 )) || fail "repeats는 1~15"
          [[ "$SCENARIO" =~ ^[a-z0-9_]+$ ]] || fail "scenario 이름 형식이 아님: $SCENARIO"
          scenario_file="tools/harness/scenarios/${SCENARIO}.yaml"
          [ -f "$scenario_file" ] || fail "$scenario_file 없음. ref에 그 시나리오가 있는지 확인 (머지 전이면 refs/pull/<번호>/head)"
          # 시나리오 params 절의 이름 목록. 넘기는 값이 시나리오에 없으면(오타) 조용히 무시되므로 막는다
          scenario_params=$(awk '/^params:/ {p = 1; next} /^[^[:space:]#]/ {p = 0}
            p && /^[[:space:]]+[A-Za-z_][A-Za-z0-9_]*:/ {sub(/^[[:space:]]+/, ""); sub(/:.*/, ""); print}' "$scenario_file")
          has_param() { grep -qx "$1" <<< "$scenario_params"; }
          num='^[0-9]+([.][0-9]+)?$'
          zero='^0+([.]0+)?$'
          [[ "$DELAY_MS" =~ $num && "$LOSS_PCT" =~ $num ]] || fail "delay_ms·loss_pct는 숫자"

          args=("$SCENARIO" -n "$REPEATS" --out "results/$(basename "$RUN_DIR")")
          # 장애 입력은 그 장애를 쓰는 시나리오에만 넘긴다 (위치추정·주행 시나리오의 meta.json에 장애 조건이 남지 않게)
          fault_label=""
          if has_param delay_ms; then
            args+=(--set "delay_ms=$DELAY_MS" --set "loss_pct=$LOSS_PCT")
            fault_label="d${DELAY_MS}_l${LOSS_PCT}"
          elif ! [[ "$DELAY_MS" =~ $zero && "$LOSS_PCT" =~ $zero ]]; then
            fail "$SCENARIO는 통신 장애(delay_ms)를 쓰지 않는 시나리오다. delay_ms·loss_pct는 0으로 둔다"
          fi
          if [ "$KILL_ROBOT" != none ]; then
            has_param kill_robot || fail "$SCENARIO는 로봇 장애(kill_robot)를 쓰지 않는 시나리오다"
            # 가짜 로봇은 10대까지 (fake_robots.yaml). 실제 대수보다 큰 번호는 시나리오가 띄우지 않은 로봇이라 죽일 게 없다
            [[ "$KILL_ROBOT" =~ ^amr_(0[1-9]|10)$ && "$KILL_ROBOT_AT_S" =~ $num ]] \
              || fail "kill_robot은 amr_01~10, kill_robot_at_s는 0 이상 숫자"
            args+=(--set "kill_robot=$KILL_ROBOT" --set "kill_robot_at_s=$KILL_ROBOT_AT_S")
            # 로봇 장애 실행이 장애 없는 실행과 같은 묶음으로 요약되지 않게 기본 라벨에 붙인다
            fault_label="${fault_label:+${fault_label}_}kill_${KILL_ROBOT}"
          fi

          # params: 이름=값을 공백으로 나눈다. 값에는 공백·따옴표·$를 못 쓴다 (경로·목록 [0.0,1.5,0.0]은 된다)
          kv='^([a-z_][a-z0-9_]*)=([][A-Za-z0-9_.:/,+-]+)$'
          read -ra items <<< "$PARAMS"
          conditions=0
          for item in "${items[@]}"; do
            [[ "$item" =~ $kv ]] || fail "params는 이름=값 (값에 공백·따옴표·\$ 불가): $item"
            key="${BASH_REMATCH[1]}"; value="${BASH_REMATCH[2]}"
            case "$key" in
              delay_ms|loss_pct|kill_robot|kill_robot_at_s) fail "$key는 params가 아니라 같은 이름의 입력에 넣는다" ;;
              # 빌드할 패키지 (docker_run.sh HARNESS_PACKAGES). 실험 조건이 아니라 라벨을 요구하지 않는다
              packages)
                [[ "$value" =~ ^[a-z0-9_,]+$ ]] || fail "packages는 패키지 이름을 쉼표로: $value"
                export HARNESS_PACKAGES="${value//,/ }"
                continue ;;
              # 러너 슬롯. start-runner가 VM 종류를 고를 때 쓰고 하네스에는 넘기지 않는다
              slot) continue ;;
            esac
            has_param "$key" || fail "$key는 $scenario_file params에 없다. 있는 이름: $(tr '\n' ' ' <<< "$scenario_params")"
            args+=(--set "$key=$value")
            conditions=$((conditions + 1))
          done

          if [ -n "$LABEL" ]; then
            label="$LABEL"
          elif (( conditions > 0 )); then
            fail "params로 조건을 바꿀 때는 label을 직접 정한다 (요약·index.csv에서 조건을 구분하는 이름, 예: teb_obstacle)"
          else
            label="${fault_label:-default}"
          fi
          [[ "$label" =~ ^[A-Za-z0-9_.-]+$ ]] || fail "label은 영문·숫자·_.-만: $label"
          args+=(--label "$label")
          # 업로드 경로(runs/<시나리오>-<라벨>/)에 쓴다
          echo "RESULTS_PREFIX=runs/${SCENARIO}-${label}" >> "$GITHUB_ENV"
          echo "하네스: ${args[*]} (HARNESS_FRESH=$HARNESS_FRESH, HARNESS_PACKAGES=${HARNESS_PACKAGES:-기본})"
          bash tools/harness/docker_run.sh "${args[@]}"

      # 반복이 전부 실패했으면 job을 실패로 둔다 (run.py는 실패한 반복이 있어도 0으로 끝난다)
      - name: Check outcomes
        run: |
          python3 - "$RUN_DIR" <<'EOF'
          import json, pathlib, sys
          metas = [json.loads(p.read_text()) for p in pathlib.Path(sys.argv[1]).glob('*/meta.json')]
          done = sum(m.get('outcome') == 'completed' for m in metas)
          print(f'완료 {done}회 / 전체 {len(metas)}회')
          sys.exit(0 if done else 1)
          EOF

      # 결과: gs://<버킷>/runs/<시나리오>-<라벨>/<날짜>_<실행 번호>/ (조건이 경로에 보이게)
      # 실행 목록: gs://<버킷>/index.csv 에 한 줄 (tools/harness/index_run.py)
      - name: Upload results
        if: always() && env.RESULTS_PREFIX != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MACHINE: ${{ needs.start-runner.outputs.machine }}
        run: |
          if ! ls "$RUN_DIR"/*/meta.json >/dev/null 2>&1; then echo "올릴 결과 없음"; exit 0; fi
          cat "$RUN_DIR"/summary_*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          dest="gs://${RESULTS_BUCKET}/${RESULTS_PREFIX}/$(date -u +%Y%m%d)_${GITHUB_RUN_ID}/"
          gcloud storage cp -r "$RUN_DIR"/* "$dest"
          # 결과 폴더만 받아도 어느 기계에서 돌았는지 알게 남긴다 (index.csv machine_type과 같은 값).
          # RUN_DIR은 하네스 컨테이너가 root로 만들어 러너 사용자가 쓸 수 없으므로 버킷에 바로 올린다
          echo "$MACHINE" | gcloud storage cp - "${dest}machine_type.txt"
          echo "결과: $dest (러너 $MACHINE)" >> "$GITHUB_STEP_SUMMARY"

          # 받아서 한 줄 더해 올린다. 그사이 다른 실행이 바꿨으면(generation 불일치) 다시 받는다
          # 작업본은 레포 밖(RUNNER_TEMP)에 둔다
          index="gs://${RESULTS_BUCKET}/index.csv"
          local_index="$RUNNER_TEMP/index.csv"
          for attempt in 1 2 3; do
            gen=$(gcloud storage objects describe "$index" --format='value(generation)' 2>/dev/null || echo 0)
            rm -f "$local_index"
            if [ "$gen" != 0 ]; then gcloud storage cp "$index" "$local_index"; fi
            python3 tools/harness/index_run.py "$RUN_DIR" --index "$local_index" --path "$dest" --url "$RUN_URL" \
              --machine "$MACHINE" --by "$GITHUB_TRIGGERING_ACTOR"
            if gcloud storage cp "$local_index" "$index" --if-generation-match="$gen"; then break; fi
            echo "index.csv가 그사이 바뀜, 다시 시도 ($attempt/3)"
          done

  # 성공·실패·취소와 상관없이 러너 VM과 러너 등록을 지운다
  stop-runner:
    needs: [start-runner, fleet-test]
    if: always() && needs.start-runner.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_GHA_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Delete runner VM
        env:
          NAME: ${{ needs.start-runner.outputs.name }}
        run: |
          gcloud compute instances delete "$NAME" --project "$PROJECT_ID" --zone "$ZONE" --quiet \
            || echo "이미 없음 (Spot 회수 또는 최대 실행 시간 초과로 삭제됨)"

      # 러너가 작업을 받기 전에 실패하면 등록이 남는다
      - name: Remove runner registration
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          NAME: ${{ needs.start-runner.outputs.name }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" --paginate \
            -q ".runners[] | select(.name == \"$NAME\") | .id")
          if [ -n "$id" ]; then gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runners/$id"; fi
