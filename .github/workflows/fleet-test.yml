# 회귀 테스트 하네스 (명세서 5-2절)
# self-hosted GPU 러너(학교 서버 또는 AWS Spot)에서 Fleet 시나리오를 N회 반복 실행한다.
# 러너 등록과 tools/harness 구현 전까지는 수동/라벨 트리거만 둔다.
name: Fleet Regression Test

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      repeats:
        description: 시나리오 반복 횟수 N
        default: "10"
  # TODO: 러너 준비 후 활성화 (매일 03:00 KST)
  # schedule:
  #   - cron: "0 18 * * *"

jobs:
  fleet-test:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-fleet-test'
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      # TODO(하네스): 아래 단계를 tools/harness 스크립트로 교체
