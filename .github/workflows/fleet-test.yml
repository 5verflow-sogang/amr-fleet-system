# 회귀 테스트 하네스 (명세서 5-2절)
# GCP Spot 일회용 러너(tools/infra/gcp)를 만들어 하네스(tools/harness) 시나리오를 N회 돌리고,
# 결과와 요약을 버킷에 올린 뒤 러너를 지운다.
#
# 러너만 빨리 확인하려면 repeats=1, duration_s=120 (약 8분).
# fleet_fake 기본값(620초)으로 N회면 1회 약 12분이다. 제한 시간(240분) 안에 들게 repeats는 15 이하로 둔다.
#
# 필요한 설정 (tools/infra/gcp/README.md)
# - 저장소 변수 GCP_WIF_PROVIDER, GCP_GHA_SA: terraform output
# - 시크릿 RUNNER_ADMIN_TOKEN: 이 저장소 Administration 쓰기 권한 토큰 (러너 등록용)
#
# 포크 PR의 pull_request 이벤트는 GCP 로그인 토큰을 받지 못하므로 수동 실행만 둔다.
# PR 코드를 돌리려면 ref에 refs/pull/<번호>/head를 넣는다.
name: Fleet Regression Test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 돌릴 코드 (브랜치·SHA 또는 refs/pull/<번호>/head)
        default: dev
      scenario:
        description: 하네스 시나리오 (tools/harness/scenarios/<이름>.yaml)
        default: fleet_fake
      repeats:
        description: 반복 횟수 (1~15)
        default: "3"
      delay_ms:
        description: 장애 주입 지연 (ms, 0~500)
        default: "0"
      loss_pct:
        description: 장애 주입 손실 (%, 0~10)
        default: "0"
      label:
        description: 조건 이름 (요약에서 묶는 이름. 비우면 d<지연>_l<손실>[_kill_<로봇>])
        default: ""
      duration_s:
        description: 시나리오 시간 (s). 비우면 시나리오 기본값
        default: ""
      kill_robot:
        description: "로봇 장애 - 죽일 로봇 (예: amr_03). none이면 끄기"
        default: none
      kill_robot_at_s:
        description: 로봇 장애 - 가짜 로봇 launch 시작 후 죽일 시각 (s). -1이면 끄기
        default: "-1"
  # TODO: 하네스 연결 후 활성화 (매일 03:00 KST)
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  id-token: write

# N2D 한도(16 vCPU)로 러너는 동시에 1대만 뜬다
concurrency:
  group: fleet-test
  cancel-in-progress: false

env:
  PROJECT_ID: amr-fleet
  ZONE: asia-northeast3-a
  TEMPLATE: fleet-runner
  RESULTS_BUCKET: amr-fleet-results
  DOCKER_REPO: asia-northeast3-docker.pkg.dev/amr-fleet/amr

jobs:
  start-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      name: ${{ steps.name.outputs.name }}
    steps:
      - id: name
        run: echo "name=fleet-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_GHA_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # 일회용(JIT) 러너 설정. 작업 하나만 받고 스스로 등록을 지운다
      - name: Create runner VM
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          NAME: ${{ steps.name.outputs.name }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runners/generate-jitconfig" \
            -f name="$NAME" -F runner_group_id=1 \
            -f 'labels[]=self-hosted' -f 'labels[]=linux' -f "labels[]=$NAME" \
            -q .encoded_jit_config > jit-config.txt
          # 생성 시 넘긴 메타데이터는 템플릿 메타데이터와 합쳐지지 않고 통째로 바꾼다.
          # 템플릿의 startup-script를 같이 넘기지 않으면 러너가 설치되지 않아 작업이 대기열에 머문다
          gcloud compute instance-templates describe "$TEMPLATE" --project "$PROJECT_ID" --format=json \
            | jq -er '.properties.metadata.items[] | select(.key == "startup-script") | .value' > startup.sh
          gcloud compute instances create "$NAME" \
            --project "$PROJECT_ID" --zone "$ZONE" \
            --source-instance-template "$TEMPLATE" \
            --metadata-from-file jit-config=jit-config.txt,startup-script=startup.sh
          rm jit-config.txt startup.sh

  fleet-test:
    needs: start-runner
    runs-on: [self-hosted, linux, "${{ needs.start-runner.outputs.name }}"]
    timeout-minutes: 240
    env:
      RUN_DIR: ${{ github.workspace }}/results/${{ needs.start-runner.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref }}

      # 러너 VM은 매번 새로 뜨므로 Artifact Registry의 빌드 캐시를 쓴다
      - name: Build image
        run: |
          docker buildx create --use --driver docker-container
          docker buildx build -f docker/Dockerfile --target base \
            --cache-from "type=registry,ref=${DOCKER_REPO}/base:buildcache" \
            --cache-to "type=registry,ref=${DOCKER_REPO}/base:buildcache,mode=max" \
            -t amr-fleet-system:latest --load .

      - name: Run harness
        env:
          SCENARIO: ${{ github.event.inputs.scenario }}
          REPEATS: ${{ github.event.inputs.repeats }}
          DELAY_MS: ${{ github.event.inputs.delay_ms }}
          LOSS_PCT: ${{ github.event.inputs.loss_pct }}
          LABEL: ${{ github.event.inputs.label }}
          DURATION_S: ${{ github.event.inputs.duration_s }}
          KILL_ROBOT: ${{ github.event.inputs.kill_robot }}
          KILL_ROBOT_AT_S: ${{ github.event.inputs.kill_robot_at_s }}
          HARNESS_IMAGE: amr-fleet-system:latest
          # 있으면 하네스가 끝날 때 요약을 실험 결과 채널로 보낸다 (tools/harness README "Discord 알림")
          HARNESS_DISCORD_WEBHOOK: ${{ secrets.HARNESS_DISCORD_WEBHOOK }}
        run: |
          # 입력값은 셸에 끼워 넣지 않고 환경 변수로 받아 형식을 확인한다
          [[ "$REPEATS" =~ ^[0-9]+$ ]] && (( REPEATS >= 1 && REPEATS <= 15 )) || { echo "::error::repeats는 1~15"; exit 1; }
          [[ "$SCENARIO" =~ ^[a-z0-9_]+$ ]] || { echo "::error::scenario 이름 형식이 아님: $SCENARIO"; exit 1; }
          num='^[0-9]+([.][0-9]+)?$'
          [[ "$DELAY_MS" =~ $num && "$LOSS_PCT" =~ $num ]] || { echo "::error::delay_ms·loss_pct는 숫자"; exit 1; }
          label="${LABEL:-d${DELAY_MS}_l${LOSS_PCT}}"
          # 로봇 장애 실행이 장애 없는 실행과 같은 묶음으로 요약되지 않게 기본 라벨에 붙인다
          if [ -z "$LABEL" ] && [ "$KILL_ROBOT" != none ]; then label="${label}_kill_${KILL_ROBOT}"; fi
          [[ "$label" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "::error::label은 영문·숫자·_.-만: $label"; exit 1; }
          args=("$SCENARIO" -n "$REPEATS" --label "$label" --out "results/$(basename "$RUN_DIR")"
                --set "delay_ms=$DELAY_MS" --set "loss_pct=$LOSS_PCT")
          if [ "$KILL_ROBOT" != none ]; then
            [[ "$KILL_ROBOT" =~ ^amr_0[1-5]$ && "$KILL_ROBOT_AT_S" =~ $num ]] \
              || { echo "::error::kill_robot은 amr_01~05, kill_robot_at_s는 0 이상 숫자"; exit 1; }
            args+=(--set "kill_robot=$KILL_ROBOT" --set "kill_robot_at_s=$KILL_ROBOT_AT_S")
          fi
          if [ -n "$DURATION_S" ]; then
            [[ "$DURATION_S" =~ ^[0-9]+$ ]] || { echo "::error::duration_s는 정수"; exit 1; }
            args+=(--set "duration_s=$DURATION_S")
          fi
          bash tools/harness/docker_run.sh "${args[@]}"

      # 반복이 전부 실패했으면 job을 실패로 둔다 (run.py는 실패한 반복이 있어도 0으로 끝난다)
      - name: Check outcomes
        run: |
          python3 - "$RUN_DIR" <<'EOF'
          import json, pathlib, sys
          metas = [json.loads(p.read_text()) for p in pathlib.Path(sys.argv[1]).glob('*/meta.json')]
          done = sum(m.get('outcome') == 'completed' for m in metas)
          print(f'완료 {done}회 / 전체 {len(metas)}회')
          sys.exit(0 if done else 1)
          EOF

      - name: Upload results
        if: always()
        run: |
          cat "$RUN_DIR"/summary_*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          gcloud storage cp -r "$RUN_DIR" "gs://${RESULTS_BUCKET}/runs/"
          echo "결과: gs://${RESULTS_BUCKET}/runs/$(basename "$RUN_DIR")" >> "$GITHUB_STEP_SUMMARY"

  # 성공·실패·취소와 상관없이 러너 VM과 러너 등록을 지운다
  stop-runner:
    needs: [start-runner, fleet-test]
    if: always() && needs.start-runner.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_GHA_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Delete runner VM
        env:
          NAME: ${{ needs.start-runner.outputs.name }}
        run: |
          gcloud compute instances delete "$NAME" --project "$PROJECT_ID" --zone "$ZONE" --quiet \
            || echo "이미 없음 (Spot 회수 또는 최대 실행 시간 초과로 삭제됨)"

      # 러너가 작업을 받기 전에 실패하면 등록이 남는다
      - name: Remove runner registration
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          NAME: ${{ needs.start-runner.outputs.name }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" --paginate \
            -q ".runners[] | select(.name == \"$NAME\") | .id")
          if [ -n "$id" ]; then gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runners/$id"; fi
