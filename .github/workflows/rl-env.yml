# 연구 2 RL 학습 환경 확인
# Linux에서 uv.lock 그대로 설치되는지(CPU 전용 torch 포함), 환경 테스트가 통과하는지, PPO 학습이 도는지 본다.
# Gazebo 평가 환경(amr_gazebo rl_eval)이 2D와 같은 시나리오를 뽑는지도 본다 (ROS 이미지에는 gymnasium이 없어 여기서만 돈다).
name: RL Env

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - "experiments/research2/**"
      - "src/simulation/amr_gazebo/amr_gazebo/rl_*.py"
      - "src/simulation/amr_gazebo/test/test_rl_eval.py"
      - ".github/workflows/rl-env.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: uv sync + 테스트 + PPO 스모크
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/research2
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install from lock
        run: uv sync --locked
      # pytest는 uv.lock을 바꾸지 않으려고 --with로만 쓴다 (README "v0 학습 환경")
      - name: Tests
        run: uv run --frozen --with pytest pytest tests
      # RL_EVAL_REQUIRE_2D: gymnasium·research2가 없으면 건너뛰지 않고 실패 (#144 리뷰)
      - name: Gazebo eval scenario parity
        env:
          RL_EVAL_REQUIRE_2D: "1"
          PYTHONPATH: ${{ github.workspace }}/src/simulation/amr_gazebo
        run: uv run --frozen --with pytest pytest -rs ../../src/simulation/amr_gazebo/test/test_rl_eval.py
      - name: PPO smoke
        run: uv run python scripts/smoke_ppo.py --steps 5000
