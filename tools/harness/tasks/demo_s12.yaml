# 식당 시연 1-2 혼잡 구간 우회 (tools/harness/demo_scene.py 장면 파일, 하네스 demo_s12)
# 동쪽 로봇 둘(4·5호)에 먼저 다른 배달을 주고, 0초에 1호에게 배식대 2번 자리(buffet_2) → 11번 테이블 배달을 요청하며 /demo/t0을 낸다.
# 켬(congestion_filter keepout)은 1호가 서쪽 통로 대신 x -7.275 우회 통로로 배식대에 가고, 끔은 서쪽 통로로 간다.
#
# 누가 어느 작업을 맡나: 시작 작업 픽업(t15, L03)은 1호(서쪽 입구 옆, robots_restaurant_s12.yaml)보다 동쪽 대기 줄 로봇이
# 가깝다 - 최소거리(nearest) 배정이 낸 순서대로 4호(t15에 가장 가깝다), 5호에 준다. 핵심 요청(buffet_2 픽업)은 1호가 가장
# 가까워(약 10 m, 동쪽 로봇은 20 m 넘게) 남은 로봇 누가 비어 있어도 1호에게 간다.
# 자리 고르기 (11/9 녹화·로컬 재현 반영, experiments/restaurant_demo/scene_plan/search_routes.py s12):
# - 서버는 맡긴 작업의 픽업·하역을 끝날 때까지 잡아 두므로(스테이션 예약 1 m) 시작 작업 자리는 모두 다르다
# - 부스 b01~b03은 쓰지 않는다 (11/9 녹화에서 도착 실패로 재큐, 로컬 재현에서 부스 칸에서 못 빠져나옴)
# - 1-2 손님 파일(peak_scene12) 경로 1 m 안 자리는 쓰지 않는다
# - 경로가 4인석-6인석 사이 1.0 m 세로 통로(x 4.0~5.6)와 부스 칸(x 9.3~)을 지나지 않는다 (추적·안전이 켜지면 막힌다)
# 1-2 화면(서쪽)과 핵심 요청 자리(buffet_2, t11)에서 떨어져 있다.
# path_m: 시작 자리 → 픽업 → 하역 A* (새 restaurant_gt)
steps:
  - name: busy
    gap_s: 0.5
    tasks:
      - {id: s12_busy_c01, type: delivery, pickup: t15, dropoff: c01, path_m: 11.9}   # amr_04
      - {id: s12_busy_L04, type: delivery, pickup: L03, dropoff: L04, path_m: 8.1}    # amr_05
  # 두 작업이 할당된 것을 작업표로 확인하고 3 s 뒤 = 0초 (/demo/t0)
  - name: request
    after: {assigned: 2, delay_s: 3, timeout_s: 60}
    t0: true
    tasks:
      - {id: s12_buffet2_t11, type: delivery, pickup: buffet_2, dropoff: t11}
