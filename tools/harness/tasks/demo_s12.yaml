# 식당 시연 1-2 혼잡 구간 우회 (tools/harness/demo_scene.py 장면 파일, 하네스 demo_s12)
# 동쪽 로봇 둘(5·4호)에 먼저 다른 배달을 주고, 0초에 1호에게 배식대 2번 자리(buffet_2) → 11번 테이블 배달을 요청하며 /demo/t0을 낸다.
# 켬(congestion_filter keepout)은 1호가 서쪽 통로 대신 x -7.275 우회 통로로 배식대에 가고, 끔은 서쪽 통로로 간다.
#
# 누가 어느 작업을 맡나: 시작 작업 픽업을 동쪽 매장 stall_4·stall_3으로 두면 최소거리(nearest) 배정에서 1호(서쪽 입구 옆,
# robots_restaurant_s12.yaml)보다 동쪽 대기 줄의 5호·4호가 가깝다 (낸 순서대로 05, 04). 핵심 요청(buffet_2 픽업)은 1호가
# 가장 가까워(약 10 m, 동쪽 로봇은 20 m 넘게) 남은 로봇 누가 비어 있어도 1호에게 간다.
# 시작 작업이 둘뿐인 이유: 서버는 맡긴 작업의 픽업·하역을 끝날 때까지 잡아 둔다(스테이션 예약 1 m). 1호보다 동쪽 로봇이 가까운
# 픽업은 stall_3·stall_4 둘뿐이라, 넷을 내면 둘이 같은 픽업을 써 앞 작업이 끝날 때까지 할당되지 않는다 (11/8 녹화에서
# request 단계가 assigned: 4를 못 채우고 60 s 시간 초과로 0초가 늦었다).
# 시작 작업 자리(픽업·하역)는 서로 다르고, 동쪽이라 핵심 요청 자리(buffet_2, t11)와 1 m 넘게 떨어져 1-2 화면(서쪽)에 안 들어온다.
# path_m: 시작 자리 → 픽업 → 하역 A* (experiments/restaurant_demo/scene_plan, 새 restaurant_gt)
steps:
  - name: busy
    gap_s: 0.5
    tasks:
      - {id: s12_busy_L01, type: delivery, pickup: stall_4, dropoff: L01, path_m: 14.4}   # amr_05
      - {id: s12_busy_b02, type: delivery, pickup: stall_3, dropoff: b02, path_m: 31.0}   # amr_04
  # 두 작업이 할당된 것을 작업표로 확인하고 3 s 뒤 = 0초 (/demo/t0)
  - name: request
    after: {assigned: 2, delay_s: 3, timeout_s: 60}
    t0: true
    tasks:
      - {id: s12_buffet2_t11, type: delivery, pickup: buffet_2, dropoff: t11}
