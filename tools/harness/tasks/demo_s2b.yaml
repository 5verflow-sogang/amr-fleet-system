# 식당 시연 2 2막: 오래 기다린 배달 보호 (tools/harness/demo_scene.py 장면 파일, 하네스 demo_s2b)
# 5대 모두 배달 중 + 2인석(c01) 배달 1건 대기 → 그 배달이 60 s 기다린 0초(/demo/t0)부터 1·6·8·12·14번 테이블
# 회수 호출 5건을 2 s 간격으로. 회수 priority는 둘 다 200.
# 기대 (연우 시나리오):
#   켬 (fleet_manager_restaurant.yaml aging 1.667/s): 배달이 회수보다 60 s 더 기다려 회수와 같은 순서가 되고(같으면 먼저
#       들어온 쪽), 다음에 일을 마친 4호가 배달에 배정된다
#   끔 (aging 0): 2인석 배달이 회수 5건 뒤로 계속 밀린다
#   회수 5건은 퇴식구 두 곳(return_1·2 예약) 때문에 한 번에 두 건까지만 배정되고 줄을 선다 (서버 동작, 둘 다 같다)
# 왜 60 s 뒤에 회수를 넣나: aging은 모든 작업에 같은 속도로 더해져 차이(200 - 100)가 "회수보다 60 s 먼저 들어옴"이어야
# 없어진다. 그래서 회수 호출은 배달 요청 60 s 뒤에 넣고, 그동안 배달이 계속 대기해야 한다.
#
# 0초를 위치로 맞춘다 (11/9 녹화 반영): 실제 평균 속도는 약 0.2 m/s(11/8 1-2 녹화 12.75 m / 62 s)라, 시작 뒤 고정 시각으로
# 0초를 찍으면 4호가 녹화가 끝난 뒤에야 빈다. 그래서 0초는 "배달이 60 s 기다림" 그리고 "4호가 하역 2 m 앞"(after.near)이
# 둘 다 맞을 때다. 4호가 다른 로봇보다 10 m 넘게 짧아 0초 직후 가장 먼저 비고, 그때 남은 대기 작업은 2인석 배달과 회수뿐이다.
# 4호 작업은 배달이 60 s 기다리기 전에 끝나면 안 된다(그러면 4호가 배달을 먼저 가져간다): 관측 평균의 1.5배인 0.3 m/s로
# 달려도 21.7 / 0.3 + 4 = 76 s라 0초 하한(시작 뒤 약 66 s)보다 10 s 늦다. 그래서 시작 작업은 한 바퀴다.
#   busy: 5대에 하나씩, 낸 순서대로 amr_05, 04, 03, 02, 01 (픽업이 모두 로봇 줄보다 북쪽이라 최소거리 배정이 북쪽 로봇부터 준다)
# 자리 고르기 (11/9 녹화·로컬 재현 반영, experiments/restaurant_demo/scene_plan/search_routes.py act2):
# - 서버 스테이션 예약(맡긴 작업의 픽업·하역을 끝날 때까지 잡아 둠, 1 m): 시작 작업 5건, 2인석 배달의 자리가 모두 다르다
# - 1-2·2막 핵심 자리(buffet_2, t11, c01, 회수 대상 t01·t06·t08·t12·t14, 퇴식구 return_1·2)와 2인석 배달 픽업 stall_3,
#   부스 b01~b03, 평상시 손님 경로 1 m 안 자리(t06·t07·t08·t11·t12·t13)는 쓰지 않는다
# - 경로가 4인석-6인석 사이 1.0 m 세로 통로(x 4.0~5.6)와 부스 칸(x 9.3~)을 지나지 않는다 (11/9 녹화: 4호가 x 4.3, y 0.1에서
#   멈춤. 로컬 재현: 추적·안전을 켜면 손님 없이도 가구를 움직이는 장애물로 보고 그 통로·부스 칸에서 막힘)
# - 같은 속도로 동시에 출발할 때 두 로봇이 1 m 안에서 마주 오는 때가 없다 (같은 통로를 다른 때 지나는 정적 겹침은
#   최대 13 m - 자리를 모두 다르게 하고 30 m 넘는 작업 넷을 만들면 더 줄일 수 없었다) (11/9 녹화: 1·2·3호가 윗줄 t03~t04 사이에서 마주 와 서로 막힘, 예전 시작 작업은
#   마주 오는 구간 최대 10.8 m)
# path_m: 시작 자리 → 픽업 → 하역 A* (amr_planning_core, 새 restaurant_gt(#341) + 식당 프로필 costmap).
#   plan: 위 판단에 쓴 값 (test_demo_scene이 본다)
plan:
  speed_check_mps: 0.3    # 4호가 0초 하한 전에 끝나지 않는지 볼 속도 (관측 평균 약 0.2 m/s의 1.5배)
  dwell_s: 2.0            # amr_bt dwell_s (픽업·하역마다)
  t0_min_s: 66.0          # 시작 뒤 0초 하한 (busy 2 s + 할당 확인 + 1 s + 배달 대기 60 s)
  first: amr_04
  first_m: 21.7
  others_m: [32.9, 33.9, 32.2, 32.4]
steps:
  - name: busy
    gap_s: 0.5
    tasks:
      - {id: b_busy_c02, type: delivery, pickup: t04, dropoff: c02, path_m: 32.9}       # amr_05
      - {id: b_busy_t02, type: delivery, pickup: L04, dropoff: t02, path_m: 21.7}       # amr_04 (먼저 끝난다)
      - {id: b_busy_t03, type: delivery, pickup: buffet_1, dropoff: t03, path_m: 33.9}  # amr_03
      - {id: b_busy_L03, type: delivery, pickup: stall_2, dropoff: L03, path_m: 32.2}   # amr_02
      - {id: b_busy_t10, type: delivery, pickup: stall_1, dropoff: t10, path_m: 32.4}   # amr_01
  # 5대가 모두 할당받은 뒤 1 s 뒤 2인석 배달 1건 (빈 로봇이 없어 대기한다)
  - name: queue
    after: {assigned: 5, delay_s: 1, timeout_s: 60}
    tasks:
      - {id: b_wait_c01, type: delivery, pickup: stall_3, dropoff: c01}
  # 배달이 60 s 넘게 기다렸고(같은 우선순위가 된다) 4호(b_busy_t02를 맡은 로봇)가 하역 2 m 앞일 때 회수 호출 5건
  # = 0초 (/demo/t0). 실제 속도와 상관없이 0초 직후 4호가 비어 배달(켬)이나 회수(끔)를 받는다
  - name: collects
    # 시간 제한 70 s (배달 요청 뒤): 4호가 손님 사이에 갇혀 near가 안 맞으면 그 시각을 0초로 하고 회수를 낸다 (11/10 off_v3:
    # 4호가 가운데 통로 손님 사이에서 못 움직여 near가 끝까지 안 맞고, 150 s에 5호가 배달을 가져갔다). on_v3은 배달 요청
    # 66.7 s 뒤 near로 맞았다. scene.json t0_by가 near 또는 timeout
    after: {pending: 1, delay_s: 60, near: {task: b_busy_t02, within_m: 2.0}, timeout_s: 70}
    t0: true
    gap_s: 2.0
    tasks:
      - {id: b_collect_t01, type: collect, pickup: t01, dropoff: return_1, priority: 200}
      - {id: b_collect_t06, type: collect, pickup: t06, dropoff: return_2, priority: 200}
      - {id: b_collect_t08, type: collect, pickup: t08, dropoff: return_1, priority: 200}
      - {id: b_collect_t12, type: collect, pickup: t12, dropoff: return_2, priority: 200}
      - {id: b_collect_t14, type: collect, pickup: t14, dropoff: return_1, priority: 200}
