# 식당 시연 2 2막: 오래 기다린 배달 보호 (tools/harness/demo_scene.py 장면 파일, 하네스 demo_s2b)
# 5대 모두 배달 중 + 2인석(c01) 배달 1건 대기 → 그 배달이 60 s 기다린 0초(/demo/t0)부터 1·6·8·12·14번 테이블
# 회수 호출 5건을 2 s 간격으로. 회수 priority는 둘 다 200.
# 기대 (연우 시나리오):
#   켬 (fleet_manager_restaurant.yaml aging 1.667/s): 배달이 회수보다 60 s 더 기다려 회수와 같은 순서가 되고(같으면 먼저
#       들어온 쪽), 다음에 일을 마친 4호가 배달에 배정된다
#   끔 (aging 0): 2인석 배달이 회수 5건 뒤로 계속 밀린다
#   회수 5건은 퇴식구 두 곳(return_1·2 예약) 때문에 한 번에 두 건까지만 배정되고 줄을 선다 (서버 동작, 둘 다 같다)
# 왜 60 s 뒤에 회수를 넣나: aging은 모든 작업에 같은 속도로 더해져 차이(200 - 100)가 "회수보다 60 s 먼저 들어옴"이어야
# 없어진다. 그래서 회수 호출은 배달 요청 60 s 뒤에 넣고, 그동안 배달이 계속 대기해야 한다.
#
# 시작 작업을 두 바퀴 준다 (식당 속도 0.8 m/s, #338): 한 바퀴로는 0초(시작 뒤 약 66 s)까지 5대를 다 붙잡을 만큼 긴 작업이
# 없다(가장 긴 작업 약 55 m = 0.8 m/s로 약 70 s). 그래서
#   busy  (1바퀴): 5대에 하나씩. 낸 순서대로 amr_05, 04, 03, 02, 01 (1바퀴 픽업이 모두 로봇 줄보다 북쪽이라 최소거리 배정이
#                  북쪽 로봇부터 준다)
#   more  (2바퀴): 5건을 2인석 배달보다 먼저 내 둔다. 같은 우선순위면 먼저 들어온 작업이 앞서므로(작업표 created 순),
#                  1바퀴를 마친 로봇은 차례로 이것을 가져가고 2인석 배달은 계속 대기한다
#   4호: 1바퀴가 가장 짧아(21.1 m, 다른 로봇보다 17.4 m 짧다) 먼저 끝내고 2바퀴 첫 작업(b_more_t05)을 가져간다. 두 바퀴 합
#        54.5 m는 0.8 m/s로 달려도 76 s라 0초보다 약 10 s 늦고, 다른 로봇의 1바퀴(최대 44.2 m)보다 10 m 길어 다른 로봇이
#        2바퀴 작업 넷을 먼저 다 가져간다. 다른 로봇은 2바퀴 어느 작업을 받아도 두 바퀴 합이 61.1 m 이상(4호 + 6.6 m)
#   → 0초 뒤 처음 일을 마치는 로봇이 4호이고, 그때 남은 대기 작업은 2인석 배달과 회수 호출뿐이다
# 서버 스테이션 예약(맡긴 작업의 픽업·하역을 끝날 때까지 잡아 둠, 1 m): 1바퀴 5건, 2바퀴 5건, 2인석 배달의 자리 22곳이 모두
#   서로 다르다. 겹치면 둘째 작업이 앞 작업이 끝날 때까지 할당되지 않는다 (11/8 녹화: 1바퀴가 배식대 1·2를 둘씩 나눠 써
#   3건만 할당되고 more 단계가 시간 초과로 늦었다). 그래서 시작 작업은 테이블·부스·매장에서 픽업하고, 1-2·2막 핵심 자리
#   (buffet_2, t11, c01, 회수 대상 t01·t06·t08·t12·t14, 퇴식구 return_1·2)와 2인석 배달 픽업 stall_3은 쓰지 않는다.
#   다른 로봇 두 바퀴 여유가 6.6 m인 것도 이 때문이다 (자리를 모두 다르게 하면 남는 자리가 적어 10 m는 못 맞춘다)
# path_m: 1바퀴는 시작 자리 → 픽업 → 하역, 2바퀴는 픽업 → 하역 A* 길이 (amr_planning_core, 새 restaurant_gt(#341) +
#   식당 프로필 costmap, 11/8 계산. experiments/restaurant_demo/scene_plan/search_reserved.py). plan: 위 판단에 쓴 값
#   (test_demo_scene이 본다)
plan:
  speed_mps: 0.8          # 식당 DWA max_v (#338)
  dwell_s: 2.0            # amr_bt dwell_s (픽업·하역마다)
  t0_s: 66.0              # 시작 뒤 0초까지 (busy 2 s + 할당 확인 + more 2 s + 1 s + 60 s)
  first: amr_04
  first_round1_m: 21.1
  others_round1_m: [44.2, 38.5, 39.1, 39.8]
  first_total_m: 54.5
  others_min_total_m: 61.1
steps:
  - name: busy
    gap_s: 0.5
    tasks:
      - {id: b_busy_L02, type: delivery, pickup: buffet_1, dropoff: L02, path_m: 44.2}   # amr_05
      - {id: b_busy_t02, type: delivery, pickup: t10, dropoff: t02, path_m: 21.1}        # amr_04 (먼저 끝난다)
      - {id: b_busy_b02, type: delivery, pickup: t03, dropoff: b02, path_m: 38.5}        # amr_03
      - {id: b_busy_L04, type: delivery, pickup: stall_1, dropoff: L04, path_m: 39.1}    # amr_02
      - {id: b_busy_b01, type: delivery, pickup: t07, dropoff: b01, path_m: 39.8}        # amr_01
  # 5대가 모두 할당받은 뒤 2바퀴 작업 5건 (빈 로봇이 없어 대기한다). 첫 작업은 먼저 끝나는 4호 몫
  - name: more
    after: {assigned: 5, timeout_s: 60}
    gap_s: 0.5
    tasks:
      - {id: b_more_t05, type: delivery, pickup: b03, dropoff: t05, path_m: 12.3}        # 4호 (t02에서 b03까지 21.0 m)
      - {id: b_more_c02, type: delivery, pickup: stall_2, dropoff: c02, path_m: 15.4}
      - {id: b_more_stall4, type: delivery, pickup: t13, dropoff: stall_4, path_m: 12.9}
      - {id: b_more_L03, type: delivery, pickup: t04, dropoff: L03, path_m: 12.8}
      - {id: b_more_L01, type: delivery, pickup: t09, dropoff: L01, path_m: 11.4}
  # 2바퀴 작업보다 늦게 2인석 배달 1건
  - name: queue
    after: {delay_s: 1}
    tasks:
      - {id: b_wait_c01, type: delivery, pickup: stall_3, dropoff: c01}
  # 배달이 60 s 기다린 뒤 회수 호출 5건 = 0초 (/demo/t0). 같은 우선순위가 되는 순간이다
  - name: collects
    after: {pending: 1, delay_s: 60, timeout_s: 90}
    t0: true
    gap_s: 2.0
    tasks:
      - {id: b_collect_t01, type: collect, pickup: t01, dropoff: return_1, priority: 200}
      - {id: b_collect_t06, type: collect, pickup: t06, dropoff: return_2, priority: 200}
      - {id: b_collect_t08, type: collect, pickup: t08, dropoff: return_1, priority: 200}
      - {id: b_collect_t12, type: collect, pickup: t12, dropoff: return_2, priority: 200}
      - {id: b_collect_t14, type: collect, pickup: t14, dropoff: return_1, priority: 200}
