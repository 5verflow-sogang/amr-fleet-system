# 장면 3 Gazebo 고정 요청 시각 (두 조건 동일). 4호는 북쪽 가운데(매장 2·3 → t03·t04, 서쪽 손님에서 4 m 넘게 떨어짐)에서
# 일하고, 남쪽 회수는 75·105 s.
# 1·2·5호는 남동쪽 홀(충전소 옆), 3호는 남서쪽 대기 자리(-3.5, -6.3)에서 쉰다. 105 s 회수는 OFF에서 가까운 1·2·5호가 모두
# 충전 중(남동쪽 홀이 빔)이라 3호가 넓은 남쪽 통로로 약 10.5 m를, ON에서는 미리 충전을 마친 2호가 대기 자리에서 약 5 m를 온다.
# 4호 요청은 45~50 s 간격이라 요청 때마다 4호가 비어 있다 (11/18 A2: 30 s 간격이면 60 s 배달 때 4호가 아직 바빠 남서쪽 3호가
# 홀을 가로질러 가져가고, 105 s 회수를 4호가 맡았다). 95 s 요청으로 4호는 105 s에 바쁘다 → OFF 105 s 회수 후보는 3호뿐.
# 회수는 하역 자리를 나눈다: 75 s(5호) → 퇴식대 2 앞 return_2, 105 s(주인공) → 옆면 return_s3_side. 5호가 하역 뒤 충전소로
# 나가지 못해도 주인공이 그 자리로 들어갈 일이 없다 (A2 ON: 같은 자리에서 5호·2호가 마주 막혔다).
# 같은 매장·테이블을 시간차(delay_s)로 다시 쓴다. 앞 작업이 안 끝났으면 서버 큐에서 기다리는 것이 의도라
# 시작할 때의 자리 겹침 확인(demo_scene.py station_conflicts)을 끈다
