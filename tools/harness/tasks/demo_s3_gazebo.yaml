# 장면 3: 회수 정차 3곳을 분리해 완료 후 대기 중인 로봇이 다음 회수를 막지 않게 한다. 켬/끔은 같은 일정이다.
t0_when:
  battery_below: 31
steps:
- name: start
  gap_s: 6
  tasks:
  - &id002
    id: s3_c01
    type: collect
    pickup: c01
    dropoff: return_1
  - &id001
    id: s3_c02
    type: collect
    pickup: c02
    dropoff: return_2
  - &id003
    id: s3_c01_alt
    type: collect
    pickup: c01
    dropoff: return_s3_side
  - &id004
    id: s3_north_1
    type: delivery
    pickup: stall_1
    dropoff: t02
  - &id005
    id: s3_north_2
    type: delivery
    pickup: stall_2
    dropoff: t03
- name: flow
  after:
    assigned: 5
    timeout_s: 30
  gap_s: 7
  repeat: 20
  tasks:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
