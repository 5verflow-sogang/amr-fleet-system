# 식당 시연 2 1막: 회수 호출 우선 처리 (tools/harness/demo_scene.py 장면 파일, 하네스 demo_s2a)
# 5대 모두 배달 중 + 배달 4건(9·15·4·2번 테이블) 대기 → 0초에 3번 테이블 회수 호출(TYPE_COLLECT → return_1)과 /demo/t0.
# 기대 (연우 시나리오):
#   켬 (회수 priority 200): 회수가 대기열 맨 위로 가고, 다음에 일을 마친 2호가 바로 배정 → 3번 테이블 → 퇴식구
#   끔 (회수 priority 100): 배달과 같은 우선순위라 대기열 맨 뒤, 배달 4건이 배정된 뒤에 배정
# aging은 둘 다 끔 (fleet_params 비움 = aging_rate 0.0).
#
# 누가 어느 작업을 맡나: 로봇이 동쪽 벽(x 11.2)에 amr_01(남) ~ amr_05(북) 한 줄로 서 있다. 시작 작업을 0.5 s 간격으로 내면
# 최소거리(nearest) 배정이 낸 순서대로 amr_05, 04, 03, 02, 01에 준다 (장면 검사가 서버와 같은 탐욕 배정으로 확인한다).
# 2호가 먼저 일을 마치게 4번째 작업(2호)을 가장 짧게, 다음 로봇과 12 m 넘게 차이 나게 둔다.
# 서버 스테이션 예약(맡긴 작업의 픽업·하역을 끝날 때까지 잡아 둠, 1 m): 시작 작업 5건, 대기 배달 4건(9·15·4·2번 테이블,
#   매장 stall_3·4·1·2 픽업), 회수(t03 → return_1)의 자리가 모두 서로 다르다. 겹치면 대기 배달이 시작 작업이 끝날 때까지
#   큐에서 빠져, 끔에서 회수가 배달 4건보다 먼저 나갈 수 있다. 그래서 시작 작업은 매장이 아니라 테이블·부스에서 픽업한다.
# path_m: 시작 자리 → 픽업 → 하역 A* 경로 길이 (amr_planning_core, 새 restaurant_gt(#341) + 식당 프로필 costmap, 11/8 계산.
#   experiments/restaurant_demo/scene_plan/search_reserved.py). 2호 12.0 m, 나머지 24.6~26.6 m (차이 12.6 m).
#   0초는 시작 뒤 약 8 s라 2호가 0.8 m/s(#338)로 달려도 12.0 / 0.8 + 4 = 19 s에 끝나 0초 뒤다
# 정차 자리는 stations_restaurant.yaml.
steps:
  - name: busy
    gap_s: 0.5
    tasks:
      - {id: a_busy_t11, type: delivery, pickup: t06, dropoff: t11, path_m: 26.6}       # amr_05
      - {id: a_busy_buffet1, type: delivery, pickup: L03, dropoff: buffet_1, path_m: 26.2}   # amr_04
      - {id: a_busy_t13, type: delivery, pickup: t07, dropoff: t13, path_m: 24.8}       # amr_03
      - {id: a_busy_b02, type: delivery, pickup: b01, dropoff: b02, path_m: 12.0}       # amr_02 (먼저 끝난다)
      - {id: a_busy_t12, type: delivery, pickup: b03, dropoff: t12, path_m: 24.6}       # amr_01
  # 5대가 모두 할당받은 뒤 배달 4건 (빈 로봇이 없어 대기한다)
  - name: queue
    after: {assigned: 5, timeout_s: 60}
    tasks:
      - {id: a_wait_t09, type: delivery, pickup: stall_3, dropoff: t09}
      - {id: a_wait_t15, type: delivery, pickup: stall_4, dropoff: t15}
      - {id: a_wait_t04, type: delivery, pickup: stall_1, dropoff: t04}
      - {id: a_wait_t02, type: delivery, pickup: stall_2, dropoff: t02}
  # 4건이 대기 중인 것을 작업표로 확인하고 3 s 뒤 회수 호출 = 0초 (/demo/t0)
  - name: collect
    after: {pending: 4, delay_s: 3, timeout_s: 30}
    t0: true
    tasks:
      - {id: a_collect_t03, type: collect, pickup: t03, dropoff: return_1, priority: "{collect_priority}"}
