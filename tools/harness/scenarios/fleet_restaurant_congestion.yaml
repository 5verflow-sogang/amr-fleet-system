# 식당 시연 1-1: 혼잡도 반영 할당 켬/끔 (실제 로봇 스택). 식당 월드 + 서빙 로봇 5대 + 위치추정 + Nav2 + Fleet 서버 +
# 피크 손님(서쪽 통로·배식대 앞 몰림) + 혼잡도 노드 + 작업 생성기(restaurant_serving.yaml) + rosbag.
# 결과 정리: experiments/restaurant_congestion (analyze.py)
#
#   tools/harness/gcp_run.sh fleet_restaurant_congestion -n 5 --set assign=off --label off
#   tools/harness/gcp_run.sh fleet_restaurant_congestion -n 5 --set assign=on  --label on
#
# Nav2 혼잡도 필터(1-2)는 켬·끔 모두 끈다(system.launch 기본 congestion_filter 없음). 할당 효과만 본다.
# 구역 클라이언트는 끈다: zones_file 기본값이 물류센터 좁은 통로라 식당 홀에 걸린다(#308).
name: fleet_restaurant_congestion
packages: amr_bringup
num_robots: 5
use_sim_time: true
seed_base: 1
# GCP b 슬롯(c2d-8)에서 RTF 약 0.25(11/5 스모크): 시뮬레이션 700 s ≈ 실제 47분 + 기동 4분
timeout_s: 5400
params:
  num_robots: 5
  delay_ms: 100
  loss_pct: 0
  algorithm: nearest
  # off: 직선거리 / on: 직선거리 + 혼잡 구역 통과 길이 × 가중치 (#297)
  assign: "off"
  cost_fn: euclidean
  congestion_weight: 3.0
  # 시뮬레이션 시간 (s). 일정 약 490 s(10 s + 23 × 평균 20 s) 뒤 마지막 서빙을 끝낼 여유 약 3.5분
  duration_s: 700
  guests: peak
  # 스폰 간격(실제 s). 5 s면 5대 Nav2 기동이 자주 멈췄다(11/6 시도 기준 8번). 시연 녹화(demo_restaurant)와 같은 값
  spawn_interval_s: 25
  # 위치추정. 식당에서 바퀴 헛돎으로 AMCL이 밀려 로봇이 가구 안에 있다고 믿고 이동 실패가 났다(11/6·11/7, 완료 0~3 / 24).
  # #330 머지 뒤 ground_truth로 돌린다 (1-1은 할당 효과만 재므로 정답 위치를 써도 된다. 결과에 밝힌다). 지금 dev는 true(=amcl)
  localization: "true"
processes:
  - name: stack
    cmd: >-
      ros2 launch amr_bringup system.launch.py num_robots:={num_robots} nav2:=true localization:={localization}
      world:=restaurant.sdf body:=serving nav2_composition:=true
      robots_file:=$(ros2 pkg prefix amr_bringup)/share/amr_bringup/config/robots_restaurant.yaml
      map:=$(ros2 pkg prefix amr_mapping)/share/amr_mapping/maps/restaurant_gt.yaml map_origin_in_world:="[0, 0, 0]"
      dynamic_obstacles:=true dynamic_obstacles_file:=dynamic_obstacles_restaurant_{guests}.yaml
      staff_file:=dynamic_obstacles_restaurant_staff.yaml congestion:=restaurant
      seed:={seed} delay_ms:={delay_ms} loss_pct:={loss_pct} algorithm:={algorithm}
      cost_fn:={cost_fn} congestion_weight:={congestion_weight}
      assignments_csv:={run_dir}/assignments.csv epoch_file:={run_dir}/epoch
      fault_events_file:={run_dir}/fault_events.csv spawn_interval_s:={spawn_interval_s}
    ready_topic: /fleet/heartbeat
    # fleet_stack과 같다: 모든 로봇의 bt_navigator가 active여야 작업을 받아 움직인다
    ready_cmds:
      - for i in $(seq -f %02g 1 {num_robots}); do timeout 20 ros2 lifecycle get /amr_$i/bt_navigator | grep -q '^active' || exit 1; done
      # 혼잡도 노드는 system.launch congestion:=restaurant가 손님 스폰과 같은 파일로 띄운다(#315). 끔 조건도 띄운다:
      # 혼잡도 체류 비교와 녹화를 같게 하려고. 서버는 cost_fn:=congestion일 때만 구독한다
      - timeout 10 ros2 topic echo --once /fleet/congestion > /dev/null
    # 스폰 25 s × 5대 + Nav2 기동. 시연 녹화와 같은 값
    ready_timeout_s: 600
    settle_s: 5
  - name: rosbag
    cmd: ros2 bag record -o {run_dir}/rosbag -e '/fleet/.*|/amr_[0-9][0-9]/fleet/.*|/amr_[0-9][0-9]/odom'
    settle_s: 3
  # 일정을 시뮬레이션 시간으로 낸다(use_sim_time). RTF가 0.25면 실제 시간 일정은 시뮬레이션에서 4배 몰려
  # "놀고 있는 로봇 2대 이상" 조건이 깨진다. task_generator.launch.py에는 #285 전까지 use_sim_time 인자가 없어 ros2 run으로 띄운다
  - name: task_generator
    cmd: >-
      ros2 run amr_fleet_manager task_generator --ros-args -p use_sim_time:=true -p seed:={seed}
      -p schedule_out:={run_dir}/tasks.json -p "map_origin_in_world:=[0.0, 0.0, 0.0]"
      -p stations_file:=$(ros2 pkg prefix amr_fleet_manager)/share/amr_fleet_manager/config/stations_restaurant.yaml
      -p scenario_file:=$(ros2 pkg prefix amr_fleet_manager)/share/amr_fleet_manager/config/scenarios/restaurant_serving.yaml
param_sets:
  assign:
    "off": {cost_fn: euclidean}
    "on": {cost_fn: congestion}
driver:
  mode: wait
  # 작업 일정과 같은 시뮬레이션 시간으로 기다린다
  use_sim_time: true
  duration_s: "{duration_s}"
postprocess:
  - name: fleet_metrics
    cmd: ros2 run amr_fleet_manager fleet_metrics {run_dir}/rosbag --out {run_dir} --delay-ms {delay_ms} --num-robots {num_robots}
cleanup:
  - pkill -9 -f "[i]gn gazebo" || true
  - pkill -9 -f "[p]arameter_bridge" || true
