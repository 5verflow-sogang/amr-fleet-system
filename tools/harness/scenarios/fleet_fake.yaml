# Fleet 메시지 신뢰성 시나리오 (가짜 로봇). 시뮬레이터·Nav2 없이 서버·장애주입기·가짜 로봇 N대(기본 5)·작업 생성기.
# 연구 1 Before 데이터용: fleet_latency.csv(지연·손실), response_time.csv(Ack 왕복시간).
# 가짜 로봇은 odom을 내지 않으므로 response_time(움직임 응답)은 비어 있다.
# 응답 시간 KPI(200 ms)의 Before 데이터는 실제 로봇 스택 시나리오가 따로 필요하다.
#
#   python3 tools/harness/run.py fleet_fake -n 10 --set delay_ms=200 --set loss_pct=5 --label d200_l5
#   python3 tools/harness/run.py fleet_fake -n 10 --set num_robots=10 --label n10_d0   # 연구 1 규모 곡선
name: fleet_fake
# 빌드할 패키지 (docker_run.sh). fleet_mode=decentral·hybrid의 경매 노드 때문에 amr_fleet_decentralized를 넣는다
packages: amr_fleet_manager amr_fault_injector amr_fleet_decentralized
# 기본 대수. 실행마다 params num_robots로 바꾼다 (meta.json은 params 값을 기록)
num_robots: 5
use_sim_time: false
seed_base: 1
timeout_s: 900
params:
  delay_ms: 0
  loss_pct: 0
  # 서버 강제종료 시각은 서버 launch 시작부터 잰다(#68). 작업 생성기는 다른 프로세스가 뜬 뒤 약 10초 뒤에 일정을 시작하므로,
  # 작업 시작 기준으로는 약 10초 빠르다
  kill_at_s: -1
  restart_after_s: -1
  # 로봇 장애: 이 로봇(예: amr_03)을 kill_robot_at_s(가짜 로봇 launch 시작부터, 실제 시간)에 SIGKILL. none이면 끄기.
  # 서버는 RobotState가 assignment.reclaim_timeout_s(5초) 끊기면 그 로봇의 작업을 회수해 다시 할당한다
  kill_robot: none
  kill_robot_at_s: -1
  restart_robot_after_s: -1
  # 연구 1 확장 조건 (명세 밖, 장애 주입기 README "확장 조건"). allow_out_of_spec=true일 때만 손실 70%까지와
  # 연속 끊김을 허용한다. 끊김: 주입기 시작 blackout_at_s초부터 blackout_s초 (blackout_period_s마다 되풀이, 0이면 한 번),
  # blackout_robot(all 또는 amr_NN)의 중계 링크. 라벨에 조건을 넣는다 (예: --label central_bo3_p120)
  allow_out_of_spec: false
  blackout_s: 0
  blackout_at_s: 0
  blackout_period_s: 0
  blackout_robot: all
  # 끊김 동안 메시지: delay(기본, 다시 이어지면 순서대로 전달) 또는 drop(버림, 더 가혹한 비교 조건)
  blackout_mode: delay
  algorithm: nearest
  # 연구 1 비교군 (central | decentral | hybrid). 아래 param_sets가 서버·경매 노드·중계·작업 생성기 대기 대상을 채운다
  #   --set fleet_mode=decentral   # 서버 없음, 경매 노드 N대, 장애 주입기가 경매 토픽도 중계
  #   --set fleet_mode=hybrid      # 서버 + 경매 노드 N대 (평시 중앙, heartbeat가 끊긴 로봇만 분산, #215)
  fleet_mode: central
  # 가짜 로봇 수 (1~10). 연구 1 규모 곡선: --set num_robots=3/5/7/10. 장애 주입기·녹화·지표 변환이 같은 수를 쓴다
  num_robots: 5
  # 작업 생성기 basic.yaml: 첫 작업 5초 + 10초 간격 60건 ≈ 600초. 마지막 Ack까지 여유를 둔다
  duration_s: 620
  # 작업 수·간격 (basic.yaml count·interval_s를 실행 동안 바꿔 끼움, config_patch). 규모 곡선의 작업 부하 규칙:
  #   총 부하 고정(A): 대수와 상관없이 60건·10초 (기본)
  #   로봇당 부하 고정(B): 12 × N건, 50 / N초 간격 → 같은 600초 동안 로봇마다 약 12건 (experiments/research1/scale_curve.md)
  task_count: 60
  task_interval_s: 10.0
processes:
  - name: fleet_manager
    cmd: >-
      ros2 launch amr_fleet_manager fleet_manager.launch.py algorithm:={algorithm}
      assignments_csv:={run_dir}/assignments.csv epoch_file:={run_dir}/epoch
      kill_at_s:={kill_at_s} restart_after_s:={restart_after_s} fault_events_file:={run_dir}/fault_events.csv
    ready_topic: /fleet/heartbeat
    # 분산(decentral)에서는 서버를 띄우지 않는다. 떠 있으면 서버도 할당해 경매와 겹친다 (#208 하연 리뷰)
    enabled: "{server}"
  - name: fault_injector
    cmd: >-
      ros2 launch amr_fault_injector fault_injector.launch.py delay_ms:={delay_ms} loss_pct:={loss_pct} seed:={seed}
      num_robots:={num_robots} relay_auction:={relay_auction} allow_out_of_spec:={allow_out_of_spec}
      blackout_s:={blackout_s} blackout_at_s:={blackout_at_s} blackout_period_s:={blackout_period_s}
      blackout_robot:={blackout_robot} blackout_mode:={blackout_mode}
    settle_s: 2
  - name: fake_robots
    cmd: >-
      ros2 launch amr_fleet_manager fake_robots.launch.py count:={num_robots} relayed:=true
      kill_robot:={kill_robot} kill_robot_at_s:={kill_robot_at_s} restart_robot_after_s:={restart_robot_after_s}
      fault_events_file:={run_dir}/fault_events.csv
    settle_s: 3
  # 분산 경매 노드 (fleet_mode가 decentral·hybrid일 때만)
  - name: task_auctions
    cmd: >-
      ros2 launch amr_fleet_decentralized task_auctions.launch.py count:={num_robots} relayed:=true
      fleet_mode:={fleet_mode}
    enabled: "{auction}"
    settle_s: 2
  # 녹화를 작업 생성기보다 먼저 시작한다 (작업 생성기는 서버 구독을 확인한 뒤 일정을 시작한다.
  # 분산이면 서버 대신 경매 노드가 로봇 수만큼 다 붙을 때까지 기다린다 - 늦게 뜬 로봇이 열 작업을 놓치지 않게, #213)
  - name: rosbag
    cmd: ros2 bag record -o {run_dir}/rosbag -e '/fleet/.*|/amr_[0-9][0-9]/fleet/.*|/amr_[0-9][0-9]/odom'
    settle_s: 3
  - name: task_generator
    cmd: >-
      ros2 launch amr_fleet_manager task_generator.launch.py seed:={seed} schedule_out:={run_dir}/tasks.json
      server_node:={gen_server_node} server_count:={gen_server_count}
# fleet_mode 값에 딸린 params (--set으로 직접 주면 그 값이 이긴다). 표에 없는 값이면 실행 전에 멈춘다.
# _blocked: 선행 PR이 머지되기 전에는 이름과 다른 실험이 돈다 (분산 이름의 중앙 데이터 등). 머지되면 그 줄을 지운다
param_sets:
  fleet_mode:
    central: {server: 'true', auction: 'false', relay_auction: 'false',
              gen_server_node: fleet_manager, gen_server_count: '1'}
    decentral: {server: 'false', auction: 'true', relay_auction: 'true',
                gen_server_node: task_auction, gen_server_count: '{num_robots}',
                _blocked: '#213(작업 생성기 server_count) 머지 전'}
    hybrid: {server: 'true', auction: 'true', relay_auction: 'true',
             gen_server_node: fleet_manager, gen_server_count: '1',
             _blocked: '#213·#215(경매 노드 fleet_mode, 하이브리드 폴백) 머지 전'}
driver:
  mode: wait
  use_sim_time: false
  duration_s: "{duration_s}"
config_patch:
  amr_fleet_manager/config/scenarios/basic.yaml:
    count: "{task_count}"
    interval_s: "{task_interval_s}"
postprocess:
  - name: fleet_metrics
    cmd: ros2 run amr_fleet_manager fleet_metrics {run_dir}/rosbag --out {run_dir} --delay-ms {delay_ms} --num-robots {num_robots}
  # 보기용 그림 (plots/timeline.png). fleet_metrics가 쓴 robot_states.csv를 읽는다
  - name: fleet_plot
    cmd: ros2 run amr_fleet_manager fleet_plot {run_dir}
