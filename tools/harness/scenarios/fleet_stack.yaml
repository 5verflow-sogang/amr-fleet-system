# Fleet KPI 시나리오 (실제 로봇 스택). Gazebo + 로봇 N대(기본 5, 카메라 끔) + 위치추정 + Nav2 + 구역 클라이언트 +
# Fleet 서버·장애 주입기(system.launch.py 2단계) + 작업 생성기 + CPU 기록.
# 원 명세 9-1 Fleet KPI 세 가지를 잰다:
#   - 응답 시간 200 ms 이하 (50회 이상): response_time.csv (할당 → 로봇 움직임 시작, 송신·수신 기준 둘 다)
#   - 5대 운용 시 CPU 80 % 이하: cpu.csv (cpu_monitor.py, 컨테이너 cgroup 기준)
#   - 교착 없음: zone_waits.csv(구역 30 s 넘게 대기) · stalls.csv(60 s 넘게 정체) 0건
# 추적·안전 노드(3단계)는 끈다: 랙 옆에서 DWA가 갇히는 문제가 남아 있다(#169). Fleet 지표와는 관계없다.
#
#   tools/harness/docker_run.sh fleet_stack -n 1 --label smoke --set duration_s=300
#   tools/harness/gcp_run.sh fleet_stack -n 3 --label d100     # 기본: 5대, 지연 100 ms
#
# 응답 시간 50회: 작업 60건(10 s 간격)이 들어오지만 할당은 로봇이 비어야 생긴다. 한 실행에 다 못 모으면 -n으로 반복한다.
name: fleet_stack
# 빌드할 패키지 (docker_run.sh가 읽는다. HARNESS_PACKAGES·--packages가 있으면 그쪽이 우선)
packages: amr_bringup
num_robots: 5
use_sim_time: true
seed_base: 1
timeout_s: 2700
params:
  num_robots: 5
  # 원 명세 "로봇 간 통신 지연(최대 100ms)을 시뮬레이션에 반영"
  delay_ms: 100
  loss_pct: 0
  algorithm: nearest
  # 작업 생성기 basic.yaml은 600 s(실제 시간)에 60건을 넣는다. 로봇이 다 처리할 때까지 여유를 둔다
  duration_s: 1500
  # 지도: 0.05 m(warehouse_v1)와 그 정렬 원점(#157 B안). 기본 0.025 m는 5대에서 NavFn(Dijkstra)이 전체 지도
  # 2400x1600칸을 훑느라 경로를 끝내 못 냈다(GCP 스모크 10/14: planner "missed deadline" 475회, 로봇 정지).
  # Fleet KPI는 위치 정밀도와 관계없어 0.05 m를 쓴다 (system.launch 주석 "경로 계획이 느리면 0.05 m")
  map: warehouse_v1
  map_origin: "[-0.0571, 1.5167, 0.00013]"
processes:
  - name: stack
    cmd: >-
      ros2 launch amr_bringup system.launch.py num_robots:={num_robots} nav2:=true zone_client:=true
      seed:={seed} delay_ms:={delay_ms} loss_pct:={loss_pct} algorithm:={algorithm}
      assignments_csv:={run_dir}/assignments.csv epoch_file:={run_dir}/epoch
      fault_events_file:={run_dir}/fault_events.csv
      map:=$(ros2 pkg prefix amr_mapping)/share/amr_mapping/maps/{map}.yaml map_origin_in_world:="{map_origin}"
      spawn_interval_s:=5.0
    ready_topic: /fleet/heartbeat
    # 모든 로봇의 bt_navigator가 active여야 작업을 받아 움직인다. 보통 60 s(GCP 5대). 로봇 하나의 Nav2 기동이
    # 실패하면(lifecycle 서비스 호출 실패, 10/14 amr_05) 다시 오르지 않으므로 오래 기다리지 않고 기동 재시도로 넘긴다.
    # 스폰 간격은 기본 3 s → 5 s: 기동이 겹치면 CPU가 차서 lifecycle 서비스 호출이 실패했다
    ready_cmds:
      - for i in $(seq -f %02g 1 {num_robots}); do timeout 20 ros2 lifecycle get /amr_$i/bt_navigator | grep -q '^active' || exit 1; done
    ready_timeout_s: 240
    settle_s: 5
  # 기동이 끝난 뒤부터 잰다 (기동 중 빌드·스폰 부하는 운용 CPU가 아니다)
  - name: cpu_monitor
    cmd: python3 /repo/tools/harness/cpu_monitor.py --out {run_dir}/cpu.csv --interval 1.0
    settle_s: 1
  # 녹화를 작업 생성기보다 먼저 시작한다 (작업 생성기는 서버 구독을 확인한 뒤 일정을 시작한다)
  - name: rosbag
    cmd: ros2 bag record -o {run_dir}/rosbag -e '/fleet/.*|/amr_[0-9][0-9]/fleet/.*|/amr_[0-9][0-9]/odom'
    settle_s: 3
  - name: task_generator
    cmd: >-
      ros2 launch amr_fleet_manager task_generator.launch.py seed:={seed} schedule_out:={run_dir}/tasks.json
      map_origin_in_world:="{map_origin}"
driver:
  mode: wait
  # 작업 일정이 실제 시간이라 실제 시간으로 기다린다
  use_sim_time: false
  duration_s: "{duration_s}"
postprocess:
  - name: fleet_metrics
    cmd: ros2 run amr_fleet_manager fleet_metrics {run_dir}/rosbag --out {run_dir} --delay-ms {delay_ms} --num-robots {num_robots}
cleanup:
  - pkill -9 -f "[i]gn gazebo" || true
  - pkill -9 -f "[p]arameter_bridge" || true
  - pkill -9 -f "[c]pu_monitor.py" || true
