# 배터리 인지 운영 비교 실험 (가짜 로봇). 서버·가짜 로봇 N대(압축 배터리)·작업 생성기. 장애 주입 없음.
# 비교군(policy)은 배터리 정책만 바꾸고 할당 알고리즘은 nearest로 고정한다. 같은 seed는 같은 주문 일정이다.
#   B0: 지금 코드 (20 % 미만이면 할당에서 빼기만, 충전하러 보내지 않음)
#   B1: 단순 임계값 충전 (20 % 밑이면 충전하러 가서 100 %까지, 최소 운영 대수 없음)
#   P1: 자동 충전 30 % + 최소 운영 N대 + 에너지 예측 배정 (#312, #313)
#   P2: P1 + 피크 대비 (피크 전 미리 충전, 피크 중 동시 충전 1대·60 %까지만)
#
#   python3 tools/harness/run.py fleet_battery -n 10 --set policy=P2 --set load=peak --label p2_peak
#   python3 tools/harness/run.py fleet_battery -n 10 --set policy=B1 --set load=flat --label b1_flat
#
# 지표 (summary): fleet.battery_min·battery_depleted(방전 정지)·charging_max·serviceable_min·charges,
# 배송은 서버가 만든 충전·복귀 작업을 뺀 fleet.tasks_completed·throughput_per_min·assign_wait_s.*·task_time_s.p95
name: fleet_battery
packages: amr_fleet_manager
num_robots: 5
use_sim_time: false
seed_base: 1
timeout_s: 1500
params:
  # 비교군 (B0 | B1 | P1 | P2). 아래 param_sets가 서버 인자를 채운다
  policy: P1
  # 부하 (flat | peak): 작업 생성기 config/scenarios/battery_{load}.yaml. 둘 다 1020 s
  load: peak
  num_robots: 5
  # 최소 운영 대수 N (P1·P2). 5대면 동시 충전 2대까지
  min_in_service: 3
  # 피크 시간대 (서버 시작부터 s, P2). battery_peak.yaml의 피크(420–720 s)에 생성기 시작 지연(약 10 s)을 더했다
  peaks_s: '[430.0, 730.0]'
  algorithm: nearest
  duration_s: 1080
param_sets:
  policy:
    B0: {charging: 'false', charge_low: '30.0', policy_n: '0', energy: 'false', peaks: '[]', pre_peak_s: '0.0',
         peak_max: '0', peak_target: '100.0'}
    B1: {charging: 'true', charge_low: '20.0', policy_n: '0', energy: 'false', peaks: '[]', pre_peak_s: '0.0',
         peak_max: '0', peak_target: '100.0'}
    P1: {charging: 'true', charge_low: '30.0', policy_n: '{min_in_service}', energy: 'true', peaks: '[]',
         pre_peak_s: '0.0', peak_max: '0', peak_target: '100.0'}
    P2: {charging: 'true', charge_low: '30.0', policy_n: '{min_in_service}', energy: 'true', peaks: '{peaks_s}',
         pre_peak_s: '180.0', peak_max: '1', peak_target: '60.0'}
processes:
  - name: fleet_manager
    # 에너지 모델은 가짜 로봇 fake_robots_battery.yaml과 같은 값 (이동 0.1 %/m, 정지 0.01 %/s, 1 m/s, 직선)
    cmd: >-
      ros2 launch amr_fleet_manager fleet_manager.launch.py algorithm:={algorithm}
      assignments_csv:={run_dir}/assignments.csv epoch_file:={run_dir}/epoch station_clearance_m:=0.0
      charging:={charging} charge_low_percent:={charge_low} min_in_service:={policy_n}
      energy_check:={energy} energy_move_per_m:=0.1 energy_idle_per_s:=0.01 energy_speed_mps:=1.0
      energy_path_factor:=1.0 peaks:='{peaks}' pre_peak_s:={pre_peak_s} peak_max_charging:={peak_max}
      peak_target_percent:={peak_target}
    ready_topic: /fleet/heartbeat
  - name: fake_robots
    cmd: >-
      ros2 launch amr_fleet_manager fake_robots.launch.py count:={num_robots}
      battery_config:=$(ros2 pkg prefix amr_fleet_manager)/share/amr_fleet_manager/config/fake_robots_battery.yaml
    settle_s: 3
  - name: rosbag
    cmd: ros2 bag record -o {run_dir}/rosbag -e '/fleet/.*'
    settle_s: 3
  - name: task_generator
    cmd: >-
      ros2 launch amr_fleet_manager task_generator.launch.py seed:={seed} schedule_out:={run_dir}/tasks.json
      scenario_file:=$(ros2 pkg prefix amr_fleet_manager)/share/amr_fleet_manager/config/scenarios/battery_{load}.yaml
driver:
  mode: wait
  use_sim_time: false
  duration_s: "{duration_s}"
postprocess:
  - name: fleet_metrics
    cmd: ros2 run amr_fleet_manager fleet_metrics {run_dir}/rosbag --out {run_dir} --delay-ms 0 --num-robots {num_robots}
  - name: fleet_plot
    cmd: ros2 run amr_fleet_manager fleet_plot {run_dir}
