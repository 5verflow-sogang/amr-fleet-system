# 추적 정확도 KPI 장면 C, 0.5 m/s (참고 속력, D1 판정에는 안 쓴다): 로봇 (0, 10.5) 정지, 작업자 1명이 정면 10 m에서 다가와
# 차체 앞 약 1.15 m에서 돌아간다 (waypoint x 1.55, 설정 파일 주석. perception.md 1-7). LiDAR가 돌아가는 작업자를 계속 보므로 실행마다 첫 판정 하나만 쓴다
#   tools/harness/docker_run.sh tracking_kpi_c05 -n 10
name: tracking_kpi_c05
extends: tracking_kpi
packages: amr_gazebo amr_odometry amr_tracking
params:
  robot_x: "0.0"
  robot_y: "10.5"
  obstacles_config: $(ros2 pkg prefix amr_tracking)/share/amr_tracking/config/eval_obstacles_approach_0.5.yaml
  obstacle_ids: worker_approach
  obstacle_ready_topic: /dynamic_obstacles/worker_approach/ground_truth/odom
  duration_s: "40.0"
  wait_s: "55.0"
