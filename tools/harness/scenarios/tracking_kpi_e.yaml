# 추적 정확도 KPI 장면 E: 로봇 주행. 메인 통로 (−10, 10.5)에서 제자리 한 바퀴 → 동쪽 직진 15 m → 반 바퀴 → 돌아온다
# (0.5 m/s·0.5 rad/s, 스택 최고 속도). 시점이 바뀔 때의 추적 오차와 가짜 동적 트랙을 본다 (perception.md 1-7).
# 안전 노드 없이 cmd_vel을 직접 보낸다. 길에 구조물 없음(정답 지도에서 3.35 m 이상), worker_1(y 13)과는 2.5 m 떨어진 평행선
#   tools/harness/docker_run.sh tracking_kpi_e -n 2
name: tracking_kpi_e
extends: tracking_kpi
packages: amr_gazebo amr_odometry amr_tracking
params:
  robot_x: "-10.0"
  robot_y: "10.5"
  # driver(주행)가 끝날 때까지 기록한다. 끝나면 하네스가 평가 노드를 먼저 멈추고 그때 저장한다
  duration_s: "0.0"
driver:
  mode: segments
  topic: /amr_01/cmd_vel
  use_sim_time: true
  segments:
    - [0.0, 0.0, 5.0]       # 정지 (IMU 필터 보정, 장애물 출발)
    - [0.0, 0.5, 12.566]    # 제자리 한 바퀴 (2π / 0.5)
    - [0.5, 0.0, 30.0]      # 동쪽으로 직진 15 m (x −10 → 5)
    - [0.0, 0.5, 6.283]     # 반 바퀴 (π / 0.5)
    - [0.5, 0.0, 30.0]      # 서쪽으로 돌아옴
    - [0.0, 0.0, 10.0]      # 정지 상태로 10 s 더 기록
