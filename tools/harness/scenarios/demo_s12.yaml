# 식당 시연 1-2 혼잡 구간 우회 (이진). 켬/끔은 congestion_filter만 다르다. 같은 seed로 슬롯 둘에서 동시에 돌린다:
#   Actions Fleet Regression Test: scenario=demo_s12, repeats=1, label=on,  params="congestion_filter=keepout slot=b1"
#                                  scenario=demo_s12, repeats=1, label=off, params="congestion_filter=none slot=b2"
# 시작 위치: 1호 입구 옆(-10.0, -5.8), 동쪽을 본다 (robots_restaurant_s12.yaml). 배정 비용은 직선 거리(euclidean).
# 1초 재계획 BT는 body:=serving이면 자동(#307 머지 뒤)
# 손님: 1-2용 피크 파일(peak_scene12 = 피크에서 우회 통로를 왕복하는 customer_2를 뺀 것). 직원은 혼잡도에 안 센다
# 작업: 장면 스크립트(지금은 임시로 tools/harness/demo_scene.py, params scene_script)가 tasks/demo_s12.yaml대로 넣는다:
#   2~5호 동쪽 배달 → 0초에 1호에게 buffet_2 → 11번 테이블 배달과 /demo/t0. 연우 장면 스크립트가 오면 scene_script 한 줄만 바꾼다
name: demo_s12
extends: demo_restaurant
# docker_run.sh는 이 파일의 packages: 줄만 읽는다 (extends를 따라가지 않는다)
packages: amr_bringup
params:
  robots: robots_restaurant_s12.yaml
  guests: dynamic_obstacles_restaurant_peak_scene12.yaml
  task_generator: "false"
  # 작업 넣기 (임시: tools/harness/demo_scene.py + 장면 파일). 연우 장면 스크립트가 오면 이 한 줄만 바꾼다
  scene_script: python3 /repo/tools/harness/demo_scene.py
  scene_file: demo_s12.yaml
  cost_fn: euclidean
  congestion_filter: none
  cameras: top,west,stalls
  robot_camera: "false"
  # 워크플로는 이 파일 params만 받는다 (extends의 값은 안 본다). 녹화: localization=ground_truth
  localization: "true"
  # 0초는 시작 약 10 s 뒤. 켬은 우회 경로 12.8 m를 손님 사이로 가야 해 배식대 도착까지 보려고 시뮬레이션 120 s
  duration_s: 120
