# 실제 Gazebo 장면 3. 녹화 준비 뒤 배터리 부하를 함께 시작한다. 두 조건 동일.
# 2안 화면(왼쪽 관제 + 오른쪽 주인공 1인칭) 녹화: 추적·YOLO 인식을 켜고, 105 s 회수를 맡는 주인공 로봇의 카메라를 켠다
# (OFF 3호 / ON 2호, 카메라 하나마다 RTF가 떨어져 고정 카메라는 위 하나만). 측정 bag에는 모든 로봇의 경로·속도 명령·스캔·
# 안전 상태와 인식 결과를 더 남긴다 (매끄러움 판정 stalls.py, 1인칭 인식 지도, 반납대 앞 멈칫 원인 보기).
# costmap 팽창 반경은 기본값이다 (11/18 A2에서 0.8 m를 시험했더니 반납대 옆 좁은 통로에서 전역 경로를 못 만들어 5호가 72 s 섰다)
name: demo_s3_gazebo
extends: demo_s3
packages: amr_bringup
timeout_s: 7200
params:
  spawn_interval_s: 25
  robots: robots_restaurant_s3_gazebo.yaml
  scene_file: demo_s3_gazebo.yaml
  bt_params_file: amr_bt_battery_demo_s3_gazebo.yaml
  policy: 'on'
  duration_s: 180
  localization: ground_truth
  fleet_params: ''
  cameras: top
  stations_file: stations_restaurant_s3.yaml
  tracking: 'true'
  detection: 'true'
  bt: 'false'
  delayed_bt: 'true'
  record_extra: "|/amr_[0-9][0-9]/(plan|cmd_vel|cmd_vel_nav|scan|safety/status|perception/obstacles|ground_truth/odom|dwa/passing|dwa/avoid_mode)"
param_sets:
  policy:
    "on": {charging: "true", charge_low_percent: "30.0", min_in_service: "3", robot_camera: amr_02}
    "off": {charging: "true", charge_low_percent: "20.0", min_in_service: "0", robot_camera: amr_03}
