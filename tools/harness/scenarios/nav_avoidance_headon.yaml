# 동적 장애물 회피 KPI 보완 시나리오: 정면 접근 (test-plan I17, 연우·이진). 스택·기록·판정은 nav_avoidance와 같다.
#
#   tools/harness/gcp_run.sh nav_avoidance_headon -n 15 --label <라벨>                       # 원 명세 1.0 m/s
#   ... -n 15 --seed-base <첫 시드 + 15> --label <라벨>                                       # 30회 (GCP는 한 번에 15회까지)
#   tools/harness/gcp_run.sh nav_avoidance_headon -n 15 --set worker_speed=0.3 --label <라벨>  # 가장 느린 작업자
#   ros2 run amr_safety avoidance_report <실행 폴더…> --runs 30 --require-avoidance --return-from pass  # 판정 (amr_safety README)
#
# nav_avoidance(가로지르기)에서는 로봇이 서서 기다리면 돼 경로를 벗어나지 않아, 원 명세 KPI "복귀 5초"와
# "1.0 m/s 장애물 재계획 회피"가 잡히지 않았다(I17 11/3: 30회 모두 이탈 0.1 m 안). 여기서는 작업자 1명이
# 로봇 경로 위(옆으로 ±0.3 m 안)를 마주 걸어와 로봇이 비켜 가야 한다 (amr_safety avoidance_obstacles --mode headon).
# 작업자는 목표 너머 world x 10~11 m에서 출발한다. 목표를 map x 9 m로 둬 첫 전역 경로(기준 경로)에 끼지 않는다.
# 작업자는 로봇을 피하지 않지만, 로봇이 멈춘 채 앞길을 막으면 그 앞에서 선다(yield_to_robots). 그러면 로봇은
# 서 있는 사람을 돌아가야 한다.
name: nav_avoidance_headon
packages: amr_bringup
num_robots: 1
use_sim_time: true
seed_base: 1
timeout_s: 600
params:
  # 목표 (map 기준)
  goal_x: 9.0
  goal_y: 0.0
  # 지도와 그 정렬 원점 = map 원점의 world 자세 [x, y, yaw] (v2 0.025 m, amr_mapping README). 지도를 바꾸면 둘을
  # 같이 바꾼다 (v1 0.025 m: [-0.0562,1.5317,0.00009]). GCP --set 값에는 공백을 못 쓴다
  map: $(ros2 pkg prefix amr_mapping)/share/amr_mapping/maps/warehouse_v2_0025.yaml
  map_origin: "[-0.0439,1.4712,-0.00088]"
  # 목표 결과를 받은 뒤 더 기록하는 시간 [s] (복귀 판정 return_hold_s 1.0 s + 여유)
  after_goal_s: 5
  record: "true"
  # 시드 = 하네스 seed + seed_offset (장애물·시뮬레이션). 30회는 gcp_run.sh --seed-base로 첫 시드를 나눠 두 번 넣는다
  # (#283부터 GCP도 seed_base를 받는다). seed_offset은 처음 방식(0과 15)과 호환하려고 남겨 둔다
  seed_offset: "0"
  # 작업자 속도 [m/s] (원 명세 동적 장애물 0.3~1.5. 기본은 원 명세 "1.0 m/s 장애물")
  worker_speed: "1.0"
processes:
  # 기록을 가장 먼저 띄운다: 첫 전역 경로가 기준 경로다. 장애물 토픽은 1초마다 찾아 붙는다
  - name: avoidance_eval
    cmd: >-
      ros2 run amr_safety avoidance_eval --ros-args -r __ns:=/amr_01
      -p use_sim_time:=true -p "map_origin_in_world:={map_origin}" -p output_dir:={run_dir}/avoidance
    stop_first: true
    wait_files: ["{run_dir}/avoidance/avoidance_summary.json"]
    settle_s: 2
  - name: system
    # 로봇 1대 + 위치추정 + Nav2 + 추적 + 안전 노드 (Fleet·BT 끔: Nav2가 바로 주행한다, amr_bringup README)
    cmd: >-
      ros2 launch amr_bringup system.launch.py num_robots:=1 gui:=false enable_camera:=false
      fleet:=false bt:=false nav2:=true tracking:=true safety:=true seed:=$(( {seed} + {seed_offset} ))
      robots_file:=/repo/experiments/nav_kpi/robots.yaml
      map:={map} map_origin_in_world:="{map_origin}"
    ready_topic: /amr_01/odometry/filtered
    # 시뮬레이터 + 위치추정 + Nav2 기동. ready_cmds도 이 시간 안에
    ready_timeout_s: 300
    # 컨트롤러·플래너·BT가 active여야 목표를 받는다. 추적·안전 노드가 내기 시작해야 회피가 성립한다
    ready_cmds:
      - ros2 lifecycle get /map_server | grep -q '^active'
      - ros2 lifecycle get /amr_01/amcl | grep -q '^active'
      - ros2 lifecycle get /amr_01/planner_server | grep -q '^active'
      - ros2 lifecycle get /amr_01/controller_server | grep -q '^active'
      - ros2 lifecycle get /amr_01/bt_navigator | grep -q '^active'
      - timeout 5 ros2 topic echo --once /amr_01/perception/obstacles > /dev/null
      - timeout 5 ros2 topic echo --once /amr_01/safety/status > /dev/null
    settle_s: 5
  - name: rosbag
    cmd: >-
      if [ "{record}" = true ];
      then exec ros2 bag record -o {run_dir}/rosbag
      -e '^/(tf|tf_static|amr_01/(scan|ground_truth/odom|odom|plan|cmd_vel|cmd_vel_nav|dwa/avoid_mode|dwa/passing|safety/status|perception/(obstacles|collision_risks))|dynamic_obstacles/.*/ground_truth/odom)$';
      else exec sleep infinity; fi
    stop_first: true
  - name: obstacles
    # 실행마다 시드로 장애물 설정을 만들어 띄운다 (실행 폴더에 남는다)
    cmd: >-
      ros2 run amr_safety avoidance_obstacles --seed $(( {seed} + {seed_offset} )) --mode headon --speed {worker_speed}
      --out {run_dir}/obstacles.yaml
      && exec ros2 launch amr_gazebo dynamic_obstacles.launch.py config:={run_dir}/obstacles.yaml
      seed:=$(( {seed} + {seed_offset} )) use_sim_time:=true
    ready_topic: /dynamic_obstacles/worker_headon/ground_truth/odom
driver:
  # 목표를 보내고 결과(도착·실패)를 기다린 뒤 조금 더 기록한다. 목표가 실패해도 기록은 남긴다(판정은 avoidance_report)
  mode: command
  use_sim_time: true
  timeout_s: 540
  cmd: >-
    ros2 action send_goal /amr_01/navigate_to_pose nav2_msgs/action/NavigateToPose
    "{{pose: {{header: {{frame_id: map}}, pose: {{position: {{x: {goal_x}, y: {goal_y}}}, orientation: {{w: 1.0}}}}}}}}";
    sleep {after_goal_s}
cleanup:
  - pkill -9 -f "[i]gn gazebo" || true
  - pkill -9 -f "[p]arameter_bridge" || true
