# 식당 시연 녹화 스모크: 화면 없는 러너에서 카메라 렌더링·RTF·녹화·mp4 변환을 확인한다 (demo_restaurant 그대로).
#   Actions Fleet Regression Test: scenario=demo_smoke, label=cpu3, params="cameras=top,west,stalls slot=b1"
# 기대: video/에 카메라마다 duration_s x 15프레임 안팎의 mp4, rosbag의 /fleet/task_status가 0건이 아니다
name: demo_smoke
extends: demo_restaurant
# docker_run.sh는 이 파일의 packages: 줄만 읽는다 (extends를 따라가지 않는다)
packages: amr_bringup
params:
  cameras: top,west,stalls
  robot_camera: "false"
  duration_s: 60
