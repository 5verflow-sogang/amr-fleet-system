# YOLO 인식 노드 파라미터 (detection_node). 원 명세 6장 AI 인지
/**/detection:
  ros__parameters:
    # 모델. Dockerfile이 빌드할 때 받아 둔 COCO 사전학습 모델
    model_path: /opt/models/yolov8n.pt
    device: cpu                # GPU 컨테이너(docker-compose.gpu.yml)면 cuda:0
    # 추론 입력 크기 [px]. 카메라 640×480. 원 명세 KPI는 CPU 10 FPS.
    # Docker CPU(8코어, Gazebo 없이) 실측: 640 입력 약 99 ms, 320 입력 약 39 ms (스레드 4).
    # Gazebo와 함께 10 FPS가 안 나오면 낮춘다. 작게 하면 먼 물체 검출 거리가 줄어든다
    image_size: 640
    # torch CPU 스레드 수. 0이면 torch 기본값(컨테이너에서 1개로 잡혀 640 입력 141 ms였다)
    num_threads: 4
    confidence_threshold: 0.5
    iou_threshold: 0.45        # NMS
    # 모델 클래스 → 팀 클래스 (docs/api.md 4-3절). 같은 순서로 짝을 이룬다.
    # COCO에는 화물이 없고 표지판은 stop sign뿐이다. 화물·표지판 학습 모델로 바꾸면 이 두 목록만 바꾼다
    model_classes: ["person", "stop sign"]
    output_classes: ["person", "sign"]

    # bbox 안 대표 깊이 (amr_perception_core depth_sampling)
    roi_scale: 0.5             # bbox 중심 50%만 본다 (가장자리 배경 제외)
    min_depth: 0.3             # m. amr_description sensors.yaml rgbd_camera range_min
    max_depth: 10.0            # m. 원 명세 depth 카메라 최대 거리
    min_valid_ratio: 0.1

    # 3D 측정 공분산 (amr_perception_core projection). 추적 KF의 R로 쓰인다
    pixel_noise_std: 5.0       # px. bbox 중심 오차 가정. GT 비교(NEES)로 다시 정한다
    depth_noise_std: 0.02      # m. sensors.yaml depth_noise stddev

    # 출력 좌표계. 원 명세: map frame. 위치 추정(map → odom) 없이 시험할 때는 odom
    target_frame: map
    tf_timeout: 0.1            # s. 촬영 시각의 TF를 기다리는 시간

    max_rate: 30.0             # Hz. 새 프레임 확인 주기 (카메라 주기). 실제 FPS는 추론 속도가 정한다
    marker_size: 0.4           # m. RViz 상자 마커 한 변
    stats_period: 5.0          # s. FPS·추론 시간·지연 로그 주기 (KPI 측정용)
