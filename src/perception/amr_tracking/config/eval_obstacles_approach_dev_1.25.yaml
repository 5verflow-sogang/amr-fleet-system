# 추적기 개발용 정면 접근 (tracking_kpi_cdev, experiments/tracking_kpi README "재생 벤치"). 판정에는 쓰지 않는다.
# 본 측정 장면 C(10 m 출발, 0.5·1.0·1.5 m/s)와 겹치지 않게 1.25 m/s로 12 m에서 출발한다. 장면 C는 작업자 속력이 고정이라
# 시드로는 새 장면을 만들 수 없어서 따로 둔다.
# - 1.25 m/s: 지금 추적기(σa 1.0)는 1.0 m/s 넘는 반전에서 트랙을 놓친다 → 돌아선 뒤 헛트랙·헛정지가 드러난다
# - 12 m 출발: 사람을 처음 잡는 거리(본 측정 약 6.8~7.1 m)를 늘렸을 때 어디까지 잡는지 본다
# 돌아서는 곳은 장면 C와 같다(waypoint x 1.55, 실제로는 x ≈ 1.70). 길에 구조물 없음 (정답 지도에서 3.2 m 이상).
obstacles:
  - id: worker_approach
    type: worker
    pattern: straight
    speed_range_mps: [1.25, 1.25]
    spawn: {x: 12.0, y: 10.5, yaw: 3.1416}
    waypoints:
      - {x: 12.0, y: 10.5}
      - {x: 1.55, y: 10.5}
    note: "추적기 개발용: 로봇 정면 12 m → 1.55 m 왕복, 1.25 m/s 고정 (판정에 안 씀)"
