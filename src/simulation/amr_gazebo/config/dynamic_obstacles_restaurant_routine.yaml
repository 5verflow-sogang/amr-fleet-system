# 생성 파일: guest_routines_restaurant.yaml 에서 scripts/gen_guest_routines.py로 만들었다 (지도 restaurant_gt.yaml). 손으로 고치지 말고 설정을 고쳐 다시 만든다.
#
# 손님 10명, 모두 pattern routine (amr_gazebo/obstacle_motion.py): steps를 차례로 - path를 따라 걸어 마지막 점에서 wait_s 동안
# 머물고, 마지막 단계 뒤에는 loop_from 단계부터 되풀이한다. 걷는 동안은 로봇·다른 손님 앞에서 서고, 머무는 동안 로봇이 오면
# evade_dirs 쪽으로 비켰다가 돌아온다. 손님 파일(dynamic_obstacles_file)로 띄워 모두 혼잡도에 센다.

