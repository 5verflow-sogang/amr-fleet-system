# 식당 월드 피크 몰림 손님: 평상시 손님 7명(dynamic_obstacles_restaurant.yaml과 같다) + 몰림 6명 = 13명.
# 손님만 담는다 (혼잡도 노드가 전부 "사람"으로 센다). 직원은 dynamic_obstacles_restaurant_staff.yaml로 따로 띄운다.
#
#   C=$(ros2 pkg prefix amr_gazebo)/share/amr_gazebo/config
#   ros2 launch amr_gazebo dynamic_obstacles.launch.py config:=$C/dynamic_obstacles_restaurant_peak.yaml seed:=1
#
# 몰리는 곳 (혼잡 구역 amr_fleet_manager/config/congestion_zones_restaurant.yaml):
#   west_aisle  서쪽 통로(셀프 코너 앞) 3명 → 혼잡도 1.0. 남서쪽에서 배식대로 가는 지름길이 막힌다
#   buffet_line 배식대 앞 3명 + customer_1 → 1.0
# 시나리오 1-1 예: 배식대(buffet_1) 주문이 들어올 때 놀고 있는 로봇이
#   A (-10.5, -5.6, 북쪽)  배식대까지 약 10 m, 서쪽 통로(몰림)를 지난다
#   B 매장 3 앞 (1.5, 4.15) 약 11.4 m, 매장 앞 통로(stall_front, 평상시 수준)를 지난다
#   → 혼잡도를 끄면 가까운 A, 켜면 B가 받는다. 1-2는 A가 가면서 서쪽 통로 대신 x -7.275 통로로 돌아가는지
#   (1-2는 그 우회 통로를 왕복하는 customer_2를 뺀 dynamic_obstacles_restaurant_peak_scene12.yaml을 쓴다)
# 형식·통로 좌표는 dynamic_obstacles_restaurant.yaml 머리말과 같다.

obstacles:
  - id: customer_1
    type: customer
    pattern: straight
    speed_range_mps: [0.4, 0.9]
    spawn: {x: -10.0, y: 3.45, yaw: 0.0}
    waypoints:
      - {x: -10.0, y: 3.45}
      - {x: 5.0, y: 3.45}
    note: "매장 앞 통로를 동서로 왕복 (픽업하는 로봇과 겹치는 혼잡 구간)"

  - id: customer_2
    type: customer
    pattern: straight
    speed_range_mps: [0.4, 0.9]
    spawn: {x: -7.275, y: -5.6, yaw: 1.5707963}
    waypoints:
      - {x: -7.275, y: -5.6}
      - {x: -7.275, y: 3.45}
    note: "세로 통로 x -7.275 남북 왕복 (입구 쪽 → 매장, 화분 칸막이 틈으로 들어간다)"

  - id: customer_3
    type: customer
    pattern: curve
    speed_range_mps: [0.4, 0.9]
    spawn: {x: -1.175, y: -5.6, yaw: 1.5707963}
    waypoints:
      - {x: -1.175, y: -5.6}
      - {x: -1.175, y: -2.5}
      - {x: -1.175, y: 0.0}
      - {x: -0.85, y: 0.5}
      - {x: -0.4, y: 0.55}
      - {x: 4.3, y: 0.55}
      - {x: 4.68, y: 0.8}
      - {x: 4.74, y: 1.3}
      - {x: 4.74, y: 3.45}
    note: "퇴식구 쪽에서 가운데 가로 통로를 거쳐 동쪽 통로로 매장 앞에 (교차로 두 곳, 기둥이 있는 x 1.875 1행은 못 지난다). 모서리는 경유점을 촘촘히 둬 곡선이 테이블 쪽으로 튀지 않게 했다"

  - id: customer_4
    type: customer
    pattern: straight
    speed_range_mps: [0.4, 0.9]
    spawn: {x: -10.5, y: 0.55, yaw: 0.0}
    waypoints:
      - {x: -10.5, y: 0.55}
      - {x: 4.74, y: 0.55}
    note: "가운데 가로 통로 y 0.55 동서 왕복 (셀프 코너 앞 → 동쪽 통로)"

  - id: customer_5
    type: customer
    pattern: straight
    speed_range_mps: [0.5, 1.0]
    spawn: {x: 4.74, y: -5.6, yaw: 1.5707963}
    waypoints:
      - {x: 4.74, y: -5.6}
      - {x: 4.74, y: 3.45}
    note: "동쪽 세로 통로 (4인석과 6인석 사이). 충전소 앞을 지난다"

  - id: customer_6
    type: customer
    pattern: random
    speed_range_mps: [0.4, 0.8]
    spawn: {x: -6.0, y: -5.6, yaw: 0.0}
    waypoints:
      - {x: -8.0, y: -6.1}
      - {x: 3.5, y: -6.1}
      - {x: 3.5, y: -5.55}
      - {x: -8.0, y: -5.55}
    note: "남쪽 통로(화분 칸막이 y -5.25 ~ 퇴식구)에서 무작위. 위 4점은 활동 범위"

  - id: customer_7
    type: customer
    pattern: straight
    speed_range_mps: [0.4, 0.9]
    spawn: {x: -7.275, y: -2.45, yaw: 0.0}
    waypoints:
      - {x: -7.275, y: -2.45}
      - {x: 1.875, y: -2.45}
    note: "아래 가로 통로 y -2.45 동서 왕복"

  # ---- 피크 몰림 (시나리오 1-1·1-2): 서쪽 통로와 배식대 앞에 손님이 몰린다 ----
  # 서쪽 통로(셀프 코너 앞, zone west_aisle, capacity 3): 남북 두 줄 + 남쪽 끝 무작위
  - id: peak_1
    type: customer
    pattern: straight
    speed_range_mps: [0.4, 0.8]
    spawn: {x: -10.45, y: -4.6, yaw: 1.5707963}
    waypoints:
      - {x: -10.45, y: -4.6}
      - {x: -10.45, y: 2.6}
    note: "서쪽 통로 남→북 (셀프 코너 앞 서 있는 손님 x -11.0 옆을 지난다)"

  - id: peak_2
    type: customer
    pattern: straight
    speed_range_mps: [0.4, 0.8]
    spawn: {x: -10.0, y: 2.6, yaw: -1.5707963}
    waypoints:
      - {x: -10.0, y: 2.6}
      - {x: -10.0, y: -4.6}
    note: "서쪽 통로 북→남 (첫 열 의자 등받이 x -9.68과 0.07 m)"

  - id: peak_3
    type: customer
    pattern: random
    speed_range_mps: [0.4, 0.8]
    spawn: {x: -11.0, y: -3.5, yaw: 0.0}
    waypoints:
      - {x: -11.6, y: -3.65}
      - {x: -10.7, y: -3.65}
      - {x: -10.7, y: -2.5}
      - {x: -11.6, y: -2.5}
    note: "서쪽 통로 남쪽 끝 (셀프 코너 남쪽 빈 곳)에서 무작위"

  # 배식대 앞 (zone buffet_line, capacity 4): 배식대 정차 로봇(buffet_1·2, 남쪽 끝 y 3.87) 바로 앞에서 무작위.
  # 평상시 customer_1(y 3.45)까지 4명이면 혼잡도 1.0
  - id: peak_4
    type: customer
    pattern: random
    speed_range_mps: [0.3, 0.7]
    spawn: {x: -10.5, y: 3.3, yaw: 0.0}
    waypoints:
      - {x: -11.3, y: 3.15}
      - {x: -6.7, y: 3.15}
      - {x: -6.7, y: 3.6}
      - {x: -11.3, y: 3.6}
    note: "배식대 앞 무작위"

  - id: peak_5
    type: customer
    pattern: random
    speed_range_mps: [0.3, 0.7]
    spawn: {x: -8.0, y: 3.3, yaw: 3.1415927}
    waypoints:
      - {x: -11.3, y: 3.15}
      - {x: -6.7, y: 3.15}
      - {x: -6.7, y: 3.6}
      - {x: -11.3, y: 3.6}
    note: "배식대 앞 무작위"

  - id: peak_6
    type: customer
    pattern: random
    speed_range_mps: [0.3, 0.7]
    spawn: {x: -7.0, y: 3.2, yaw: 3.1415927}
    waypoints:
      - {x: -11.3, y: 3.15}
      - {x: -6.7, y: 3.15}
      - {x: -6.7, y: 3.6}
      - {x: -11.3, y: 3.6}
    note: "배식대 앞 무작위"
