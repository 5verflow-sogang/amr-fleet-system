# 식당 시나리오 1-2 분할 영상용 손님: dynamic_obstacles_restaurant_peak_scene12.yaml(1-2)에서 서쪽 통로 손님 셋과
# customer_4만 바꿨다.
# 1-2는 처음부터 서쪽 통로가 막혀 있어 1호가 출발 전에 우회 경로를 잡는다. 분할 영상은 "관제는 혼잡을 알리고, 로봇은
# 스스로 길을 바꾼다"를 보여야 해서, 1호가 서쪽 통로로 출발한 뒤 손님이 그 통로에 몰리게 한다:
# - peak_1~3: 0초(/demo/t0, 장면 스크립트가 1호에게 배달을 요청한 시각) 전에는 배식대 서쪽(y 4.1, 서쪽 통로 구역 밖)에 서
#   있다가 0초 + start_after_t0_s(1 s)부터 서쪽 통로로 내려온다 (amr_gazebo dynamic_obstacles_node). 손님은 스택과 같이
#   움직이기 시작해 0초와의 간격이 실행마다 달라 자리만으로는 시점을 못 맞춘다
# - customer_4: 서쪽 끝을 서쪽 통로 구역 밖(x -9.4)으로 - 0초 전 서쪽 통로 혼잡도 0 (첫 경로가 서쪽 통로로 잡힌다)
# 1호(robots_restaurant_s12_split.yaml, (-10.2, -7.0) 북쪽을 봄)는 구역 남쪽 끝(y -5.0)까지 2 m라, 혼잡도가 오르는 동안
# 서쪽 통로 쪽으로 1 m 남짓 간다. 1초 재계획 BT(식당 프로필)가 keepout 마스크를 보고 x -7.275 우회 통로로 바꾼다.
# 나머지 손님·좌표·형식은 1-2 파일과 같다. 1-2 파일을 고치면 이 파일도 같이 고친다.
#
#   C=$(ros2 pkg prefix amr_gazebo)/share/amr_gazebo/config
#   ros2 launch amr_gazebo dynamic_obstacles.launch.py config:=$C/dynamic_obstacles_restaurant_peak_scene12_split.yaml seed:=1
obstacles:
  - id: customer_1
    type: customer
    pattern: straight
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.4, 0.9]
    spawn: {x: -10.0, y: 3.45, yaw: 0.0}
    waypoints:
      - {x: -10.0, y: 3.45}
      - {x: 5.0, y: 3.45}
    note: "매장 앞 통로를 동서로 왕복 (픽업하는 로봇과 겹치는 혼잡 구간)"

  - id: customer_3
    type: customer
    pattern: curve
    speed_range_mps: [0.4, 0.9]
    spawn: {x: -1.175, y: -5.6, yaw: 1.5707963}
    waypoints:
      - {x: -1.175, y: -5.6}
      - {x: -1.175, y: -2.5}
      - {x: -1.175, y: 0.0}
      - {x: -0.85, y: 0.5}
      - {x: -0.4, y: 0.55}
      - {x: 4.3, y: 0.55}
      - {x: 4.68, y: 0.8}
      - {x: 4.74, y: 1.3}
      - {x: 4.74, y: 3.45}
    note: "퇴식구 쪽에서 가운데 가로 통로를 거쳐 동쪽 통로로 매장 앞에 (교차로 두 곳, 기둥이 있는 x 1.875 1행은 못 지난다). 모서리는 경유점을 촘촘히 둬 곡선이 테이블 쪽으로 튀지 않게 했다"

  - id: customer_4
    type: customer
    pattern: straight
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.4, 0.9]
    spawn: {x: -9.4, y: 0.55, yaw: 0.0}
    waypoints:
      - {x: -9.4, y: 0.55}
      - {x: 4.74, y: 0.55}
    note: "가운데 가로 통로 y 0.55 동서 왕복. 1-2 분할: 서쪽 끝을 서쪽 통로 구역(x -9.73) 밖 -9.4로 (0초 전 혼잡도 0)"

  - id: customer_5
    type: customer
    pattern: straight
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.5, 1.0]
    spawn: {x: 4.74, y: -5.6, yaw: 1.5707963}
    waypoints:
      - {x: 4.74, y: -5.6}
      - {x: 4.74, y: 3.45}
    note: "동쪽 세로 통로 (4인석과 6인석 사이). 충전소 앞을 지난다"

  - id: customer_6
    type: customer
    pattern: random
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.4, 0.8]
    spawn: {x: -6.0, y: -5.6, yaw: 0.0}
    waypoints:
      - {x: -8.0, y: -6.1}
      - {x: 3.5, y: -6.1}
      - {x: 3.5, y: -5.55}
      - {x: -8.0, y: -5.55}
    note: "남쪽 통로(화분 칸막이 y -5.25 ~ 퇴식구)에서 무작위. 위 4점은 활동 범위"

  - id: customer_7
    type: customer
    pattern: straight
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.4, 0.9]
    spawn: {x: -7.275, y: -2.45, yaw: 0.0}
    waypoints:
      - {x: -7.275, y: -2.45}
      - {x: 1.875, y: -2.45}
    note: "아래 가로 통로 y -2.45 동서 왕복"

  # ---- 서쪽 통로 몰림 (1-2 분할): 0초 전에는 배식대 서쪽(서쪽 통로 구역 밖, y 4.1)에 서 있다가 /demo/t0 + start_after_t0_s에
  # 서쪽 통로(zone west_aisle, capacity 3)로 내려온다. 셋 다 들어오면 혼잡도 1.0 (약 1~3 s, 혼잡도 노드 2 Hz·alpha 0.5)
  - id: peak_1
    type: customer
    pattern: straight
    start_after_t0_s: 1.0
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.5, 0.8]
    spawn: {x: -10.4, y: 4.1, yaw: -1.5707963}
    waypoints:
      - {x: -10.45, y: 2.6}
      - {x: -10.45, y: -2.5}
    note: "배식대 서쪽에서 기다리다 서쪽 통로를 남쪽으로 (0초 뒤 1 s)"

  - id: peak_2
    type: customer
    pattern: straight
    start_after_t0_s: 1.0
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.5, 0.8]
    spawn: {x: -11.0, y: 4.1, yaw: -1.5707963}
    waypoints:
      - {x: -11.0, y: 2.6}
      - {x: -11.0, y: -2.0}
    note: "배식대 서쪽에서 기다리다 서쪽 통로를 남쪽으로 (0초 뒤 1 s)"

  - id: peak_3
    type: customer
    pattern: random
    start_after_t0_s: 1.0
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.5, 0.8]
    spawn: {x: -11.5, y: 4.1, yaw: -1.5707963}
    waypoints:
      - {x: -11.5, y: 0.8}
      - {x: -10.7, y: 0.8}
      - {x: -10.7, y: 2.4}
      - {x: -11.5, y: 2.4}
    note: "배식대 서쪽에서 기다리다 서쪽 통로 북쪽(셀프 코너 북쪽 빈 곳)에서 무작위 (0초 뒤 1 s)"

  # 배식대 앞 (zone buffet_line, capacity 4): 배식대 정차 로봇(buffet_1·2, 남쪽 끝 y 3.87) 바로 앞에서 무작위.
  # 평상시 customer_1(y 3.45)까지 4명이면 혼잡도 1.0
  - id: peak_4
    type: customer
    pattern: random
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.3, 0.7]
    spawn: {x: -10.5, y: 3.3, yaw: 0.0}
    waypoints:
      - {x: -11.3, y: 3.15}
      - {x: -6.7, y: 3.15}
      - {x: -6.7, y: 3.6}
      - {x: -11.3, y: 3.6}
    note: "배식대 앞 무작위"

  - id: peak_5
    type: customer
    pattern: random
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.3, 0.7]
    spawn: {x: -8.0, y: 3.3, yaw: 3.1415927}
    waypoints:
      - {x: -11.3, y: 3.15}
      - {x: -6.7, y: 3.15}
      - {x: -6.7, y: 3.6}
      - {x: -11.3, y: 3.6}
    note: "배식대 앞 무작위"

  - id: peak_6
    type: customer
    pattern: random
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.3, 0.7]
    spawn: {x: -7.0, y: 3.2, yaw: 3.1415927}
    waypoints:
      - {x: -11.3, y: 3.15}
      - {x: -6.7, y: 3.15}
      - {x: -6.7, y: 3.6}
      - {x: -11.3, y: 3.6}
    note: "배식대 앞 무작위"
