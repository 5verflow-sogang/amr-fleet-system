# 자동 생성 (amr_gazebo/tools/make_restaurant_wide.py) - 손으로 고치지 않는다. 넓은 식당 월드 restaurant_wide.sdf용.
# 원래 식당 좌표를 90° 돌린 서쪽 홀 + 거울 복사본(이름 끝 _e) 동쪽 홀. 원래 설명의 방위는 돌기 전 기준이다
# 평상시 손님 24명: 양쪽 홀에 12명씩 고르게 (dynamic_obstacles_restaurant.yaml + 카운터 앞 서성이는 손님
# counter_N, 동쪽 복사 _e). 손님만 담는다 (혼잡도 노드가 전부 사람으로 센다). 주방 직원은 월드의 정지 모델 staff_N
obstacles:
  - id: customer_1
    type: customer
    pattern: straight
    speed_range_mps: [0.4, 0.9]
    spawn: {x: -3.45, y: -10, yaw: 1.5707963}
    waypoints:
      - {x: -3.45, y: -10}
      - {x: -3.45, y: 5}
    note: 매장 앞 통로를 동서로 왕복 (픽업하는 로봇과 겹치는 혼잡 구간)
  - id: customer_2
    type: customer
    pattern: straight
    speed_range_mps: [0.4, 0.9]
    spawn: {x: 5.6, y: -7.275, yaw: 3.1415926}
    waypoints:
      - {x: 5.6, y: -7.275}
      - {x: -3.45, y: -7.275}
    note: "세로 통로 x -7.275 남북 왕복 (입구 쪽 → 매장, 화분 칸막이 틈으로 들어간다)"
  - id: customer_3
    type: customer
    pattern: curve
    speed_range_mps: [0.4, 0.9]
    spawn: {x: 5.6, y: -1.175, yaw: 3.1415926}
