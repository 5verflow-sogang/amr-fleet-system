# 식당 월드 직원 5명 (매장 주방 4곳 + 배식대 뒤). 손님이 아니라 혼잡도에 세지 않으려고 손님 파일과 나눴다.
#
#   ros2 launch amr_gazebo dynamic_obstacles.launch.py \
#       config:=$(ros2 pkg prefix amr_gazebo)/share/amr_gazebo/config/dynamic_obstacles_restaurant_staff.yaml name:=staff_obstacles
#
# name을 바꾸는 것은 손님 파일과 같이 띄울 때 이동 노드·브리지 이름이 겹치지 않게 하려는 것이다.
# 모두 칸막이 안쪽(y 5.4 이상)이라 로봇과는 만나지 않는다. 모델은 손님과 같은 customer 타입.

obstacles:
  # 매장 직원: 칸막이 안쪽 주방(y 5.4~7.3)과 배식대 뒤에서 조리대 앞을 왕복한다. 로봇과는 만나지 않고, 카운터 너머로 LiDAR·카메라에 보인다
  - id: staff_1
    type: customer
    pattern: straight
    speed_range_mps: [0.3, 0.7]
    spawn: {x: -5.4, y: 6.3, yaw: 0.0}
    waypoints:
      - {x: -5.4, y: 6.3}
      - {x: -3.6, y: 6.3}
    note: "한식 매장 주방"

  - id: staff_2
    type: customer
    pattern: straight
    speed_range_mps: [0.3, 0.7]
    spawn: {x: -2.4, y: 6.3, yaw: 0.0}
    waypoints:
      - {x: -2.4, y: 6.3}
      - {x: -0.6, y: 6.3}
    note: "분식 매장 주방"

  - id: staff_3
    type: customer
    pattern: straight
    speed_range_mps: [0.3, 0.7]
    spawn: {x: 0.6, y: 6.3, yaw: 0.0}
    waypoints:
      - {x: 0.6, y: 6.3}
      - {x: 2.4, y: 6.3}
    note: "양식 매장 주방"

  - id: staff_4
    type: customer
    pattern: straight
    speed_range_mps: [0.3, 0.7]
    spawn: {x: 3.6, y: 6.3, yaw: 0.0}
    waypoints:
      - {x: 3.6, y: 6.3}
      - {x: 5.4, y: 6.3}
    note: "카페 매장 주방"

  - id: staff_5
    type: customer
    pattern: straight
    speed_range_mps: [0.3, 0.7]
    spawn: {x: -10.6, y: 6.4, yaw: 0.0}
    waypoints:
      - {x: -10.6, y: 6.4}
      - {x: -7.4, y: 6.4}
    note: "배식대 뒤 (배식대와 조리대 사이)"
