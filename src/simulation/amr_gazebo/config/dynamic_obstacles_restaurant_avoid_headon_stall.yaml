# 식당 정면 마주침 장면, 매장 앞 통로 (하네스 nav_avoidance_restaurant scene=headon_stall). 홀 통로(폭 1.8 m)에서 같은 꼴로
# 시험했을 때는 1호가 비킬 자리가 모자라 몸 사이 0.20 m로 지나갔다 (11/20 3회차).
# 매장 앞 통로는 1행 테이블 북쪽 끝(y 2.3)부터 매장 카운터 앞까지 2.3 m 넘는다.
#
# - 1호: (4.6, 3.45)에서 서쪽으로 통로 가운데를 따라 t02 (-5.75, 2.73)로 음식을 나른다 (robots_restaurant_avoid_stall.yaml)
# - 손님: 1번 매장(한식) 앞 (-3.6, 4.1)에서 음식을 받아 들고 동쪽 (3.6, 4.1)로 0.7 m/s로 한 번 걷는다. 몸이 y 3.85~4.35라
#   카운터 앞(지도 y 4.6)과 약 0.25 m (카운터를 따라 걷는다). 1호가 통로 가운데(y 3.45, 몸 3.18~3.72)로 오면 0.13 m라 남쪽으로 비켜야
#   한다. 11/20 4회차(손님 y 3.95)에서 1호는 지나칠 때 0.3 m 비켜 몸 사이 0.23 m였다. 같은 만큼 비키면 약 0.38 m
# - 손님은 움직이는 1호를 피하지 않는다 (비켜 가는 것은 로봇). 멈춘 1호가 앞길을 막으면 그 앞에서 선다 (yield_to_robots)
# - 출발 신호: 1호 중심이 손님 처음 자리에서 7.0 m 안에 들어올 때 (1호가 약 1.2 m 와서). 다가오는 속도 약 1.5 m/s라
#   약 4 s 뒤 x 0 근처에서 만난다
obstacles:
  - id: customer_headon
    type: customer
    pattern: straight
    speed_range_mps: [0.7, 0.7]
    spawn: {x: -3.6, y: 4.1, yaw: 0.0}
    waypoints:
      - {x: -3.6, y: 4.1}
      - {x: 3.6, y: 4.1}
    once: true
    start_trigger: {robot: amr_01, x: -3.6, y: 4.1, within_m: 7.0}
    yield_to_robots: [amr_01]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    note: "매장 앞 통로 북쪽 편을 따라 동쪽으로 한 번 걷는다 (1호와 마주침)"
