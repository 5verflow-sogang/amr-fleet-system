  - id: table_guest
    type: customer
    pattern: straight
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.5, 0.8]
    spawn: {x: 5.0, y: -3.75, yaw: -1.5707963}
    waypoints:
      - {x: 5.0, y: -3.75}
