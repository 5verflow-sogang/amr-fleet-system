# 자동 생성 (amr_gazebo/tools/make_restaurant_wide.py) - 손으로 고치지 않는다. 넓은 식당 월드 restaurant_wide.sdf용.
# 원래 식당 좌표를 90° 돌린 서쪽 홀 + 거울 복사본(이름 끝 _e) 동쪽 홀. 원래 설명의 방위는 돌기 전 기준이다
# 피크 손님 26명: 서쪽 홀에 18명 몰리고 (dynamic_obstacles_restaurant_peak.yaml 그대로 - 셀프 코너 앞 통로·배식대 앞 몰림
# + 카운터 앞 5명) 동쪽 홀은 8명 (customer_1, customer_4, customer_6 복사 + 카운터 앞). 같은 메뉴를 붐비는
# 서쪽(stall_1)과 한산한 동쪽(stall_1_e) 중 고르는 장면이 생긴다 (혼잡도 반영 할당)
obstacles:
  - id: customer_1
    type: customer
    pattern: straight
    speed_range_mps: [0.4, 0.9]
    spawn: {x: -3.45, y: -10, yaw: 1.5707963}
    waypoints:
      - {x: -3.45, y: -10}
      - {x: -3.45, y: 5}
    note: 매장 앞 통로를 동서로 왕복 (픽업하는 로봇과 겹치는 혼잡 구간)
  - id: customer_2
