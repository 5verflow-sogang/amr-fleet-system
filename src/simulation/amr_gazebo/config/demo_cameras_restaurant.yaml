# 식당 시연 녹화용 고정 카메라 (demo_cameras.launch.py). 토픽 /demo_cam/<이름>/image (sensor_msgs/Image, rgb8)
# pose [x, y, z, roll, pitch, yaw] (m, rad, world = map). 카메라는 +x를 본다: pitch +는 아래, yaw는 바라보는 방향.
# 위치·각도는 연우가 장면에 맞춰 고친다. 여기 값은 렌더링·RTF 확인용 시작값이다.
defaults:
  width: 1280
  height: 720
  fov_deg: 90
  rate: 15        # Hz, 시뮬레이션 시간 (영상 15 fps)

cameras:
  # 탑뷰: 홀 중앙 15 m 위에서 내려다본다. 화면 위 = 북쪽, 오른쪽 = 동쪽. 90°면 가로 30 m·세로 약 17 m (식당 25 x 17 m)
  top:
    pose: [0.0, 0.0, 15.0, 0.0, 1.5708, 1.5708]
  # 서쪽 통로 눈높이: 남쪽 끝(입구 옆)에서 북쪽(배식대)을 본다 (1-1·1-2)
  west:
    pose: [-10.0, -7.8, 1.6, 0.0, 0.15, 1.5708]
    fov_deg: 70
  # 매장 앞 통로 눈높이: 동쪽에서 서쪽(배식대 방향)을 본다 (1-1 3호 경로)
  stalls:
    pose: [7.0, 3.4, 1.6, 0.0, 0.15, 3.1416]
    fov_deg: 70
  # 발표 자료용 정지 사진 (11/13). 실내 x -12~12, y -8~8, 벽 높이 3.2 m. 기둥 (±, 1.7)·(±, -4.3)이 화면을 가리지 않게 잡았다
  # 천장 모서리(CCTV): 남서쪽 입구 위 3.0 m에서 홀 전체를 비스듬히 내려다본다
  cctv:
    pose: [-11.7, -7.7, 3.0, 0.0, 0.33, 0.64]
  # 로봇 대기 구역: 동쪽 벽 wait_1~5 (x 11.2) 한 줄을 북서쪽에서 본다
  wait:
    pose: [9.3, -1.2, 1.9, 0.0, 0.32, -1.06]
    fov_deg: 75
  # 충전 구역: 남쪽 벽 charger_c1~c3 (x 5~8) 를 북쪽에서 본다
  charger:
    pose: [6.5, -4.3, 1.9, 0.0, 0.43, -1.5708]
    fov_deg: 70
  # 매장 정면: 기둥 p1·p2 사이(x -1.175)에서 북쪽 매장 카운터 1~4와 간판을 본다
  stalls_front:
    pose: [-1.175, -0.5, 2.0, 0.0, 0.15, 1.5708]
  # 동쪽 좌석: 6인 테이블·부스·2인 원형 테이블을 남서쪽에서 본다
  seats_east:
    pose: [4.3, -4.6, 2.2, 0.0, 0.21, 0.865]
    fov_deg: 80
