# 식당 시연 녹화용 고정 카메라 (demo_cameras.launch.py). 토픽 /demo_cam/<이름>/image (sensor_msgs/Image, rgb8)
# pose [x, y, z, roll, pitch, yaw] (m, rad, world = map). 카메라는 +x를 본다: pitch +는 아래, yaw는 바라보는 방향.
# 위치·각도는 연우가 장면에 맞춰 고친다. 여기 값은 렌더링·RTF 확인용 시작값이다.
defaults:
  width: 1280
  height: 720
  fov_deg: 90
  rate: 15        # Hz, 시뮬레이션 시간 (영상 15 fps)

cameras:
  # 탑뷰: 홀 중앙 15 m 위에서 내려다본다. 화면 위 = 북쪽, 오른쪽 = 동쪽. 90°면 가로 30 m·세로 약 17 m (식당 25 x 17 m)
  top:
    pose: [0.0, 0.0, 15.0, 0.0, 1.5708, 1.5708]
  # 홀 서쪽 탑뷰 (1-1): 12 m 위, 로봇 높이(1 m)에서 가로 22 m·세로 약 12.4 m (x -15~7, y -6.8~5.6).
  # 1호 출발 자리(입구 옆), 서쪽 통로, 배식대, 3번 매장 앞이 한 화면에 들어오고 로봇이 top보다 약 1.27배 크게 보인다
  top_west:
    pose: [-4.0, -0.6, 12.0, 0.0, 1.5708, 1.5708]
  # 서쪽 통로 눈높이: 남쪽 끝(입구 옆)에서 북쪽(배식대)을 본다 (1-1·1-2)
  west:
    pose: [-10.0, -7.8, 1.6, 0.0, 0.15, 1.5708]
    fov_deg: 70
  # 매장 앞 통로 눈높이: 동쪽에서 서쪽(배식대 방향)을 본다 (1-1 3호 경로)
  stalls:
    pose: [7.0, 3.4, 1.6, 0.0, 0.15, 3.1416]
    fov_deg: 70
