# 머물고, 마지막 단계 뒤에는 loop_from 단계부터 되풀이한다. 걷는 동안은 로봇·다른 손님 앞에서 서고, 머무는 동안 로봇이 오면
# evade_dirs 쪽으로 비켰다가 돌아온다. 손님 파일(dynamic_obstacles_file)로 띄워 모두 혼잡도에 센다.

