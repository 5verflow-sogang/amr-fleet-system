# 식당(푸드코트) 월드 동적 장애물 - 평상시 손님 6명, 홀 서쪽 반(hall_west)에만 몰려 있다 (worlds/restaurant.sdf)
# 손님만 담는다: 혼잡도 노드(amr_fleet_manager congestion, #296)가 이 파일의 장애물을 전부 "사람"으로 센다.
# 직원은 dynamic_obstacles_restaurant_staff.yaml, 피크 몰림은 dynamic_obstacles_restaurant_peak.yaml
#
#   C=$(ros2 pkg prefix amr_gazebo)/share/amr_gazebo/config
#   ros2 launch amr_gazebo dynamic_obstacles.launch.py config:=$C/dynamic_obstacles_restaurant.yaml        # 평상시 손님 (또는 _peak.yaml)
#   ros2 launch amr_gazebo dynamic_obstacles.launch.py config:=$C/dynamic_obstacles_restaurant_staff.yaml name:=staff_obstacles   # 직원
#
# 11/8: 7명 → 6명, 혼잡도 구역 hall_west(amr_fleet_manager config/congestion_zones_restaurant.yaml, x -9.72~-1.2,
# y -5.0~2.99, capacity 6)에만 둔다. 모든 경로가 구역 안쪽이라 hall_west는 늘 6명(혼잡도 1.0), 나머지 구역은 0명이다.
# 홀 동쪽(t04·t05·t09·t10·t14·t15)·매장 앞·라운지는 비어 대비가 분명하다. 로봇은 혼잡도 배정(cost_fn:=congestion)·
# 혼잡도 필터로 서쪽 홀을 피하고, 가까이 가면 손님이 선다 (system.launch.py guest_keep_away_m).
# 통로 가운데: 세로 x -7.275(전 구간), -4.225(2행만, 1·3행에 기둥), 가로 y 0.55, -2.45 (테이블 정차 자리를 비켜 옮김).
# 가로 통로는 세로 통로 x -7.275 양옆에서 끊어 손님 둘이 같은 줄을 오가지 않게 했다 (서로 부딪히지 않게).
# 멈춘 로봇에 걸어 들어가지 않는 규칙(yield_to_robots, #263)도 그대로 둔다. 혼잡한 홀이라 걸음은 0.4~0.8 m/s.

obstacles:
  - id: customer_1
    type: customer
    pattern: straight
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.4, 0.8]
    spawn: {x: -9.5, y: 0.55, yaw: 0.0}
    waypoints:
      - {x: -9.5, y: 0.55}
      - {x: -7.75, y: 0.55}
    note: "가로 통로 y 0.55 서쪽 (t01·t06 사이)"

  - id: customer_2
    type: customer
    pattern: straight
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.4, 0.8]
    spawn: {x: -6.8, y: 0.55, yaw: 0.0}
    waypoints:
      - {x: -6.8, y: 0.55}
      - {x: -1.6, y: 0.55}
    note: "가로 통로 y 0.55 동쪽 (t02·t03·t07·t08 사이)"

  - id: customer_3
    type: customer
    pattern: straight
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.4, 0.8]
    spawn: {x: -9.5, y: -2.45, yaw: 0.0}
    waypoints:
      - {x: -9.5, y: -2.45}
      - {x: -7.75, y: -2.45}
    note: "가로 통로 y -2.45 서쪽 (t06·t11 사이)"

  - id: customer_4
    type: customer
    pattern: straight
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.4, 0.8]
    spawn: {x: -6.8, y: -2.45, yaw: 0.0}
    waypoints:
      - {x: -6.8, y: -2.45}
      - {x: -1.6, y: -2.45}
    note: "가로 통로 y -2.45 동쪽 (t07·t08·t12·t13 사이)"

  - id: customer_5
    type: customer
    pattern: straight
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.4, 0.8]
    spawn: {x: -7.275, y: -4.6, yaw: 1.5707963}
    waypoints:
      - {x: -7.275, y: -4.6}
      - {x: -7.275, y: 2.6}
    note: "세로 통로 x -7.275 남북 (가로 통로 끊긴 틈을 지난다)"

  - id: customer_6
    type: customer
    pattern: straight
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
