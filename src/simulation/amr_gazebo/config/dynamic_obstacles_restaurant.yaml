# 식당(푸드코트) 월드 동적 장애물 - 평상시 손님 7명 (worlds/restaurant.sdf, 프로토타입)
# 손님만 담는다: 혼잡도 노드(amr_fleet_manager congestion, #296)가 이 파일의 장애물을 전부 "사람"으로 센다.
# 직원은 dynamic_obstacles_restaurant_staff.yaml, 피크 몰림은 dynamic_obstacles_restaurant_peak.yaml
#
#   C=$(ros2 pkg prefix amr_gazebo)/share/amr_gazebo/config
#   ros2 launch amr_gazebo dynamic_obstacles.launch.py config:=$C/dynamic_obstacles_restaurant.yaml        # 평상시 손님 (또는 _peak.yaml)
#   ros2 launch amr_gazebo dynamic_obstacles.launch.py config:=$C/dynamic_obstacles_restaurant_staff.yaml name:=staff_obstacles   # 직원
#
# 형식·이동 패턴은 dynamic_obstacles.yaml(물류센터)과 같다. 서 있는 손님·앉은 손님은 정지 모델로 월드에 있다.
# 경로는 통로 가운데만 지난다 (restaurant.sdf 머리말 배치도). 통로 가운데 좌표:
#   세로 통로 x -10.5(셀프 코너 앞), -7.275, -4.225(2행만), -1.175, 1.875(2행만), 4.74(4인석-6인석 사이)
#   x -4.225·1.875는 1·3행에 기둥이 있다. 남쪽 통로에서 홀로는 화분 칸막이 틈(x -10.5, -7.275, -1.175, 4.74)으로만 들어간다
#   가로 통로 y 3.45(매장 앞), 0.55, -2.45, -5.8(남쪽, 화분 칸막이 아래)
# 가로 통로는 테이블 정차 자리(stations_restaurant.yaml t01~t15)를 비켜 조금 옮겼다. 매장 앞 통로(y 3.45)만은 폭이 좁아
# 픽업·테이블 정차 로봇과 겹칠 수 있다 (혼잡 구간). 손님은 움직이는 로봇을 피하지 않고 경로만 따른다.
# 다만 멈춘 서빙 로봇에는 걸어 들어가지 않는다 (yield_to_robots, #263 작업자와 같은 규칙: 앞 0.5 m 안에서 서고 5 s 넘게
# 막히면 돌아선다). 손님 몸이 로봇을 밀어 테이블 쪽으로 붙이던 것을 막는다(식당 리허설). curve(customer_3)는 이 규칙을
# 쓸 수 없어 그대로다
# 로봇이 0.1 m도 못 움직인 채 3 s가 지나면 손님이 돌아서 다시 걷는다(yield_progress_m·yield_patience_s). 제자리에서 도는 로봇은
# 속력으로는 멈춘 것과 움직이는 것을 오가 손님과 로봇이 서로 기다렸다(식당 리허설)
# random은 경유점이 이루는 사각 영역 안을 직선으로 다니므로 테이블이 없는 남쪽 빈 곳에만 쓴다.
# 사람 걸음 0.4~1.0 m/s (식당 안이라 물류센터 작업자보다 조금 넓게).

obstacles:
  - id: customer_1
    type: customer
    pattern: straight
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.4, 0.9]
    spawn: {x: -10.0, y: 3.45, yaw: 0.0}
    waypoints:
      - {x: -10.0, y: 3.45}
      - {x: 5.0, y: 3.45}
    note: "매장 앞 통로를 동서로 왕복 (픽업하는 로봇과 겹치는 혼잡 구간)"

  - id: customer_2
    type: customer
    pattern: straight
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.4, 0.9]
    spawn: {x: -7.275, y: -5.6, yaw: 1.5707963}
    waypoints:
      - {x: -7.275, y: -5.6}
      - {x: -7.275, y: 3.45}
    note: "세로 통로 x -7.275 남북 왕복 (입구 쪽 → 매장, 화분 칸막이 틈으로 들어간다)"

  - id: customer_3
    type: customer
    pattern: curve
    speed_range_mps: [0.4, 0.9]
    spawn: {x: -1.175, y: -5.6, yaw: 1.5707963}
    waypoints:
      - {x: -1.175, y: -5.6}
      - {x: -1.175, y: -2.5}
      - {x: -1.175, y: 0.0}
      - {x: -0.85, y: 0.5}
      - {x: -0.4, y: 0.55}
      - {x: 4.3, y: 0.55}
      - {x: 4.68, y: 0.8}
      - {x: 4.74, y: 1.3}
      - {x: 4.74, y: 3.45}
    note: "퇴식구 쪽에서 가운데 가로 통로를 거쳐 동쪽 통로로 매장 앞에 (교차로 두 곳, 기둥이 있는 x 1.875 1행은 못 지난다). 모서리는 경유점을 촘촘히 둬 곡선이 테이블 쪽으로 튀지 않게 했다"

  - id: customer_4
    type: customer
    pattern: straight
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.4, 0.9]
    spawn: {x: -10.5, y: 0.55, yaw: 0.0}
    waypoints:
      - {x: -10.5, y: 0.55}
      - {x: 4.74, y: 0.55}
    note: "가운데 가로 통로 y 0.55 동서 왕복 (셀프 코너 앞 → 동쪽 통로)"

  - id: customer_5
    type: customer
    pattern: straight
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.5, 1.0]
    spawn: {x: 4.74, y: -5.6, yaw: 1.5707963}
    waypoints:
      - {x: 4.74, y: -5.6}
      - {x: 4.74, y: 3.45}
    note: "동쪽 세로 통로 (4인석과 6인석 사이). 충전소 앞을 지난다"

  - id: customer_6
    type: customer
    pattern: random
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.4, 0.8]
    spawn: {x: -6.0, y: -5.6, yaw: 0.0}
    waypoints:
      - {x: -8.0, y: -6.1}
      - {x: 3.5, y: -6.1}
      - {x: 3.5, y: -5.55}
      - {x: -8.0, y: -5.55}
    note: "남쪽 통로(화분 칸막이 y -5.25 ~ 퇴식구)에서 무작위. 위 4점은 활동 범위"

  - id: customer_7
    type: customer
    pattern: straight
    yield_to_robots: [amr_01, amr_02, amr_03, amr_04, amr_05]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    speed_range_mps: [0.4, 0.9]
    spawn: {x: -7.275, y: -2.45, yaw: 0.0}
    waypoints:
      - {x: -7.275, y: -2.45}
      - {x: 1.875, y: -2.45}
    note: "아래 가로 통로 y -2.45 동서 왕복"
