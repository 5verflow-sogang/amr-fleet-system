    spawn: {x: -4.225, y: -1.95, yaw: 1.5707963}
    waypoints:
      - {x: -4.225, y: -1.95}
      - {x: -4.225, y: 0.05}
    note: "세로 통로 x -4.225 2행 (두 가로 통로 사이)"
