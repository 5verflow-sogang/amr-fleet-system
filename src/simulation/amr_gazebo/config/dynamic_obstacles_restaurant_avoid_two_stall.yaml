# 식당 두 사람 장면, 매장 앞 통로 (하네스 nav_avoidance_restaurant scene=two_stall). 정면 마주침 + 가로지르기를 한 번에.
# 1호는 (4.6, 3.45)에서 서쪽 t02로 간다 (robots_restaurant_avoid_stall.yaml).
#
# - 손님 A(customer_headon): 2번 매장 동쪽 (-0.4, 4.1)에서 음식을 받아 카운터를 따라 동쪽 (4.3, 4.1)로 0.7 m/s로 한 번 걷는다.
#   1호가 A 처음 자리에서 4.6 m 안에 오면 출발한다 (1호가 약 0.5 m 움직인 뒤: 1호가 서 있을 때 걷기 시작하면 먼저 닿는다).
#   1호는 매장 앞 정면 마주침(headon_stall)처럼 멈칫한 뒤 남쪽으로 비켜 지나칠 것으로 본다 (x 약 2.3에서)
# - 손님 B(customer_cross2): 2번 매장(분식) 카운터 앞 (-1.175, 4.3)에서 주문하고 서 있다가, 1호가 만나는 점 (-1.175, 3.3)에서
#   2.0 m 안에 들어오면(A를 지나친 뒤) 돌아서 남쪽 자리(t03·t04 사이 의자 옆 (-1.175, 1.6))로 0.8 m/s로 한 번 걷는다.
#   B가 1호 길을 건너 서는 자리는 1호 길(y 약 3.1~3.45)에서 1.3 m 넘게 떨어진 테이블 사이라, 1호가 B를 기다린 뒤 다시 간다.
#   서 있는 동안 B는 1호 길(통로 가운데 y 3.45, 1호 북쪽 끝 3.72)과 0.33 m 떨어져 있다 (움직이지 않아 정적 물체로 보인다)
# - A는 B 동쪽에서 출발해 동쪽으로 멀어지므로 둘이 부딪히지 않는다
# 11/20 6·7회차는 B가 테이블 쪽에서 카운터로 걸어가 카운터 앞(1호 길에서 몸 틈 0.2~0.6 m)에 섰다. 걷다 선 사람은 계속
# 움직이는 물체로 잡혀(#361 해제 조건: 처음 본 자리 0.5 m 안) 1호가 그 옆을 30~40 s 지나가지 못했다
# - 둘 다 움직이는 1호를 피하지 않는다. 멈춘 1호가 앞길을 막으면 그 앞에서 선다 (yield_to_robots)
obstacles:
  - id: customer_headon
    type: customer
    pattern: straight
    speed_range_mps: [0.7, 0.7]
    spawn: {x: -0.4, y: 4.1, yaw: 0.0}
    waypoints:
      - {x: -0.4, y: 4.1}
      - {x: 4.3, y: 4.1}
    once: true
    start_trigger: {robot: amr_01, x: -0.4, y: 4.1, within_m: 4.6}
    yield_to_robots: [amr_01]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    note: "A: 매장 앞 통로 카운터 쪽을 따라 동쪽으로 한 번 (1호와 마주침)"
  - id: customer_cross2
    type: customer
    pattern: straight
    speed_range_mps: [0.8, 0.8]
    spawn: {x: -1.175, y: 4.3, yaw: -1.5707963}
    waypoints:
      - {x: -1.175, y: 4.3}
      - {x: -1.175, y: 1.6}
    once: true
    start_trigger: {robot: amr_01, x: -1.175, y: 3.3, within_m: 2.0}
    yield_to_robots: [amr_01]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    note: "B: 2번 매장 카운터 앞에서 돌아서 남쪽 자리로 (1호 앞을 가로지름)"
