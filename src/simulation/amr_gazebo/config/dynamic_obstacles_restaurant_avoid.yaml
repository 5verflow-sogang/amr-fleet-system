# 식당 돌발 손님 회피 장면 (하네스 nav_avoidance_restaurant). 물류센터 I17 가로지르기(amr_safety avoidance_obstacles)를
# 식당 좌표로 옮겼다. 로봇은 1호 1대이고 amr_bringup config/robots_restaurant_avoid.yaml 자리에서 출발한다.
#
# - 1호: (4.3, 0.2)에서 서쪽을 보고 출발해 1·2행 테이블 사이 가로 통로(테이블 끝 y -0.7 ~ 1.1, 가운데 y 0.2)를 따라
#   t07 (-5.75, -0.27)로 음식을 나른다 (약 10.5 m)
# - 손님: 식사를 마치고 t03·t04 사이 세로 통로(x -1.175, 의자 등받이 사이 약 1.3 m)에 서 있다가, 1호가 다가오면
#   남쪽 퇴식구로 걸어 1호 앞에서 가로 통로를 가로지른다. 화분 칸막이(y -5.1) 틈 x -1.75 ~ -0.5로 지나 퇴식대 앞에서 선다
# - 출발 신호(start_trigger): 1호 중심이 만나는 점 (-1.175, 0.2)에서 2.2 m 안에 들어올 때. 1호가 감속 없이 0.6 m/s로
#   오면(의자가 움직이는 물체로 잘못 잡혀 식당 경고 상한 0.6이 걸린 채 오는 경우가 많다) 손님 몸이 통로에 들어설 때(0.8 s 뒤)
#   1호 앞면은 만나는 선에서 1.4 m, 1호 옆 끝 선(y 0.72)에 닿을 때(1.6 s 뒤) 1.0 m, 손님이 1호 길을 벗어날 때(2.9 s 뒤)
#   0.2 m다. 그래서 1호가 손님 앞에서 서야 한다 (0.8 m/s로 오면 옆 끝 선에 닿을 때 0.6 m). 11/20 1회차 2.8 m는 손님이 먼저 지나가
#   1호가 0.17 m/s까지만 줄이고 서지 않았다
# - 한 번만 걷는다(once): 왕복하면 같은 손님이 로봇 뒤에서 다시 통로를 건너 부자연스럽다 (11/19 장면 3 확인 영상)
# - yield_to_robots: 멈춘 1호가 앞길을 막으면 그 앞에서 선다 (사람은 멈춘 로봇에 걸어 들어가지 않는다, I17과 같다).
#   1호가 만나는 선 동쪽에 서면 손님 길과 0.5 m 넘게 떨어져 막지 않는다. 손님이 로봇 근처에서 서는 guest_keep_away_m은
#   쓰지 않는다 (손님이 통로 앞에서 서 버려 가로지르기가 되지 않는다)
# id 앞부분(customer)은 avoidance_eval이 모르는 종류라 default_obstacle_radius 0.25 m(손님 충돌체 구 반지름)로 준다.
obstacles:
  - id: customer_cross
    type: customer
    pattern: straight
    speed_range_mps: [0.8, 0.8]
    spawn: {x: -1.175, y: 2.0, yaw: -1.5707963}
    waypoints:
      - {x: -1.175, y: 2.0}
      - {x: -1.175, y: -6.4}
    once: true
    start_trigger: {robot: amr_01, x: -1.175, y: 0.2, within_m: 2.2}
    yield_to_robots: [amr_01]
    yield_robot_size: [0.565, 0.537]
    yield_patience_s: 3.0
    yield_progress_m: 0.1
    note: "t03·t04 사이에서 1호가 다가오면 남쪽 퇴식구로 한 번 걷는다 (가로 통로 y 0.2를 가로지름)"
