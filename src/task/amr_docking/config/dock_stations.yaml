# 도킹 스테이션: 도킹을 마친 로봇 자세(base_footprint) [x, y, yaw]와 마커판까지 거리.
# 도킹 서버(docking_server)와 Gazebo 마커 배치(aruco_markers.launch.py)가 같이 읽는다.
#
# - pose: Gazebo world 좌표 [m, m, rad]. amr_fleet_manager config/stations.yaml과 같은 값이다
#   (그 파일 주석: "도킹 자세는 ArUco 마커 위치에 맞춰 지수가 확정한다"). 테스트가 두 파일이 같은지 본다
# - standoff: 도킹 자세에서 앞(yaw 방향)으로 마커판 앞면까지 거리 [m]. 마커판은 면에서 5 mm 앞에 붙인다
#     랙: 랙 면 0.8 m 앞 → 0.795 / 충전소: 충전기 본체 앞면(벽에서 0.3 m) 0.7 m 앞 → 0.695 /
#     도크: 플랫폼 앞면(벽에서 1.5 m) 1.5 m 앞 → 1.495
# - board: 판 크기 (markers.py BOARDS). small(기본) 마커 0.14 m·간격 0.32 m, large 0.20 m·0.80 m.
#   멀리서 보는 도크는 방향 오차가 옆 오차로 크게 번져(1.5 m × 1° ≈ 2.6 cm) 큰 판을 쓴다
# - 마커판 번호는 이 목록 순서(0부터)다. 판 k에는 ArUco 마커 2k(왼쪽)·2k+1(오른쪽)이 붙는다
#   (DICT_4X4_100, 로봇에서 판을 바라볼 때 왼쪽·오른쪽)
#
# 랙 면에 판을 붙이므로 픽업·하역도 도킹한다. 대기 위치(wait_*)는 도킹하지 않는다(목록에 없음).

