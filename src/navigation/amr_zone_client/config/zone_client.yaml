# 구역 진입 처리 노드 파라미터 (zone_client_node)
/**/zone_client:
  ros__parameters:
    # 좌표계 이름 (TF map_frame → base_frame).
    map_frame: map
    # zones.yaml area_world의 좌표계 (10/13 수정). area_world는 Gazebo world 좌표인데 지도 원점은 world (0, 1.5)라,
    # map 좌표로 그대로 쓰면 구역이 1.5 m 어긋난다. 'world'면 TF map ← world(amr_bringup system.launch가 발행)로 바꿔 쓴다.
    # 비우면 map 좌표로 그대로 본다 (TF 없는 단위·launch 테스트). launch 인자 zones_frame으로 준다
    zones_frame: ''
    base_frame: base_footprint
    # Nav2 전역 계획 경로. amr_bringup이 붙이는 상대 이름 (/<ns>/plan)
    plan_topic: plan
    # 서버 → 로봇(zone_grants)은 장애 주입기가 네임스페이스별로 중계한다 (api.md 4-2절).
    # zone_requests는 중계되지 않는 절대 토픽이라 파라미터로 빼지 않는다 (fleet_manager_node.py)
    zone_grants_topic: fleet/zone_grants
    # cmd_vel 체인: 최종 cmd_vel을 가로채는 건 안전 노드(amr_safety) 몫이다 (9/28 회의,
    # project-spec.md '안전 정지 책임' 절). 그래서 출력 이름을 cmd_vel로 두지 않는다.
    # amr_safety가 생기기 전엔 amr_bringup이 cmd_vel_zone_limited를 로봇 cmd_vel로 임시 리맵한다
    cmd_vel_in_topic: cmd_vel_nav
    cmd_vel_out_topic: cmd_vel_zone_limited
    update_rate_hz: 10.0
    # 구역 규칙 (이진, 10/5, zones.yaml 주석과 같다)
    trigger_distance_m: 3.0
    stop_margin_m: 0.5
    # zone_client/state의 'waiting' 판정 여유(#137 지수 리뷰): 허가 없이 APPROACHING이어도 경계까지
    # stop_margin_m + waiting_margin_m보다 멀면 아직 'approaching'이다 - trigger_distance_m 요청
    # 순간부터 바로 waiting으로 보이던 것을 정지점 근처로 좁혔다. 0.5 → 0.15(#137 지수 두 번째
    # 리뷰) - waiting이 뜨는 지점의 속도 상한이 거의 0이 되도록 더 좁혔다
    waiting_margin_m: 0.15
    decel_mps2: 1.0
    resend_period_s: 1.0
    # REJECTED 뒤 경로에 구역이 남아 있으면 이 시간 뒤 새 request_id로 재시도한다 (#66 하연 리뷰)
    retry_period_s: 5.0
    # 아직 들어가지 않은 구역이 전역 경로에서 빠져도, 로봇이 trigger_distance_m(직선) 안에 있으면 이 시간(s)
    # 동안은 반납하지 않고 같은 request_id로 계속 요청하며 직선 거리로 정지 상한을 건다. 넘으면 반납·IDLE
    # (10/15 하연·이진, #66의 "경로에서 빠지면 즉시 반납"을 바꿈 - 교착 중 Nav2의 잠깐 우회로 정지선을 넘던 문제)
    drop_grace_s: 3.0
    # 아직 안 건드린 구역은 로봇 앞 이 거리(m)까지만 찾아본다. 0.0이면 trigger_distance_m + 2.0m로
    # 알아서 정한다(core.py _DEFAULT_LOOKAHEAD_MARGIN_M) - 긴 경로를 매번 끝까지 훑지 않게 한다 (#66).
    # APPROACHING·BLOCKED의 "경로에 있음/없음" 판정도 이 거리까지만 본다(10/18 하연 제안, #177·#189
    # 회귀 수정) - INSIDE만 끝까지 본다
    lookahead_m: 0.0
    # SafetyStatus 연동 (#69·#70). safety/status는 네임스페이스 안 상대 이름(SafetyStatus.msg
    # 주석과 동일). 이 시간(s) 동안 못 받으면 끊김으로 보고 speed_limit 제한을 없앤다 - 최종
    # 게이트가 amr_safety라서다(docs/algorithms/navigation.md '5-1. speed_limit 연동')
    safety_status_topic: safety/status
    safety_status_timeout_s: 1.0
    # speed_limit이 낮아질 때 램프의 "제한 없음" 기준(ramp_cap_down) - nav2_params.yaml
    # FollowPath.max_vel_x·URDF max_linear_velocity와 동일하게 둔다
    max_linear_velocity_mps: 2.0
    # BACKING(교착 해소, 10/11 결정): INSIDE에서 GRANT_REVOKED를 받으면 cmd_vel_nav를 무시하고
    # 이 속도로 직접 후진한다(decel_mps2 이내로 가감속)
    backing_speed_mps: 0.15
    # 구역 경계를 벗어난 뒤 이만큼 더 나가면 정지·반납한다(이 지점에서 속도가 decel_mps2로 0이 된다)
    backing_margin_m: 0.3
    # 안전장치(fail-closed): 후진 시작 위치에서 이 거리를 넘으면 멈추고 ERROR. zones.yaml 구역
    # 크기에 맞춰 조정한다 - 가장 긴 구역(narrow_02, 5.0 m)을 완전히 빠져나오고 backing_margin_m
    # (0.3 m)까지 나갈 여유를 더해 6.0 m로 둔다(#137 하연 두 번째 리뷰)
    backing_max_distance_m: 6.0
    # 안전장치(fail-closed): 후진을 시작한 뒤 이 시간을 넘으면 멈추고 ERROR. 가장 긴 구역
    # (narrow_02, 5.0 m)을 backing_speed_mps(0.15 m/s)로 다 빠져나오는 데 걸리는 시간
    # (5.0 / 0.15 ≈ 33.3 s)에 여유를 더해 45 s로 둔다(#137 하연 두 번째 리뷰) - BACKING·FAILED
    # 중에도 resend_period_s마다 ACCESS를 보내 서버 last_seen을 갱신하므로, 더는 서버
    # release_timeout_s(amr_fleet_manager.yaml 기본 30 s)보다 작아야 할 필요가 없다
    backing_timeout_s: 45.0
