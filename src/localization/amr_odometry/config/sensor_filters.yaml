# LiDAR·IMU 전처리 필터 파라미터 (scan_filter, imu_filter 노드)
/**/scan_filter:
  ros__parameters:
    # 거리 필터 [m]. 센서 한계(LiDAR 0.12~25 m)와 이 값 중 좁은 쪽을 쓴다
    range_min: 0.12
    range_max: 25.0
    # 각도 필터 [rad]. 범위 밖 빔은 NaN. 기본은 360° 전체 (몸체 가림이 없어 자를 곳이 없다)
    angle_min: -3.14159265
    angle_max: 3.14159265
    # 아웃라이어: 앞뒤 2개 빔 중 (0.2 m + 거리의 5%) 안에 있는 이웃이 1개도 없으면 외톨이 점으로 제거
    # 0.2 m = 노이즈(σ 0.03 m)의 이웃 차이 3σ(약 0.13 m) + 여유.
    # 5%: 멀리서 벽을 비스듬히 비추면 이웃 빔 차이가 커서(sim에서 13 m에 0.4~0.6 m) 고정 0.2 m로는
    # 정상 점 8%가 지워졌다
    outlier_window: 2
    outlier_distance: 0.2
    outlier_ratio: 0.05
    outlier_min_neighbors: 1

/**/imu_filter:
  ros__parameters:
    # 저역통과 차단 주파수 [Hz] (IMU 100 Hz). 0이면 끈다.
    # 자이로는 끈다: 노이즈 σ 2e-4 rad/s라 거를 게 거의 없고, 20 Hz(τ≈8 ms) 지연이 회전 가속 때 큰 오차를 냈다.
    # 완만한 주행 실측(GT 위치 미분 대비): 20 Hz 실제 σ 0.0033 (분산비 273) → 끔 σ 0.00035 (#76·#81)
    gyro_cutoff_hz: 0.0
    accel_cutoff_hz: 5.0
    # 시작 후 이 시간 동안 정지 평균으로 바이어스를 잰다. 그동안 로봇을 움직이지 않는다
    calibration_duration: 2.0
    # 보정 중 축별 표준편차가 이보다 크면 움직인 것으로 보고 다시 잰다 (노이즈 σ의 약 50배)
    stationary_gyro_stddev: 0.01
    stationary_accel_stddev: 0.1
    # 평균 각속도가 이보다 크면 회전 중 (일정 속도 회전은 표준편차가 작아 위 기준만으로는 정지로 오판한다)
    stationary_gyro_mean_max: 0.05
    # 평균 가속도가 중력 (0, 0, g)에서 축별로 이만큼 넘게 벗어나면 가속 중·기울어짐 (바이어스 0.1보다 크게)
    stationary_accel_mean_tolerance: 0.3
    # 보정이 이 횟수(1번 = calibration_duration)만큼 연속 실패하면 미보정으로 발행 시작 (5번 ≈ 10초 동안 계속 움직임).
    # 0이면 보정될 때까지 발행하지 않는다. 하네스 자동 실행에서 IMU가 영영 안 나오는 것을 막는다
    max_calibration_attempts: 5
    # 미보정 발행 때 공분산에 더하는 바이어스 σ. 자이로 0.01 rad/s(저가 MEMS 수준), 가속도는 sensors.yaml 바이어스 0.1의 2배
    uncalibrated_gyro_bias_stddev: 0.01
    uncalibrated_accel_bias_stddev: 0.2
    # 공분산에 쓰는 센서 노이즈 σ. amr_description/config/sensors.yaml의 IMU 값과 같게 둔다
    gyro_noise_stddev: 2.0e-4
    accel_noise_stddev: 1.7e-2
    # 보정 후 각속도 분산 하한 [(rad/s)²]. 정속에선 오차가 노이즈 σ와 같지만 가감속 순간에 조금 커져서,
    # 완만한 주행 실측 σ 0.00035에 맞춘다: 보고 σ ≈ √(2e-4² + 1e-7) ≈ 0.00037 (분산비 3.0 → 약 0.9, 인계 기준 0.5~2)
    gyro_variance_floor: 1.0e-7
