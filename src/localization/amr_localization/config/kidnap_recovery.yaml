# Kidnapped Robot 감지·복구 노드 (kidnap_recovery_node.py) 파라미터. 근거는 docs/algorithms/localization.md 4절
/**:
  ros__parameters:
    check_hz: 2.0
    # 감지: 스캔-지도 일치율이 lost_ratio 아래로 lost_checks번 연속이면 위치를 잃음
    match_tol: 0.1
    lost_ratio: 0.5
    lost_checks: 3
    # 수렴: 멈춘 상태에서 일치율 ≥ ok_ratio이고 AMCL σ ≤ ok_std_m가 ok_checks번 연속 (4-6절, 옆 통로 오수렴 0.87)
    ok_ratio: 0.9
    ok_std_m: 0.3
    ok_checks: 3
    # 시도 1번 = 정지 settle_s(제자리 갱신은 nomotion_max번까지) → 회전 rotate_s → 정지 확인 confirm_s.
    # 최대 max_attempts번 (1차 국소, 2차부터 전역). 전부 실패하면 failed (BT는 바로 FAILED, LOCALIZATION_LOST)
    settle_s: 10.0
    nomotion_max: 4
    allow_rotate: true
    rotate_s: 15.0
    rotate_speed: 0.5
    confirm_s: 3.0
    max_attempts: 3
    local_first: true
    # 잃은 뒤 이 시간이 지나면 시도 중이어도 failed (0이면 끔). 마커가 늦게 오면 시도가 늘어나서 둔다 (4-2절)
    max_recovery_s: 100.0
    local_std_m: 2.5
    local_std_yaw: 0.8
    # 재초기화 때만 AMCL max_particles를 늘리고 복구 뒤 되돌린다 (normal은 amcl.yaml과 같게, 0이면 끔)
    boost_particles: 10000
    normal_particles: 2000
    restore_std_m: 0.1
    restore_std_yaw: 0.05
    # 복구 뒤 다시 넣은 자세에서 제자리 갱신을 더 부르는 횟수. 멈춰 있으면 AMCL이 갱신하지 않아 수렴 때 어긋남이 남는다
    refine_nomotion: 4
    # 마커판 자세 (amr_docking aruco_localizer, map 기준). 복구 중에 들어오면 그 자세·공분산으로 initialpose를 내고
    # 멈춰서 marker_settle_s 동안 판정, 미수렴이면 다음 시도. 한 번 잃은 동안 marker_max번까지 (4-7절)
    marker_topic: aruco_pose
    marker_settle_s: 10.0
    marker_max: 3
    # 마커를 받은 뒤(다음 시도도 마커 주변, 마지막 시도는 전역) 제자리 갱신 상한. 좁게 뿌려 몰려도 맞는 곳이라 nomotion_max보다 크게
    marker_nomotion_max: 12
    # 이보다 오래된 영상·큰 σ는 버린다. σ 하한은 판 하나의 방향 오차를 스캔으로 고칠 여지를 남긴다
    marker_max_age_s: 1.0
    marker_max_future_s: 0.1
    # σ 1.5 m = 판까지 약 6 m. 그보다 먼 판은 PnP 뒤집힌 해가 연달아 같게 나와 Agreement를 통과한다 (4-7절)
    marker_max_std_m: 1.5
    marker_min_std_m: 0.1
    marker_min_std_yaw: 0.05
    explore_forward: false
