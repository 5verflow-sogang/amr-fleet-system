# 식당 시연 1-2 (혼잡 구간 우회) 시작 자세 [x, y, yaw] (m, rad, world = map).
# 1호는 입구 옆 대기(서쪽 통로 남쪽 끝)에서 배식대 2번 자리로 간다. 나머지 4대는 대기 위치에서
# 장면 스크립트가 먼저 다른 배달을 준다
# 1호는 동쪽(yaw 0)을 본다: 혼잡도를 켜면 x -7.275 우회 통로로 가려고 남쪽 통로를 따라 동쪽으로 출발하므로, 북쪽(서쪽 통로)을
# 보고 서 있으면 출발하자마자 제자리 회전부터 한다 (1-1 파일 _s11은 북쪽 그대로)
robots:
  amr_01: [-10.5, -5.6, 0.0]
  amr_02: [11.2, -5.8, 3.14159265]
  amr_03: [11.2, -4.6, 3.14159265]
  amr_04: [11.2, -3.4, 3.14159265]
  amr_05: [11.2, -2.2, 3.14159265]
