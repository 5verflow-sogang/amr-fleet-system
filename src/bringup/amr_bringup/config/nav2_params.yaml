# Nav2 파라미터 초안 (1주차, 담당: 이진)
#
# 범위: global/local costmap 3레이어(Static/Obstacle/Inflation) + planner_server(NavFn) +
# controller_server(DWB 기준선 + 3주차 amr_nav2_plugins::DwaController)만 포함한다.
# bt_navigator·behavior_server·waypoint_follower·velocity_smoother 등은 범위 밖이며
# amr_bringup 담당자가 추가한다.
#
# 로봇 스펙(원 명세서): 600x400x300mm, 최대 2.0m/s, 가속 1.0m/s^2, 회전 1.5rad/s
# 좁은 통로 요구: 로봇 폭(0.4m) + 20cm = 0.6m 이상에서 통과 가능해야 한다.
#
# 네임스페이스: CONTRIBUTING 4-5절에 따라 이 파일은 네임스페이스를 가정하지 않는다.
# 토픽은 모두 상대 이름(scan, odom, cmd_vel)이며, amr_bringup이 로봇별 네임스페이스를
# push할 때 자동으로 해당 네임스페이스 하위로 리맵된다.
#
# TODO(2주차): 아래 값은 지수의 실제 로봇(URDF·센서)이 아직 없어 정한 합리적 기본값이다.
# footprint 실측, 좁은 통로 통과 실험, 동적 장애물 재계획 KPI(500ms)를 지수 로봇으로
# 검증한 뒤 이진·지수가 함께 재조정한다.

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0      # 정적 맵 기반이라 낮은 주기로 충분
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint  # 민지 #40 약속: base_link가 아니라 base_footprint
      resolution: 0.05           # SLAM 맵 해상도(0.05m 이하) KPI와 일치시킨다
      track_unknown_space: True
      rolling_window: False

      # 로봇 풋프린트: 600x400mm -> 중심 기준 x=+-0.3m, y=+-0.2m 사각형.
      # inscribed radius(0.2m, 폭 방향)와 circumscribed radius(약 0.36m, 대각선)는
      # Nav2가 이 footprint로부터 자동 계산해 inflation 판정에 쓴다.
      footprint: "[[0.3, 0.2], [0.3, -0.2], [-0.3, -0.2], [-0.3, 0.2]]"
      footprint_padding: 0.01

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        # map_server는 로봇별로 안 띄우고 하나만 공유하므로(지도는 공용) 절대 경로로 고정한다.
        # 상대 이름(기본 "map")으로 두면 네임스페이스 붙은 로봇에서 /<ns>/map을 찾아 못 받는다.
        map_topic: /map

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: scan                     # 상대 토픽. 로봇 네임스페이스는 bringup이 부여
          sensor_frame: ""                 # 빈 문자열 = LaserScan 메시지의 frame_id 사용
          data_type: "LaserScan"
          marking: True
          clearing: True
          # --- 원 명세 필수 항목: 센서 업데이트 주기 ---
          # LiDAR 스펙(10Hz 이상) 기준. 실제 발행 주기가 이보다 느리면 Nav2가 경고한다.
          expected_update_rate: 0.1
          # --- 원 명세 필수 항목: 장애물 유지 시간 ---
          # 마지막 관측 후 이 시간(초)만큼 장애물 마킹을 유지한다. 0.0이면 매 스캔마다
          # 최신 관측만 남긴다. 동적 장애물(최대 1.5m/s)이 지나간 자리에 "유령 장애물"이
          # 남는 시간과 트레이드오프이므로 2주차 실측 후 조정한다.
          observation_persistence: 0.3
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          inf_is_valid: False

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # --- 원 명세 필수 항목: 좁은 통로(로봇 폭+20cm=0.6m) 통과 목적 ---
        # inflation_radius: 이 거리 밖은 비용이 0으로 떨어지는 팽창 반경.
        # cost_scaling_factor: 값이 클수록 inscribed_radius 밖에서 비용이 더 빨리 decay한다
        #   (exp(-cost_scaling_factor * (distance - inscribed_radius))).
        # inscribed_radius(0.2m, footprint에서 자동 계산)까지는 통과 불가(치명 비용)로
        # 처리되므로, 실제로 로봇이 통과 가능한지는 이 값이 아니라 footprint 폭이 결정한다.
        # 아래 값은 순찰 통로 폭 여유를 보수적으로 남기는 일반적인 시작값이며,
        # 실제 통로 폭이 정해지면(지수 월드) 좁은 통로 통과 KPI로 검증 후 조정한다.
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
        inflate_unknown: False
        inflate_around_unknown: True

      always_send_full_costmap: True

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0      # 동적 장애물(최대 1.5m/s) 회피를 위해 global보다 빠르게
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint  # 민지 #40 약속: base_link가 아니라 base_footprint
      rolling_window: True
      width: 3
      height: 3
      resolution: 0.05

      footprint: "[[0.3, 0.2], [0.3, -0.2], [-0.3, -0.2], [-0.3, 0.2]]"
      footprint_padding: 0.01

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        # map_server는 로봇별로 안 띄우고 하나만 공유하므로(지도는 공용) 절대 경로로 고정한다.
        # 상대 이름(기본 "map")으로 두면 네임스페이스 붙은 로봇에서 /<ns>/map을 찾아 못 받는다.
        map_topic: /map

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: scan
          sensor_frame: ""
          data_type: "LaserScan"
          marking: True
          clearing: True
          expected_update_rate: 0.1     # global_costmap과 동일 근거(LiDAR 10Hz 이상)
          observation_persistence: 0.3  # global_costmap과 동일 근거
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          inf_is_valid: False

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5   # local costmap 창(3x3m)에 맞춰 global보다 약간 좁게
        cost_scaling_factor: 3.0
        inflate_unknown: False
        inflate_around_unknown: True

      always_send_full_costmap: False

# --- 1주차 기준선 플래너: NavFn (우리 A*와 성능·경로 비교용 baseline) ---
# TODO(2주차): planner_plugins에 amr_nav2_plugins의 A* 플러그인을 추가하고
# 두 플래너를 나란히 비교(경로 길이·계획 소요 시간·장애물 여유 거리)한다.
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false     # NavFn 내장 A* 모드는 끈다. 우리 A*는 별도 플러그인(2주차)으로 비교
      allow_unknown: true

# --- 1주차 기준선 컨트롤러: DWB (우리 Pure Pursuit/Stanley + PID와 비교용 baseline) ---
# 속도·가속 한계만 로봇 스펙에 맞추고, critic 가중치는 nav2 공식 튜토리얼의 기본값을
# 그대로 쓴다. 세부 튜닝은 2주차 이후 진행한다.
#
# 3주차: amr_planning_core의 DWA(동적 장애물 등속 예측 포함)를 amr_nav2_plugins로
# 감싼 "DWA" 플러그인을 FollowPath(DWB) baseline과 나란히 추가한다 - 어느 쪽을 쓸지는
# bt_navigator의 controller_id로 고른다(컨트롤러_server 재시작 없이 바꿀 수 있다).
# 값은 amr_planning_core::DwaConfig 기본값과 같다(dwa.hpp 주석에 각 근거가 있다).
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath", "DWA"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 2.0          # 로봇 스펙: 최대 선속도 2.0 m/s
      max_vel_y: 0.0
      max_vel_theta: 1.5      # 로봇 스펙: 최대 각속도 1.5 rad/s
      min_speed_xy: 0.0
      max_speed_xy: 2.0
      min_speed_theta: 0.0
      acc_lim_x: 1.0          # 로봇 스펙: 최대 가속도 1.0 m/s^2
      acc_lim_y: 0.0
      acc_lim_theta: 3.2      # TODO(2주차): 회전 가속 스펙 확정되면 재조정
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist",
        ]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

    DWA:
      plugin: "amr_nav2_plugins::DwaController"
      # 로봇 속도·가속 한계 (max_w·acc_v·acc_w는 FollowPath.max_vel_theta/acc_lim_x/acc_lim_theta와 동일).
      # max_v는 로봇 스펙(2.0 m/s)이 아니라 창고 통합 스택의 순항 속도 0.5 m/s로 둔다 - Nav KPI(nav_kpi 시나리오
      # config_patch)·통합 스택이 이 속도를 기준으로 잰다. #216에서 heading 기준점을 고친 뒤로 DWA가 실제로
      # max_v까지 달려(전에는 약 0.25~0.4 m/s에 묶였다) 2.0이면 통로·구역 진입 속도가 기준과 달라진다.
      # 연구 2(experiments/research2)는 이 파일이 아니라 DwaParams의 자체 값을 쓴다.
      max_v: 0.5
      min_v: 0.0
      max_w: 1.5
      acc_v: 1.0
      acc_w: 3.2
      # 궤적 시뮬레이션
      dt: 0.1
      sim_time: 2.0
      # 샘플 수 10 x 15 (DwaConfig 기본 20 x 30의 1/4). 20 x 30은 지금 빌드(최적화 없음)에서 한 번에 약 66 ms라
      # 20 Hz 제어 주기(50 ms)를 넘는다. 10 x 15는 약 17 ms, Gazebo 통로 ① 3회 품질이 20 x 30과 같거나 낫다
      # (navigation.md 4-2절). 실물(라즈베리파이)에서도 돌아야 한다. w_samples는 홀수라 지금 각속도가 샘플에 들어간다.
      # 연구 2(experiments/research2)는 이 값을 따르지 않고 20 x 30을 쓴다
      v_samples: 10
      w_samples: 15
      # 로봇 풋프린트 반폭(사각형, 600x400mm) - global/local costmap의 footprint와 동일
      footprint_half_length: 0.3
      footprint_half_width: 0.2
      # 254(실제 장애물 셀)만 충돌로 본다. 253(내접 팽창)까지 막으면 폭 0.6 m 좁은 통로(로봇 폭 0.4 m)의
      # 가운데 셀까지 막혀 진입 궤적이 하나도 안 남는다. 풋프린트 전체를 검사하므로 실제 충돌은 그대로 걸러진다.
      lethal_cost_threshold: 254
      # 비용 함수 가중치(docs/algorithms/navigation.md 4-3절 근거)
      heading_weight: 0.8
      clearance_weight: 0.1
      velocity_weight: 0.1
      goal_tolerance: 0.15
      # 전역 경로에서 이 거리(m) 앞의 점을 "다음 지점" 목표로 추종한다(Pure Pursuit류).
      # 1.5면 꺾이는 통로 입구에서 목표점이 모서리 너머에 잡혀 모서리를 질러 가다 랙에 막힌다.
      # 0.5로 줄여 경로를 가깝게 따라가게 한다 (통로 ② 진입·넓은 곳 주행 Gazebo 확인).
      lookahead_distance: 0.5
      # 최종 접근(제자리 회전) 전환 기준. general_goal_checker의 xy_goal_tolerance·
      # yaw_goal_tolerance와 같은 값으로 둔다 - 다르면 이 플러그인과 goal_checker가
      # "도착했다"를 서로 다른 기준으로 판정해 어긋난다.
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      # 동적 장애물(perception/obstacles, 3주차)
      predict_dynamic_obstacles: True
      dynamic_obstacle_safety_margin: 0.2
      dynamic_obstacle_influence_radius: 1.0
      dynamic_weight: 0.3
      # 허용 속도(Fox 1997): 궤적상 장애물까지 거리 dist에서 v <= sqrt(2*acc_v*dist)인 샘플만 남긴다
      # (docs/algorithms/navigation.md 4-7절). false면 sim_time 안에서 닿는 궤적을 모두 빼는 이전 동작
      use_admissible_velocity: True
      # 목표 앞 감속: 최종 목표까지 직선 거리 d에서 v <= sqrt(2*acc_v*d) (navigation.md 4-7절)
      use_goal_slowdown: True
      # heading 기준점을 궤적마다 max(lookahead_distance, |v|*sim_time) 앞의 경로 점으로 잡는다.
      # false면 lookahead_distance 고정 - 그러면 v <= lookahead_distance/sim_time(0.25 m/s)으로 묶인다.
      adaptive_lookahead: True
      # 제자리 회전: 기준점(lookahead_distance 앞)까지 방향 오차가 min_angle(rad)보다 크면 제자리 회전 모드에
      # 들어가고 exit_angle 이하가 되면 나온다(히스테리시스). 0.0 이하면 끈다 (navigation.md 4-9절). double이라 0이 아니라
      # 0.0으로 적는다(정수면 타입 오류로 컨트롤러가 안 뜬다). exit_angle은 min_angle 이하여야 한다(크면 min_angle로 줄임)
      rotate_in_place_min_angle: 0.785
      rotate_in_place_exit_angle: 0.524
      # 제자리 회전(v≈0) 샘플은 풋프린트를 이만큼(m) 키워 검사한다. 안전 노드 side_margin(amr_safety
      # config/safety.yaml, collision.path_hazard)과 같아야 한다 - DWA 회전이 더 빠듯하면 안전 노드가 그 회전을
      # 계속 막아 progress_checker까지 멈춘다
      rotate_in_place_clearance: 0.05
      # TTC 회피 모드 (navigation.md 4-10절): perception/collision_risks의 움직이는 트랙 최소 TTC가 avoid_ttc_enter_s보다
      # 작으면 켜고, TTC >= avoid_ttc_enter_s(또는 inf)가 avoid_exit_hold_s 동안 이어지면 끈다. collision_risks가
      # avoid_risk_timeout_s 넘게 안 오면 지금 상태를 유지한다(켜져 있으면 끄지 않음). 상태는 dwa/avoid_mode(Bool)로 낸다
      avoid_mode_enabled: True
      avoid_ttc_enter_s: 3.0
      avoid_exit_hold_s: 0.5
      avoid_risk_timeout_s: 0.3
      # 회피 모드에서: dynamic_obstacle_safety_margin += avoid_margin_add (정면 최악: 통신 0.1 s + 추적 0.1 s 지연 동안
      # 상대속도 2.0 m/s(로봇 0.5 + 동적 장애물 최대 1.5)로 다가오는 거리 0.4 m), dynamic_weight *= avoid_weight_scale
      # (초기값, 튜닝용 시드로만 조정해 I17 본 측정 전에 고정), 궤적 시뮬레이션 길이 = avoid_rollout_time (TTC 3 s 범위를
      # 충돌 검사가 덮게. sim_time·heading 기준점은 그대로)
      avoid_margin_add: 0.4
      avoid_weight_scale: 2.0
      avoid_rollout_time: 3.0

# --- TEB (DWA 비교 대상, #110 underlay·(10) 작업) ---
# 원 명세 "DWA 직접구현 vs TEB" 비교. teb_local_planner는 apt에 없어 /opt/teb_ws에 소스로
# 빌드해 얹는다(Dockerfile) - Humble 포트가 2022년 이후 유지보수가 끊겨 있다는 점은 감안한다.
# 값은 teb_local_planner/params/teb_params.yaml(설치된 예시, turtlebot3 기준)을 우리 로봇
# 스펙(최대 2.0 m/s, 1.5 rad/s, 가속 1.0 m/s²·3.2 rad/s²)과 goal_checker(0.25 m)에 맞춰 바꿨다.
# costmap_converter_plugin은 CostmapToDynamicObstacles - costmap 변화로 움직이는 장애물을
# 추적해 속도까지 추정한다(배경 차분 + 다중 추적, 우리 DWA의 predict_dynamic_obstacles와
# 같은 역할이지만 perception/obstacles 대신 costmap만 보고 직접 추정한다는 차이가 있다 -
# navigation.md 7절 비교 결과에 적는다).
    teb:
      plugin: "teb_local_planner::TebLocalPlannerROS"

      teb_autosize: 1.0
      dt_ref: 0.3
      dt_hysteresis: 0.1
      max_samples: 500
      global_plan_overwrite_orientation: True
      allow_init_with_backwards_motion: False
      max_global_plan_lookahead_dist: 3.0
      global_plan_viapoint_sep: -1.0
      global_plan_prune_distance: 1.0
      exact_arc_length: False
      feasibility_check_no_poses: 5
      publish_feedback: False

      # Robot (DWA·FollowPath와 같은 로봇 스펙)
      max_vel_x: 2.0
      max_vel_x_backwards: 0.2
      max_vel_theta: 1.5
      acc_lim_x: 1.0
      acc_lim_theta: 3.2
      min_turning_radius: 0.0   # 차동 구동 - 제자리 회전 가능

      footprint_model:
        type: "polygon"
        vertices: "[[0.3, 0.2], [0.3, -0.2], [-0.3, -0.2], [-0.3, 0.2]]"

      # GoalTolerance (general_goal_checker와 같은 값 - 서로 다른 기준으로 "도착"을 판정하면 어긋난다)
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      free_goal_vel: False

      # Obstacles
      min_obstacle_dist: 0.25
      inflation_dist: 0.5
      include_costmap_obstacles: True
      costmap_obstacles_behind_robot_dist: 1.0
      obstacle_poses_affected: 15
      dynamic_obstacle_inflation_dist: 0.6
      include_dynamic_obstacles: True
      costmap_converter_plugin: "costmap_converter::CostmapToDynamicObstacles"
      costmap_converter_spin_thread: True
      costmap_converter_rate: 5.0

      # Optimization (예시 기본값 - 2주차 이후 실측 비교로 재조정)
      no_inner_iterations: 5
      no_outer_iterations: 4
      optimization_activate: True
      optimization_verbose: False
      penalty_epsilon: 0.1
      obstacle_cost_exponent: 4.0
      weight_max_vel_x: 0.5
      weight_max_vel_theta: 0.5
      weight_acc_lim_x: 0.5
      weight_acc_lim_theta: 10.5
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 3.0
      weight_kinematics_turning_radius: 1.0
      weight_optimaltime: 1.0
      weight_shortest_path: 0.0
      weight_obstacle: 100.0
      weight_inflation: 0.2
      weight_dynamic_obstacle: 10.0
      weight_dynamic_obstacle_inflation: 0.2
      weight_viapoint: 50.0
      weight_adapt_factor: 2.0

      # Homotopy Class Planner
      enable_homotopy_class_planning: True
      enable_multithreading: True
      max_number_classes: 4
      selection_cost_hysteresis: 5.0
      selection_prefer_initial_plan: 1.0
      selection_obst_cost_scale: 1.0
      selection_alternative_time_cost: True
      roadmap_graph_no_samples: 15
      roadmap_graph_area_width: 5.0
      roadmap_graph_area_length_scale: 1.0
      h_signature_prescaler: 0.5
      h_signature_threshold: 0.1
      obstacle_heading_threshold: 0.45
      switching_blocking_period: 0.0
      viapoints_all_candidates: True
      delete_detours_backwards: True
      max_ratio_detours_duration_best_duration: 3.0
      visualize_hc_graph: False
      visualize_with_time_as_z_axis_scale: 0.0

      # Recovery
      shrink_horizon_backup: True
      shrink_horizon_min_duration: 10.0
      oscillation_recovery: True
      oscillation_v_eps: 0.1
      oscillation_omega_eps: 0.1
      oscillation_recovery_min_duration: 10.0
      oscillation_filter_duration: 10.0
