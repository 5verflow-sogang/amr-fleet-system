# 식당 시연 1-2 분할 영상 시작 자세 [x, y, yaw] (m, rad, world = map). robots_restaurant_s12.yaml(1-2)에서 1호만 바꿨다.
# 1호는 서쪽 통로 남쪽 입구 앞(-10.2, -7.0)에서 북쪽(서쪽 통로)을 본다: 0초에 서쪽 통로로 출발하고, 그 뒤 손님이 몰려
# 혼잡도가 오르면 1초 재계획으로 x -7.275 우회 통로로 바꾼다(장면 시나리오 demo_s12_split). 서쪽 통로 구역(y -5.0부터)까지
# 2 m라 혼잡도가 오르는 동안(0초 뒤 약 3~5 s) 통로 안으로 들어가지 않는다. 혼잡이 없으면 서쪽 통로가 우회 통로보다 짧다
# (배식대 2번 자리까지 약 12.7 m / 14.9 m). 나머지 4대는 1-2와 같다 (장면 스크립트가 먼저 다른 배달을 준다)
robots:
  amr_01: [-10.2, -7.0, 1.57079633]
  amr_02: [11.2, -5.8, 3.14159265]
  amr_03: [11.2, -4.6, 3.14159265]
  amr_04: [11.2, -3.4, 3.14159265]
  amr_05: [11.2, -2.2, 3.14159265]
