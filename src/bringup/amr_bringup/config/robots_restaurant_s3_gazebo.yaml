# 장면 3 Gazebo 시작 자리. 1·2·5호는 남동쪽 홀(충전소 위), 4호는 북쪽 가운데(매장 2 앞), 3호는 남쪽 통로 서쪽 끝에서 쉰다.
# 2호(8.0, 배터리 31 %)가 충전소 3에서 먼저 충전하고 1호(6.5, 34 %)가 약 15 s 뒤 충전소 2로 간다. 먼저 끝난 2호는 동쪽으로
# 나가 아직 충전 중인 로봇 앞을 지나지 않고, 1호는 2호가 선 지 3 s 넘게 지나 출발한다 (11/19 밤샘: 2.7 s 만에 출발한 로봇이
# 방금 선 옆 로봇을 '움직이는 물체'로 보고 2.4 s 섰다. 추적기는 3 s 서 있어야 정적으로 바꾼다)
# OFF 피크에 1·2·5호가 모두 충전소에 붙으면 남동쪽 홀이 비고, 105 s 회수(c02)는 3호가 넓은 남쪽 통로(장애물까지 1.0 m 이상)로
# 약 16.6 m를 온다. ON에서는 미리 충전을 마친 2호가 wait_2에서 약 2 m를 온다 (11/19 밤샘: 테이블 도착 차이 약 18 s)
# 3호의 길은 4호가 일하는 북쪽 통로도, 테이블 사이 좁은 틈도 지나지 않는다
# (11/8 v7: 서쪽 t02에서 출발한 3호가 북쪽 통로에서 4호와 마주 막히고, 테이블 사이 의자에 붙어 섰다)
# 5호는 2호 동쪽(9.6, -5.5)에서 출발한다. c01 서쪽 테이블 사이 통로(x 5.0)는 table_guest 자리라 비워 둔다
