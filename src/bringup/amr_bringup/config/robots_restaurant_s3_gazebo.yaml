# 충전소 오른쪽부터 차례로 충전·복귀해 아직 충전 중인 로봇 앞을 가로지르지 않는다.
# 1·2·5호는 남동쪽 홀(충전소 옆), 4호는 북쪽 가운데(매장 2 앞)에서 일하고, 3호는 남서쪽 대기 자리에서 쉰다.
# OFF 피크에 1·2·5호가 모두 충전소에 붙으면 남동쪽 홀이 비고, 105 s 회수는 3호가 넓은 남쪽 통로(장애물까지 0.9 m 이상)로
# 약 10.5 m를 온다. 3호의 길은 4호가 일하는 북쪽 통로도, 테이블 사이 좁은 틈도 지나지 않는다
# (11/8 v7: 서쪽 t02에서 출발한 3호가 북쪽 통로에서 4호와 마주 막히고, 테이블 사이 의자에 붙어 섰다)
