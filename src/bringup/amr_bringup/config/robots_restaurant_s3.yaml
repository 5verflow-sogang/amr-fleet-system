# 식당 시연 3 (충전 스케줄링) 시작 자세 [x, y, yaw] (m, rad, world = map). 모두 북쪽(홀)을 본다.
# 손님이 몰린 시간에 이미 일하던 로봇들처럼 흩어 둔다. 고른 기준 (11/8 맥 스모크 두 번에서 배운 것):
# - 동쪽 대기 줄(robots_restaurant.yaml, 1.2 m 간격)에서 다섯 대가 한꺼번에 나가면 동쪽 통로에 몰려 서로 막혔다
# - 테이블·부스 정차 자리(L01, b01 등)는 가구를 바라보고 바짝 서는 자리라 거기서 스폰하면 돌아 나가지 못했다
#   (안전 노드 정지 "진행 경로에 장애물 0.28 m", Nav2 Failed to make progress)
# → 지도에서 1.2 m 사각형이 비고, 손님(평상시·피크)·직원 경로와 1.2 m 넘게, 정차 자리와 1 m 넘게 떨어진 곳.
#   그런 곳은 남동쪽 공터(충전소 앞)와 남서쪽 입구뿐이다. 남서쪽은 장면 3 손님(서쪽)이 몰리는 곳이라 다섯 대 모두
#   남동쪽 공터에서 서로 2.5 m 넘게 떨어뜨렸다
robots:
