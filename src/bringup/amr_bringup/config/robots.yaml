# system.launch.py가 띄우는 로봇. 앞에서부터 num_robots대를 쓴다.
# 스폰 자세 [x, y, yaw] (m, rad, Gazebo world 좌표). AMCL 초기 위치는 map_origin_in_world로 map 좌표로 바꿔 넣는다.
#
# 대기 구역(x 16~26, y −20~−14, amr_gazebo README)의 남쪽 끝(y −19)에 2 m 간격으로 두고 북쪽(+y)을 본다.
# 동적 장애물 경로·활동 범위(amr_gazebo config/dynamic_obstacles.yaml)와 1 m 이상 떨어뜨린다:
# 메인 통로(y 8.5~18.5)는 작업자 경로, 대기 구역 북쪽(x 5~18, y −17~−13)은 지게차 forklift_2 무작위 범위다 (#95 지수 리뷰).
# 7·10대 실험이면 아래에 더한다.
robots:
  amr_01: [17.0, -19.0, 1.57079633]
  amr_02: [19.0, -19.0, 1.57079633]
  amr_03: [21.0, -19.0, 1.57079633]
  amr_04: [23.0, -19.0, 1.57079633]
  amr_05: [25.0, -19.0, 1.57079633]
