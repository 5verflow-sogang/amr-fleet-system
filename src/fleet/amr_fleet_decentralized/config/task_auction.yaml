# 분산 경매(task_auction) 노드 파라미터. 로봇마다 하나씩 뜨므로 와일드카드
# 네임스페이스를 쓴다(amr_zone_client/config/zone_client.yaml과 동일한 방식).
# 로직 자체는 amr_fleet_decentralized/auction/params.py의 AuctionParams와
# 1:1로 맞춘다 - 노드가 아직 없어 지금은 실제로 로드되지 않는 초안이다.
/**/task_auction:
  ros__parameters:
    bid_window_s: 2.0
    # 하연과 임계값 통일 필요 - 확인 필요(README 참고). 우선 중앙 할당
    # (fleet_manager.yaml min_battery_percent)과 같은 값으로 맞췄다.
    min_battery_percent: 20.0
    robot_speed_mps: 1.0
