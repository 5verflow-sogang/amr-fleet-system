# 분산 경매(task_auction) 노드 파라미터. 로봇마다 하나씩 뜨므로 와일드카드
# 네임스페이스를 쓴다(amr_zone_client/config/zone_client.yaml과 동일한 방식).
# 로직 자체는 amr_fleet_decentralized/auction/params.py의 AuctionParams와 1:1로
# 맞춘다. 값은 10/7, 10/9 하연·이진 결정(docs/api.md 4-4절 "쟁점 정리") 그대로다.
/**/task_auction:
  ros__parameters:
    bid_window_s: 2.0
    # 결정: 중앙집중(fleet_manager.yaml min_battery_percent)과 같은 20% - 비교군
    # 조건을 같게 둔다.
    min_battery_percent: 20.0
    robot_speed_mps: 1.0
    # 결정: 중앙 Ack 재전송과 같게 1초 간격 x 5회, 그래도 ACCEPT가 없으면 재경매.
    award_resend_interval_s: 1.0
    award_max_attempts: 5
    # #155·#171: BID 1회성 발행이 디스커버리 레이스로 유실되는 문제 - 마감(bid_window_s)까지
    # 이 간격으로 같은 입찰을 다시 보낸다. AWARD를 받거나 마감되면 멈춘다.
    bid_resend_period_s: 0.5
    # 10/9 결정(#107·#108): ACCEPT 뒤 TaskStatus FAILED를 받으면 최대 1회 재경매, 그래도
    # 실패하면 실패로 남긴다. 중앙(fleet_manager.yaml assignment.failed_retries)과 같은 값.
    failed_retries: 1
    # 낙찰 로봇 장애 회수 (중앙 #132 assignment.reclaim_timeout_s와 같은 규칙): ACCEPT한 낙찰 로봇의
    # RobotState가 이 시간(실제 시간, s) 동안 끊기면 재경매한다. 0이면 끈다.
    reclaim_timeout_s: 5.0
    # 회수 재경매 상한. -1이면 상한 없음(#132와 같음). failed_retries와 따로 센다.
    max_reclaims: -1
    # 맡은 작업 해제 안전장치(동시 낙찰 경합): ACCEPT 뒤 이 시간(실제 시간, s) 동안 내 RobotState가 한 번도
    # BUSY가 안 되면(작업이 시작 안 됨) 맡은 작업을 풀고 경고 로그를 남긴다. 0이면 끈다.
    commit_timeout_s: 30.0
    # 분산 모드 경매 트리거: 작업 방송을 구독하고, 살아 있는 로봇(RobotState를 최근 alive_timeout_s 안에
    # 받은 로봇, robot_id 순) 중 crc32(task_id) mod 로봇 수 번째 로봇이 경매를 연다. false면 안 연다.
    open_auctions: true
    task_requests_topic: /fleet/task_requests
    alive_timeout_s: 3.0
    # 작업 방송으로 연 경매에 입찰이 없으면(모두 작업 중) 이 시간 뒤 새 auction_id로 다시 연다. 0이면 끝낸다.
    no_bid_retry_s: 1.0
    # ACCEPT 뒤 나에게 TaskAssignment를 보낸다(assignment_id = 1,000,000 + 로봇 번호 x 100,000 + 순번).
    # relayed_assignments: true면 /<robot_id>/fleet/task_assignments(amr_bt·가짜 로봇의 relayed:=true 구독 이름)로.
    # robot_index: -1이면 robot_id 끝 숫자(amr_03 -> 3).
    run_accepted_tasks: true
    relayed_assignments: true
    robot_index: -1
    # TaskAuction·TaskBid 구독 접두어. 기본은 절대 경로 원본(/fleet, 중계 없이 직접 구독) -
    # relayed:=true(launch 인자) 또는 이 값을 'fleet'로 주면 상대 이름(장애 주입기
    # relay_auction 중계본)을 구독한다. amr_bt의 server_topic_prefix와 같은 방식.
    auction_topic_prefix: /fleet
    robot_states_topic: /fleet/robot_states
    update_rate_hz: 10.0
