# 식당 시연 2 리허설: 일반 작업(priority 100) 사이에 회수 호출(collect, priority 200)이 섞여 들어온다.
# 하네스 tools/harness/scenarios/fleet_collect_aging.yaml(가짜 로봇 3대, 3 m/s)이 쓴다. seed는 launch 인자(반복 번호)라
# 같은 seed면 같은 일정이다. 결과: experiments/fleet_collect_aging
#
# 부하 근거 (가짜 로봇 3대, 3 m/s, 싣기·내리기 1 s씩):
# - 작업 1건 ≈ 25 s (이전 하역 위치 → 픽업 → 하역 직선 거리 / 3 m/s + 2 s, 아래 흐름으로 2000건 모의한 평균 24~25 s)
# - 처리량 ≈ 3대 / 25 s = 0.12 건/s
# - 평균 간격 6 s(poisson) = 0.167 건/s 중 일반 80 % = 0.133 건/s(처리량의 약 1.1배, "조금 많게"),
#   회수 20 % = 0.033 건/s(약 30 s마다 1건). 전체는 처리량의 약 1.4배라 실행 동안 큐가 계속 쌓인다 -
#   aging이 없으면 회수 호출이 늘 앞서고 일반 작업의 대기만 길어지는 상황을 만든다
# - 60건 × 6 s ≈ 365 s 동안 들어온다. 하네스는 480 s에 끝내 마지막 작업 뒤 약 2분을 더 본다
count: 60
start_delay_s: 5.0
arrival: poisson
interval_s: 6.0
flows:
  # 일반 작업: 입고 → 보관, 보관 → 출고 (basic.yaml과 같은 꼴)
  - type: delivery
    pickup: [dock_1, dock_2]
    dropoff: [rack_*]
    weight: 0.4
  - type: delivery
    pickup: [rack_*]
    dropoff: [dock_a]
    weight: 0.4
  # 회수 호출: 테이블 → 반납 카트. 식당 정차 위치가 없어 물류센터 C열 선반을 테이블로, dock_b를 반납 카트로 쓴다
  - type: collect
    pickup: [rack_c*]
    dropoff: [dock_b]
    weight: 0.2
    priority: [200, 200]
items:
  small: 0.5
  medium: 0.3
  large: 0.2
# 일반 작업 우선순위 (회수 호출은 위 흐름의 priority)
priority: [100, 100]
deadline_s: 0.0

# 부하 조건 (작업 생성기 load 인자, task_gen.select_load). 위 값이 overload(과부하, 첫 측정)이고, 아래는 그 위에 덮어쓴다.
# 처리량은 과부하 측정에서 잰 값 6.9 건/분 ≈ 0.115 건/s (가짜 로봇 3대, 3 m/s)를 기준으로 한다.
loads:
  # 과부하: 위 값 그대로 (일반 + 회수 ≈ 처리량의 1.4배, 회수 20 %)
  overload: {}
  # 실제 시연 부하: 일반 + 회수 합이 처리량의 약 0.7배. 0.115 × 0.7 ≈ 0.08 건/s → 평균 간격 12.5 s, 회수 비율은 그대로 20 %.
  # 20건 × 12.5 s ≈ 240 s 동안 들어온다 (하네스는 330 s에 끝내 마지막 작업 뒤 약 1.5분을 더 본다)
  normal:
    count: 20
    interval_s: 12.5
  # 회수 몰림: 평소는 normal과 같고, 60~180 s(120 s) 동안 회수 호출만 평균 6 s 간격(0.167 건/s ≈ 처리량의 1.45배)으로 더 들어온다.
  # 그 120 s 동안 전체는 처리량의 약 2.1배, 회수만으로도 처리량을 넘는다 - aging이 없으면 이 동안(과 밀린 회수를 처리하는 동안)
  # 일반 작업이 하나도 할당되지 않는 기아가 생기는지 본다. 버스트 회수는 평소 회수 흐름과 같은 테이블 → 반납 카트다
  collect_burst:
    count: 20
    interval_s: 12.5
    bursts:
      - start_s: 60.0
        duration_s: 120.0
        interval_s: 6.0
        flow:
          type: collect
          pickup: [rack_c*]
          dropoff: [dock_b]
          priority: [200, 200]
