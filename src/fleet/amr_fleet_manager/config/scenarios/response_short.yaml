# 응답 시간 KPI용 짧은 작업 시나리오 (하네스 fleet_stack --set task_scenario=response_short).
# 응답 시간은 "작업 명령 → 로봇 첫 움직임"이라 이동 거리와 상관없다. basic.yaml(도크 ↔ 랙, 약 55 m)은 로봇 5대가
# 한 실행(25분)에 할당을 십여 건밖에 못 받아 50회를 모으기 어렵다(GCP 10/14, 시뮬레이션 속도 약 0.5배).
# 대기 구역 바로 위 B–C 열 사이 통로(폭 5.8 m)의 랙 6곳만 오가게 해 작업 하나가 짧게 끝나고 할당이 자주 생긴다.
# 대기 구역에서 첫 작업까지 약 12 m, 그 뒤 작업 하나는 4~16 m.
count: 60
start_delay_s: 5.0
arrival: fixed
interval_s: 10.0
flows:
  - type: delivery
    pickup: [rack_c5, rack_c6, rack_c7]
    dropoff: [rack_b5, rack_b6, rack_b7]
    weight: 1.0
  - type: delivery
    pickup: [rack_b5, rack_b6, rack_b7]
    dropoff: [rack_c5, rack_c6, rack_c7]
    weight: 1.0
items:
  small: 0.5
  medium: 0.3
  large: 0.2
priority: [0, 0]
deadline_s: 0.0
