# 작업 생성기가 쓰는 스테이션: 로봇이 멈춰 서는 자세 [x, y, yaw] (m, rad, Gazebo world 좌표).
# 상태: 제안 (하연). 도킹 자세는 ArUco 마커 위치에 맞춰 지수가 확정한다.
# 작업 생성기는 map_origin_in_world(기본: 지도 v2 0.025 m 정렬값, 위치추정과 같음)로 map 좌표로 바꿔 Task에 넣는다.
#
# 계산 근거 (amr_gazebo README 배치 표, 랙 5.0 x 1.2 m)
# - 도크: 플랫폼 1.5 m + 정차 구역 3 m. 정차 구역 가운데(벽에서 3 m)에서 벽을 본다
# - 랙: 랙 면에서 0.8 m 떨어져 랙을 본다. A·B열은 남쪽 통로에서, C열은 북쪽 통로(B–C)에서 접근한다
#   (B열 북쪽은 좁은 통로라 피한다)
# - 충전소: 도킹 패드 위(벽에서 1 m)에서 충전기를 본다
# - 대기: 대기 구역(x 16~26, y −20~−14) 남쪽 끝 한 줄. 북쪽은 지게차 forklift_2 무작위 범위(x 5~18, y −17~−13)라 피한다.
#   amr_bringup robots.yaml 스폰 자리와 같아 RETURN 작업은 로봇을 처음 자리로 돌려보낸다
stations:
  # 입고 도크 (서쪽 벽)
  dock_1: [-27.0, 16.0, 3.14159265]
  dock_2: [-27.0, 11.0, 3.14159265]
  # 출고 도크 (동쪽 벽)
  dock_a: [27.0, 16.0, 0.0]
  dock_b: [27.0, 11.0, 0.0]
  # 선반 A열 (y=5, 남쪽 면 y=4.4)
  rack_a1: [-22.5, 3.6, 1.57079633]
  rack_a2: [-15.0, 3.6, 1.57079633]
  rack_a3: [-7.5, 3.6, 1.57079633]
  rack_a4: [0.0, 3.6, 1.57079633]
  rack_a5: [7.5, 3.6, 1.57079633]
  rack_a6: [15.0, 3.6, 1.57079633]
  rack_a7: [22.5, 3.6, 1.57079633]
  # 선반 B열 (y=-2, 남쪽 면 y=-2.6). rack_b4만 x=-1.9
  rack_b1: [-22.5, -3.4, 1.57079633]
  rack_b2: [-15.0, -3.4, 1.57079633]
  rack_b3: [-7.5, -3.4, 1.57079633]
  rack_b4: [-1.9, -3.4, 1.57079633]
  rack_b5: [7.5, -3.4, 1.57079633]
  rack_b6: [15.0, -3.4, 1.57079633]
  rack_b7: [22.5, -3.4, 1.57079633]
  # 선반 C열 (y=-9, 북쪽 면 y=-8.4)
  rack_c1: [-22.5, -7.6, -1.57079633]
  rack_c2: [-15.0, -7.6, -1.57079633]
  rack_c3: [-7.5, -7.6, -1.57079633]
  rack_c4: [0.0, -7.6, -1.57079633]
  rack_c5: [7.5, -7.6, -1.57079633]
  rack_c6: [15.0, -7.6, -1.57079633]
  rack_c7: [22.5, -7.6, -1.57079633]
  # 충전 스테이션 (남쪽 벽)
  charger_c1: [-24.0, -19.0, -1.57079633]
  charger_c2: [-21.0, -19.0, -1.57079633]
  charger_c3: [-18.0, -19.0, -1.57079633]
  # 대기 위치 (RETURN 목적지)
  wait_1: [17.0, -19.0, 0.0]
  wait_2: [19.0, -19.0, 0.0]
  wait_3: [21.0, -19.0, 0.0]
  wait_4: [23.0, -19.0, 0.0]
  wait_5: [25.0, -19.0, 0.0]
