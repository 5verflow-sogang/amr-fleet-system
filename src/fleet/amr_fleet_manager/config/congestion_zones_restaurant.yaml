# 식당(푸드코트) 월드 혼잡도 구역 (congestion_node #296, docs/api.md 4-5절). 12구역 (11/28, 민지. 이전 7구역은 지수 프로토타입)
#
# area: [x_min, x_max, y_min, y_max] (m, map 좌표). capacity: 이 인원이면 혼잡도 1.0
# map = world: 식당 지도(amr_mapping/maps/restaurant_gt)는 월드 SDF에서 바로 그려 map_origin_in_world [0, 0, 0]이다.
# 구역은 서로 겹치지 않는다 (경계 포함 판정이라 이웃 구역 사이를 0.01 m 띄웠다). 배치는 amr_gazebo/worlds/restaurant.sdf 머리말,
# 정차 자세는 stations_restaurant.yaml.
#
# 나눈 기준 (7구역 → 12구역)
# - 홀: hall_west·hall_east 두 덩어리를 세로 통로 하나에 구역 하나(aisle_1~5)로 나눴다. 경계는 테이블 열 가운데
#   (x -8.8, -5.75, -2.7, 0.35, 3.4)라 손님이 경계선을 따라 걷지 않는다. 우회 통로(x -7.275, 시나리오 1-2)가 aisle_1로
#   따로 잡혀 "서쪽 통로는 막히고 우회로는 비었다"가 혼잡도에 드러난다.
# - 긴 통로: 매장 앞(12.6 m)을 stall_west·stall_east로, 남쪽 통로(22 m)를 south_west·south_east로 반씩 나눴다.
#   한쪽 끝만 붐벼도 통로 전체에 벌점이 붙던 문제를 줄인다.
# - 가로로는 나누지 않았다. 칸마다 정원이 1~2명이 되어 손님 한 명에 혼잡도가 0과 1을 오간다.
# - 구역 이름 buffet_line·west_aisle·cafe는 그대로 둔다 (손님 파일·1-2 우회 도구·대시보드 테스트가 이 이름을 쓴다).
#   buffet_line은 배치 v3(#355)에서 매장 5·6 앞이 된다. 범위는 같다.
#
# capacity는 통로 폭과 길이로 잡은 [가정]이다: 폭 1.5 m 안팎 통로 길이 약 2.3 m에 1명이면 로봇(폭 0.54 m)이 비켜 가기
# 어려워진다고 보고 길이에 비례해 잡았다 (예전 "길이 7 m에 3명"과 같은 비율). 폭 1.0 m인 aisle_5만 2명으로 낮췄다.
# 측정(구역 통과 시간이 손님 0명일 때의 2배가 되는 인원)으로 고칠 예정이다.
#
# 손님 파일별 구역 인원 (경로를 따라 머무는 시간 비율로 어림, 11/28):
#   peak(1-1 이전)    buffet_line 3.3, west_aisle 3.1 → 둘 다 1.0. aisle_1·aisle_5 1.3, 나머지 1 미만
#   peak_scene12(1-2) west_aisle 3.1 → 1.0, aisle_5 1.3, 나머지 1 이하. 우회 통로 aisle_1은 0.4
#   peak_stand(1-1, #355) west_aisle 4명 → 1.0, south_west 3명 → 1.0, stall_east·aisle_1·south_east 1명
#   평상시             aisle_1 3.4, aisle_2 2.2, aisle_3 0.4 (예전 hall_west 6명이 두 통로로 나뉜다)
zones:
  - id: buffet_line
    area: [-11.9, -6.1, 3.0, 4.63]
    capacity: 4
    description: 서쪽 픽업 자리 앞 (v2 배식대 buffet_1·2, v3 매장 5·6). 손님 줄
  - id: stall_west
    area: [-6.09, 0.2, 3.0, 4.63]
    capacity: 3
    description: 매장 1·2 카운터 앞 (stall_1·2 픽업 자리)
  - id: stall_east
    area: [0.21, 6.5, 3.0, 4.63]
    capacity: 3
    description: 매장 3·4 카운터 앞 (stall_3·4 픽업 자리)
  - id: west_aisle
    area: [-11.9, -9.73, -5.0, 2.99]
    capacity: 3
    description: 서쪽 통로 (셀프 코너 앞, 남서쪽 입구에서 서쪽 픽업 자리로 가는 지름길)
  - id: aisle_1
    area: [-9.72, -5.76, -5.0, 2.99]
    capacity: 3
    description: 세로 통로 x -7.275 (테이블 1·2열 사이, 시나리오 1-2 우회 통로, 폭 1.61 m)
  - id: aisle_2
    area: [-5.75, -2.71, -5.0, 2.99]
    capacity: 3
    description: 세로 통로 x -4.225 (2·3열 사이, 기둥 2개)
  - id: aisle_3
    area: [-2.70, 0.34, -5.0, 2.99]
    capacity: 3
    description: 세로 통로 x -1.175 (3·4열 사이)
  - id: aisle_4
    area: [0.35, 3.39, -5.0, 2.99]
    capacity: 3
    description: 세로 통로 x 1.875 (4·5열 사이, 기둥 2개)
  - id: aisle_5
    area: [3.40, 5.40, -5.0, 2.99]
    capacity: 2
    description: 4인석과 6인석 사이 통로 (폭 1.0 m, 로봇 한 대만 지나간다)
  - id: cafe
    area: [5.41, 11.9, -4.5, 2.99]
    capacity: 4
    description: 동쪽 좌석 (6인 테이블 L01~L04와 사이 좁은 통로, 부스 b02·b03, 2인석 c01·c02). b01은 매장 앞 높이라 구역 밖
  - id: south_west
    area: [-11.9, -1.2, -7.3, -5.01]
    capacity: 3
    description: 남쪽 통로 서쪽 반 (입구·키오스크·퇴식대 앞, return_1·2)
  - id: south_east
    area: [-1.19, 10.5, -7.3, -5.01]
    capacity: 3
    description: 남쪽 통로 동쪽 반 (정수대·충전소 C1~C3 앞)
