# 식당(푸드코트) 월드 혼잡도 구역 (congestion_node #296, docs/api.md 4-5절). 상태: 프로토타입 (지수)
#
# area: [x_min, x_max, y_min, y_max] (m, map 좌표). capacity: 이 인원이면 혼잡도 1.0
# map = world: 식당 지도(amr_mapping/maps/restaurant_gt)는 월드 SDF에서 바로 그려 map_origin_in_world [0, 0, 0]이다.
# 구역은 서로 겹치지 않는다 (경계 포함 판정이라 이웃 구역 사이를 0.01 m 띄웠다). 손님 경로(dynamic_obstacles_restaurant*.yaml)가
# 경계선 위를 지나지 않게 잡았다. 배치는 amr_gazebo/worlds/restaurant.sdf 머리말, 정차 자세는 stations_restaurant.yaml.
#
# 피크 몰림(dynamic_obstacles_restaurant_peak.yaml)에서 west_aisle·buffet_line이 1.0까지 오른다.
# 평상시(dynamic_obstacles_restaurant.yaml)는 구역마다 0~1명이다.
# capacity는 통로 폭으로 잡은 [가정]이다: 1.5 m 안팎 통로 길이 7 m에 3명이면 로봇(폭 0.54 m)이 비켜 가기 어렵다.
zones:
  - id: buffet_line
    area: [-11.9, -6.1, 3.0, 4.63]
    capacity: 4
    description: 배식대 앞 (buffet_1·2 픽업 자리, 손님 줄)
  - id: stall_front
    area: [-6.09, 6.5, 3.0, 4.63]
    capacity: 6
    description: 매장 4곳 카운터 앞 (stall_1~4 픽업 자리, 서 있는 손님 5명은 정지 모델이라 안 센다)
  - id: west_aisle
    area: [-11.9, -9.73, -5.0, 2.99]
    capacity: 3
    description: 서쪽 통로 (셀프 코너 앞, 남서쪽 입구에서 배식대로 가는 지름길)
  - id: hall_west
    area: [-9.72, -1.2, -5.0, 2.99]
    capacity: 6
    description: 홀 서쪽 반 (t01~t03, t06~t08, t11~t13 주변)
  - id: hall_east
    area: [-1.19, 5.4, -5.0, 2.99]
    capacity: 6
    description: 홀 동쪽 반 (t04·t05, t09·t10, t14·t15 주변)
  - id: cafe
    area: [5.41, 11.9, -4.5, 2.99]
    capacity: 4
    description: 동쪽 좌석 (4인석 동쪽 통로, 6인 테이블 L01~L04와 사이 좁은 통로, 부스 b02·b03, 2인석 c01·c02). b01은 매장 앞 높이라 구역 밖
  - id: south
    area: [-11.9, 4.0, -7.3, -5.01]
    capacity: 5
    description: 남쪽 입구-퇴식구 (return_1·2)
