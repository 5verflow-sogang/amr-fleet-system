# 자동 생성: amr_fleet_core.traffic.permit_zones (restaurant_gt.yaml, stations_restaurant.yaml). 손으로 고치지 말고 다시 만든다.
# 기준: 통로 폭 < 1.3 m, 정차 자리 사이 최단 경로가 1 m 이상 지나는 곳, 긴 방향 양 끝 여유 0.6 m,
# 겹치면 하나로, 충전·대기 자리는 뺀다. 검토 그림: 같은 이름의 .png (--png로 다시 그린다)
#
# area_world: [x_min, x_max, y_min, y_max] (m, Gazebo world 좌표 = 식당 map 좌표). 로봇 측 규칙은 zones.yaml과 같다.
zones:
