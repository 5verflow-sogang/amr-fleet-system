# Fleet 서버 파라미터. 실험마다 바뀌는 값(assignments_csv, epoch_file, zones_file, 강제종료 시각)은 launch 인자로 받는다.
fleet_manager:
  ros__parameters:
    server_id: fleet_manager
    assignment:
      # nearest / load_balance / hungarian. 기본값은 비교 실험 후 확정 (amr_fleet_core README 미결)
      algorithm: nearest
      # 이보다 배터리가 낮은 로봇은 할당 후보에서 뺀다 (%)
      min_battery_percent: 20.0
      # FAILED로 보고된 작업을 큐로 되돌려 다시 할당하는 횟수. 넘으면 실패로 남긴다.
      # 분산 경매의 재경매(최대 1회)와 같게 둔다 (api.md 4-4절)
      failed_retries: 1
      # 작업을 맡은 로봇의 RobotState가 이 시간 동안 끊기면 로봇이 죽은 것으로 보고 작업을 회수해 다시 할당한다
      # (실제 시간, s). 0이면 회수하지 않는다. robot_timeout_s 이상
      reclaim_timeout_s: 5.0
      # 스테이션 예약 (m): 맡겨진 작업의 픽업·하역 위치에서 이 거리 안을 쓰는 작업은 그 작업이 끝날 때까지 맡기지 않는다.
      # 같은 도크로 가는 두 작업을 동시에 내보내 두 로봇이 한 자리에서 막혔다 (11/2 fleet_stack, dock_a).
      # 0이면 끈다. 스테이션 간격(도크 5 m)보다 충분히 작게 둔다
      station_clearance_m: 1.0
      # 비용 함수. euclidean: 로봇 → 작업 시작점 직선 거리 /
      # congestion: 직선 거리 + congestion_weight × Σ(혼잡도 × 그 직선이 혼잡 구역 안을 지나는 길이) (식당 시연 1-1).
      # congestion이면 /fleet/congestion(혼잡도 노드)을 구독한다. 아직 못 받았으면 euclidean과 같다.
      # load_balance는 할당 수를 먼저 보고 비용은 동률일 때만 봐서 혼잡도가 거의 안 먹힌다. 시연은 nearest·hungarian
      cost_fn: euclidean
      # 혼잡도 1.0인 구역 1 m를 (1 + 이 값) m로 본다. 시간으로 보면 (평소 속도 / 혼잡 구역 속도 − 1)이다
      # (속도 필터 55%만이면 0.8). 3.0은 멈춤·우회까지 감안한 시연용 값이고, 켬/끔 측정(작업 5)으로 다시 정한다
      congestion_weight: 3.0
      # 혼잡도를 이 시간 동안 못 받으면 euclidean으로 돌아간다 (실제 시간, s). 혼잡도 노드는 2 Hz
      congestion_timeout_s: 3.0
      # 비용 + 이 값 × (필요 배터리 / 남은 배터리) [m] (energy.* 모델). 배터리가 많은 로봇이 먼 작업을 맡는다. 0이면 끈다
      battery_weight: 0.0
    # 자동 충전 배정 (배터리 인지 운영 1단계). 끄면 지금처럼 min_battery_percent 밑 로봇을 빼기만 한다 (B0).
    # 충전기·대기 위치 파일(charging.stations_file)과 지도 원점은 launch 인자로 받는다 (작업 생성기와 같은 파일)
    charging:
      enabled: false
      # 놀고 있는 로봇이 이보다 낮으면 빈 충전기 중 가장 가까운 곳으로 보낸다 (%). min_battery_percent보다 높게
      low_percent: 30.0
      # 운영 중(충전하러 가거나 충전 중이 아닌) 로봇을 최소 이만큼 남긴다 (N). 동시 충전 ≤ 살아 있는 로봇 − N.
      # 0이면 충전기 수로만 묶는다
      min_in_service: 0
      # 스테이션 이름 패턴. 충전을 마친 로봇은 빈 대기 위치로 보낸다 (wait_pattern을 비우면 충전기에 그대로 둔다)
      charger_pattern: charger_*
      wait_pattern: wait_*
      # 피크 대비 (4단계). 피크 시간대 [시작, 끝, 시작, 끝, ...] (서버 시작부터 노드 시계 s). [0.0]이면 끈다.
      # 작업 생성기 profile의 바쁜 구간과 같은 시각으로 맞춘다 (생성기는 서버가 뜬 뒤 수 초 늦게 시작한다)
      peaks: [0.0]
      # 피크 시작 이만큼 전부터 pre_peak_percent 밑인 놀고 있는 로봇도 미리 충전하러 보낸다 (s, 0이면 끔)
      pre_peak_s: 0.0
      pre_peak_percent: 80.0
      # 피크 중 동시 충전 상한 (최소 운영 대수 규칙과 둘 중 작은 쪽, 0이면 더 묶지 않음)
      peak_max_charging: 0
      # 피크 중 충전 목표 (%). 닿으면 서버가 충전 작업을 취소해 끝내고 대기 위치로 보낸다. 100이면 끝까지
      peak_target_percent: 100.0
    # 에너지 예측 배정 (배터리 인지 운영 2단계). 필요 배터리 = (현재 위치 → 픽업 → 배달지 → 가장 가까운 충전기) 직선 거리
    # × path_factor × (move_per_m + idle_per_s / speed_mps) + reserve_percent. 모자란 로봇은 그 작업에서만 뺀다.
    # 충전기는 charging.stations_file에서 고른다. 소모율은 로봇(amr_bt battery.* / 가짜 로봇)과 같게 둔다
    energy:
      enabled: false
      move_per_m: 0.05
      idle_per_s: 0.002
      # 평균 주행 속도 (m/s). 가는 동안의 정지 소모를 거리로 바꾸는 데만 쓴다
      speed_mps: 0.5
      # 직선 거리 → 실제 경로 길이 비율 (통로를 돌아가는 만큼. 가짜 로봇은 직선이라 1.0)
      path_factor: 1.3
      # 충전기에 닿았을 때 남겨 둘 여유 (%)
      reserve_percent: 5.0
      # 충전 속도 (%/s)·목표 (%). 자동 충전을 켜면, 작업을 마친 뒤 충전 기준(charging.low_percent) 밑이라 충전 차례를
      # 기다려야 하는 경우 그 대기 시간 × idle_per_s를 필요 배터리에 더한다 (대기 시간은 충전 중인 로봇의 남은 시간으로 추정)
      charge_per_s: 0.5
      charge_target_percent: 100.0
    # 이 시간 동안 RobotState가 안 오면 할당 후보에서 뺀다 (실제 시간, s)
    robot_timeout_s: 3.0
    resend:
      # Ack가 없으면 같은 assignment_id를 이 간격으로 다시 보낸다 (실제 시간, s).
      # 주입 지연 최대 500ms + 로봇 처리 시간보다 커야 불필요한 재전송이 줄어든다
      interval_s: 1.0
      # 재전송 한도. 넘으면 작업을 큐로 되돌려 다시 할당한다. 첫 발송은 세지 않는다
      max_resends: 5
    # heartbeat 주기 (실제 시간, s). 연구 1 실험 변수
    heartbeat_period_s: 0.2
    # 작업표 방송 주기 (실제 시간, s)
    task_table_period_s: 1.0
    traffic:
      # 구역 허가 유효 시간 (노드 시계, s). 로봇은 구역 안에서 이보다 짧은 주기로 다시 요청해 연장한다.
      # 구역 목록 파일(traffic.zones_file)은 launch 인자 zones_file로 받는다 (기본 config/zones.yaml)
      lease_s: 5.0
      # lease가 지나도 반납 전까지는 구역을 다른 로봇에 주지 않는다 (통로 안에서 만료되면 로봇은 빠져나간 뒤 반납).
      # 로봇이 죽어 반납이 안 오는 경우를 위해, 마지막 요청 후 이 시간이 지나면 푼다 (노드 시계, s)
      release_timeout_s: 30.0
      # 교착 해소 전략. revoke: 순환이 생기면 우선순위 낮은 로봇의 허가 회수(후진) /
      # avoid: 순환을 닫게 될 대기 요청을 거부(REJECTED, 다른 경로로 재계획). amr_fleet_core README '교착 탐지'
      deadlock_strategy: revoke
    # 재전송·구역 만료 확인 주기 (s)
    tick_s: 0.05
