# 식당 시연용 Fleet 서버 덮어쓰기. fleet_manager.yaml 위에 얹는다:
#   ros2 launch amr_fleet_manager fleet_manager.launch.py #     extra_params_file:=$(ros2 pkg prefix amr_fleet_manager)/share/amr_fleet_manager/config/fleet_manager_restaurant.yaml
fleet_manager:
  ros__parameters:
    assignment:
      # 우선순위 aging (amr_fleet_core README '우선순위 aging'). 회수 호출(priority 200)이 일반 작업(100)보다 먼저 나가되,
      # 일반 작업이 60 s 기다리면 새 회수 호출과 같아지게 한다: 100 / 60 s ≈ 1.667 /s.
      # 같아지면 먼저 들어온 쪽이 앞서므로, 60 s 넘게 기다린 일반 작업은 그 뒤에 들어온 회수 호출보다 먼저 나간다.
      # 둘 다 같은 속도로 오르므로 차이(100)는 늘 "60 s 더 기다림"과 같다 - 회수 호출끼리·일반 작업끼리 순서는 그대로다
      aging_rate: 1.667
