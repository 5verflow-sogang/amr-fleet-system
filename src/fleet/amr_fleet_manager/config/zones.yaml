# 구역 허가(ZoneRequest/ZoneGrant) 대상 구역. 한 번에 capacity대까지만 들어간다.
# 상태: 좁은 통로 2곳 확정 (이진, 10/5). 교차로는 1차 연동 뒤 이진이 월드 좌표로 골라 추가한다.
#
# area_world: 구역 범위 [x_min, x_max, y_min, y_max] (m, Gazebo world 좌표). 로봇 측(이진)이 진입 판단에 쓴다.
#             서버는 zone_id와 capacity만 쓰고 이 값은 읽지 않는다.
#             지도 v1(10/9) 인계 뒤 map 좌표로 바꿔 확정한다.
#
# 로봇 측 규칙 (이진, 10/5): 경계 3 m 앞에서 요청, 허가가 없으면 경계 0.5 m 앞에서 정지.
# 1초마다 다시 요청(연장), 구역을 벗어나면 반납.
zones:
  - id: narrow_01
    capacity: 1
    area_world: [-5.0, -4.4, -2.6, -1.4]
    description: 좁은 통로 ① rack_b3–rack_b4 사이, 폭 0.6 m 길이 1.2 m
  - id: narrow_02
    capacity: 1
    # 월드 수정(랙 이동, 이진) 후 값. 수정 전에는 양쪽이 막힌 구간이 3.1 m뿐이다
    area_world: [-4.4, 0.6, -1.4, -0.8]
    description: 좁은 통로 ② B열 북쪽, 폭 0.6 m 길이 5.0 m
