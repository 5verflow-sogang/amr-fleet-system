# 식당(푸드코트) 월드(amr_gazebo/worlds/restaurant.sdf, 프로토타입)용 스테이션: 로봇이 멈춰 서는 자세 [x, y, yaw] (m, rad, Gazebo world 좌표).
# 상태: 프로토타입 (지수). 식당 정답 지도(amr_mapping/maps/restaurant_gt)는 map = world라 map_origin_in_world [0, 0, 0]이다.
#
# 계산 근거 (restaurant.sdf 머리말 배치도, 서빙 로봇 body:=serving 0.565 x 0.537 m)
# - 매장(stall): 카운터 앞면(y 4.63)에서 로봇 앞면까지 약 0.2 m, 북쪽(카운터)을 본다. 옆에 기다리는 손님과 0.4 m 이상
# - 4인 테이블: 테이블(1.2 x 0.75 m) 북쪽 끝에서 로봇 앞면까지 0.15 m, 남쪽(테이블)을 본다. 의자는 동서쪽에 있다.
#   행 사이 통로가 1.8 m라 정차한 로봇 뒤로 약 1.08 m가 남는다 (다른 로봇이 지나갈 수 있다, BellaBot 최소 통로 0.8 m)
# - 6인 테이블(L): 벤치가 동서 긴 변에 있어 테이블 북쪽·남쪽 끝에서 0.2 m. 부스(b): 테이블 서쪽 끝에서 0.15 m, 동쪽을 본다
# - 배식대(buffet): 매장과 같은 규칙. 앞면 y 4.63, 북쪽을 본다
# - 퇴식구: 퇴식대 스테인리스 선반(0.85 x 0.7 m) 앞면(y -7.25)에서 약 0.37 m, 남쪽을 본다
# - 충전소: 도킹 패드 위(벽에서 1 m)에서 충전기를 본다 (물류센터와 같은 규칙)
# - 대기: 동쪽 벽을 따라 한 줄, 홀(서쪽)을 본다
stations:
  # 매장 카운터 (음식 픽업): 1 한식, 2 분식, 3 양식, 4 카페
  stall_1: [-4.5, 4.15, 1.57079633]
  stall_2: [-1.5, 4.15, 1.57079633]
  stall_3: [1.5, 4.15, 1.57079633]
  stall_4: [4.5, 4.15, 1.57079633]
  # 배식대 (서쪽, 직원이 올려 둔 음식을 받는다). 배식대 앞면 y 4.63, 사이에 서 있는 손님(x -9.0)과 0.37 m
  buffet_1: [-9.9, 4.15, 1.57079633]
  buffet_2: [-8.1, 4.15, 1.57079633]
  # 4인 테이블 (3행 x 5열, 북서쪽부터)
  t01: [-8.8, 2.73, -1.57079633]
  t02: [-5.75, 2.73, -1.57079633]
  t03: [-2.7, 2.73, -1.57079633]
  t04: [0.35, 2.73, -1.57079633]
  t05: [3.4, 2.73, -1.57079633]
  t06: [-8.8, -0.27, -1.57079633]
  t07: [-5.75, -0.27, -1.57079633]
  t08: [-2.7, -0.27, -1.57079633]
  t09: [0.35, -0.27, -1.57079633]
  t10: [3.4, -0.27, -1.57079633]
  t11: [-8.8, -3.27, -1.57079633]
  t12: [-5.75, -3.27, -1.57079633]
  t13: [-2.7, -3.27, -1.57079633]
  t14: [0.35, -3.27, -1.57079633]
  t15: [3.4, -3.27, -1.57079633]
  # 6인 테이블 L01~L04 (2 x 2, 긴 변이 남북): 북쪽 줄은 북쪽 끝, 남쪽 줄은 남쪽 끝에서 0.2 m(벤치가 0.036 m 더 길어 제자리 회전 여유), 테이블을 본다
  L01: [6.1, 3.983, -1.57079633]
  L02: [8.806, 3.983, -1.57079633]
  L03: [6.1, -1.655, 1.57079633]
  L04: [8.806, -1.655, 1.57079633]
  # 동쪽 벽 부스 (테이블이 벽에 붙음): 테이블 서쪽 끝(x 10.75)에서 0.15 m, 동쪽을 본다
  b01: [10.32, 3.55, 0.0]
  b02: [10.32, 1.5, 0.0]
  b03: [10.32, -0.55, 0.0]
  # 2인 원형 테이블 (남동쪽): 테이블 북쪽 끝에서 0.15 m, 남쪽을 본다
  c01: [6.6, -2.91, -1.57079633]
  c02: [8.6, -2.91, -1.57079633]
  # 퇴식구 (빈 그릇)
  return_1: [-1.15, -6.6, -1.57079633]
  return_2: [1.15, -6.6, -1.57079633]
  # 충전 스테이션 (남쪽 벽)
  charger_c1: [5.0, -7.0, -1.57079633]
  charger_c2: [6.5, -7.0, -1.57079633]
  charger_c3: [8.0, -7.0, -1.57079633]
  # 대기 위치 (RETURN 목적지)
  wait_1: [11.2, -7.0, 3.14159265]
  wait_2: [11.2, -5.8, 3.14159265]
  wait_3: [11.2, -4.6, 3.14159265]
  wait_4: [11.2, -3.4, 3.14159265]
  wait_5: [11.2, -2.2, 3.14159265]
