# 식당 중앙 통로를 한 대만 들어가는 구역으로 (restaurant_gt 지도에서 잰 자유 공간 x 6.95~7.95, y -1.45~4.35)
zones:
  - id: aisle_center
    capacity: 1
    # 남쪽은 입구 앞(y -2.3)까지: -1.45에서 끊으면 한 대가 통로를 나오는 동안 다른 한 대가 입구 앞을 가로질러
    # 나오던 로봇이 막히고 제자리 회전 복구를 하다 벤치에 끼었다 (11/17 zone 00)
    area_world: [6.95, 7.95, -2.3, 4.35]
    description: 식당 중앙 통로, 폭 1.0 m 길이 5.8 m (가운데 y 1.1에서 가로 통로와 만난다)
